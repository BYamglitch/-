<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>理科</title>

<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;
  --science:#315b9a;--social:#28705f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.wrap{width:min(920px,100%)}
.card{background:var(--card);border-radius:28px;padding:clamp(24px,4vw,42px);box-shadow:0 18px 45px rgba(23,32,51,.10)}
h1{font-size:clamp(30px,5vw,48px);margin:0 0 10px;text-align:center}
.lead{font-size:clamp(16px,2.2vw,20px);line-height:1.7;color:var(--muted);text-align:center;margin-bottom:26px}
.grid{display:grid;gap:16px}
.btn{display:flex;align-items:center;gap:18px;width:100%;min-height:112px;padding:20px 24px;border-radius:22px;text-decoration:none;color:#fff;font-weight:800;box-shadow:0 10px 24px rgba(0,0,0,.10);transition:transform .08s ease}
.btn:active{transform:scale(.985)}
.icon{font-size:38px;flex:0 0 auto}
.text{display:block;font-size:clamp(23px,3vw,31px);line-height:1.25}
.sub{display:block;margin-top:6px;font-size:14px;line-height:1.45;opacity:.9;font-weight:700}
.science{background:linear-gradient(135deg,#274f8c,#5377b2)}
.social{background:linear-gradient(135deg,#1c6252,#438878)}
.chem{background:linear-gradient(135deg,#365e9f,#6282b8)}
.bio{background:linear-gradient(135deg,#456f57,#6d9478)}
.mix-sci{background:linear-gradient(135deg,#203d78,#4d67a7)}
.japan{background:linear-gradient(135deg,#8b4d52,#b87378)}
.world{background:linear-gradient(135deg,#2f6985,#5a91aa)}
.mix-soc{background:linear-gradient(135deg,#185d4d,#3d806f)}
.back{display:block;margin-top:18px;text-align:center;color:#526070;font-size:16px;font-weight:700;text-decoration:none;padding:14px}
@media(min-width:700px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}.grid.three .btn{min-height:150px;flex-direction:column;justify-content:center;text-align:center}}
</style>

</head>
<body>

</div>

</div></div>
</body>
</html>
