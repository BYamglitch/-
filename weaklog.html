<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>英語 共通苦手ログ・紙ドリル・最終模試</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}.wrap{max-width:1080px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dce4ee;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 7px 24px #24354b0d}h1{margin:0 0 8px;font-size:30px}h2{margin:0 0 10px}.sub,.muted{color:#6b778c;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stat{background:#f1f5fa;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:25px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.controls label{font-weight:800;font-size:13px}.controls select{width:100%;margin-top:5px;padding:11px;border:1px solid #ccd7e5;border-radius:11px;background:#fff}.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}button,.back{border:0;border-radius:12px;padding:13px 15px;font-weight:900;font-size:16px;cursor:pointer;text-decoration:none;text-align:center}.primary{background:#2563eb;color:white}.secondary{background:#e8eef7;color:#26364c}.print{background:#167a52;color:white}.danger{background:#fff1f2;color:#a32437}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #e5ebf2;padding:9px 6px;text-align:left;vertical-align:top}.score{font-weight:900}.tag{font-size:11px;color:#76839a}.slow{color:#b45309;font-weight:800}.apps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{background:#eef4ff;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}#paper{display:none}.paperTitle{text-align:center;margin:0 0 14px}.qitem{margin:0 0 17px;break-inside:avoid}.qnum{font-weight:900}.answerLine{border-bottom:1px solid #555;height:27px;margin-top:7px}.answerPage{page-break-before:always}.answerItem{margin:0 0 11px}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.controls,.btns{grid-template-columns:1fr}.wide{grid-column:1/-1}}@media print{body{background:#fff}.wrap>#dashboard{display:none!important}#paper{display:block!important}.wrap{max-width:none;padding:8mm 10mm}.paperPage{font-size:12.5pt}.qitem{margin-bottom:7mm}.answerLine{height:8mm}.tag{font-size:8pt;color:#555}@page{size:A4;margin:10mm}}
</style></head><body><main class="wrap"><section id="dashboard">
<div class="card"><h1>📚 英語 共通苦手ログ</h1><div class="sub">全英語アプリの「誤答・時間切れ・正解したが時間がかかった問題」を横断集計します。誤答回数と回答時間が大きいほど、紙ドリル・最終模試で優先されます。</div><div id="appChips" class="apps"></div></div>
<div class="card"><div class="stats"><div class="stat"><b id="allN">0</b>記録問題</div><div class="stat"><b id="weakN">0</b>要復習</div><div class="stat"><b id="slowN">0</b>遅答あり</div><div class="stat"><b id="gradN">0</b>改善</div><div class="stat"><b id="appsN">0</b>アプリ</div></div></div>
<div class="card"><h2>紙ドリル／最後の模擬テスト</h2><div class="controls"><label>問題数<select id="count"><option>20</option><option selected>30</option><option>50</option></select></label><label>紙ドリル条件<select id="threshold"><option value="any">誤答または遅答が1回以上</option><option value="2">誤答2回以上</option><option value="3">誤答3回以上</option><option value="slow">回答が遅かった問題だけ</option></select></label><label>模試モード<select id="mode"><option value="weak" selected>苦手重視</option><option value="balance">バランス</option><option value="real">本番風</option></select></label></div><div class="btns"><button id="drillBtn" class="primary">苦手紙ドリルを作る</button><button id="mockBtn" class="primary">最後の模擬テストを作る</button><button id="printBtn" class="print">表示中の問題を印刷</button></div><div class="muted" style="margin-top:10px">苦手度＝誤答回数＋時間切れ＋遅答回数＋平均回答時間＋最近のつまずき＋複数アプリでのつまずきを総合。模試では高得点の苦手を優先しつつ、1アプリだけに偏らないよう自動調整します。</div></div>
<div class="card"><h2>現在の苦手ランキング</h2><div style="overflow:auto"><table><thead><tr><th>問題</th><th>答え</th><th>アプリ</th><th>誤答</th><th>遅答</th><th>平均秒</th><th>苦手度</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="card"><a class="back secondary" href="english.html">← 英語メニューへ</a> <button id="clearBtn" class="danger">ログを初期化</button></div></section>
<section id="paper"><div class="paperPage"><h1 id="paperTitle" class="paperTitle"></h1><div id="questions"></div></div><div class="paperPage answerPage"><h1 class="paperTitle">解答</h1><div id="answers"></div></div></section></main>
<script>
const KEY="weakLogV1",$=id=>document.getElementById(id);
function load(){try{return Object.values(JSON.parse(localStorage.getItem(KEY)||"{}")||{})}catch(e){return []}}
function wrongN(r){return(r.wrong||0)+(r.timeout||0)}function slowN(r){return r.slow||0}function avgSec(r){return r.responseSamples?((r.totalResponseSec||0)/r.responseSamples):0}
function daysAgo(ts){return Math.max(0,(Date.now()-(ts||0))/86400000)}
function score(r){const w=(r.wrong||0),to=(r.timeout||0),sl=slowN(r),er=r.attempts?(w+to)/r.attempts:0,av=avgSec(r),lim=r.slowSec||10,timeRatio=av?Math.min(2.5,av/lim):0,recent=Math.max(0,3-daysAgo(r.lastSeenAt)/7),cross=Math.max(0,((r.apps||[]).length||1)-1)*1.5,improve=Math.min(r.fastStreak||0,4)*1.4;return Math.round((w*4+to*5+sl*2.5+er*8+timeRatio*3+recent+cross-improve)*10)/10}
function isGrad(r){return (r.fastStreak||0)>=3 && wrongN(r)>0}function isWeak(r){return wrongN(r)>0||slowN(r)>0||score(r)>=4}
function rows(){return load().filter(r=>r.subject==="英語"||!r.subject).sort((a,b)=>score(b)-score(a))}function apps(r){return(r.apps&&r.apps.length?r.apps:[r.app]).filter(Boolean).join("・")}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function render(){const a=rows(),w=a.filter(r=>isWeak(r)&&!isGrad(r)),g=a.filter(isGrad),s=a.filter(r=>slowN(r)>0),appSet=[...new Set(a.flatMap(r=>(r.apps&&r.apps.length?r.apps:[r.app]).filter(Boolean)))];$("allN").textContent=a.length;$("weakN").textContent=w.length;$("slowN").textContent=s.length;$("gradN").textContent=g.length;$("appsN").textContent=appSet.length;$("appChips").innerHTML=appSet.map(x=>`<span class="chip">${esc(x)}</span>`).join("")||'<span class="muted">まだログがありません</span>';$("rows").innerHTML=w.slice(0,150).map(r=>`<tr><td>${esc(r.question)}<div class="tag">${esc(r.category||r.unit||"")}</div></td><td>${esc(r.answer)}</td><td>${esc(apps(r))}</td><td>${wrongN(r)}</td><td class="slow">${slowN(r)}</td><td>${avgSec(r)?avgSec(r).toFixed(1):"—"}</td><td class="score">${score(r)}</td></tr>`).join("")||'<tr><td colspan="7">まだ苦手ログがありません。</td></tr>'}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function keyOf(x){return x.itemId||[x.app,x.question,x.answer].join("|")}
function addUnique(out,r){if(!out.some(x=>keyOf(x)===keyOf(r)))out.push(r)}
function diversified(pool,n){const sorted=[...pool].sort((a,b)=>score(b)-score(a)),out=[],by={};for(const r of sorted){const a=(r.apps&&r.apps[0])||r.app||"その他";(by[a]||(by[a]=[])).push(r)}const groups=Object.values(by);let moved=true;while(out.length<n&&moved){moved=false;for(const g of groups){const r=g.shift();if(r){addUnique(out,r);moved=true;if(out.length>=n)break}}}for(const r of sorted){if(out.length>=n)break;addUnique(out,r)}return out}
function fill(out,pool,n){for(const r of diversified(pool,n)){if(out.length>=n)break;addUnique(out,r)}return out}
function paper(list,title){$("paperTitle").textContent=title;$("questions").innerHTML=list.map((r,i)=>`<div class="qitem"><div><span class="qnum">${i+1}.</span> ${esc(r.question)}</div><div class="tag">${esc(apps(r))} ／ ${esc(r.category||r.unit||"")} ／ 苦手度 ${score(r)}</div><div class="answerLine"></div></div>`).join("");$("answers").innerHTML=list.map((r,i)=>`<div class="answerItem"><b>${i+1}.</b> ${esc(r.answer)} <span class="tag">（${esc(r.question)}）</span></div>`).join("");window._paper=list;alert(`${title}を${list.length}問作成しました。「表示中の問題を印刷」でA4印刷できます。`)}
$("drillBtn").onclick=()=>{const n=+$("count").value,th=$("threshold").value;let p=rows().filter(r=>!isGrad(r));if(th==="any")p=p.filter(isWeak);else if(th==="slow")p=p.filter(r=>slowN(r)>0);else p=p.filter(r=>wrongN(r)>=+th);p=p.sort((a,b)=>score(b)-score(a));if(!p.length)return alert("条件に合う苦手問題がまだありません。");paper(diversified(p,n),"英語 苦手集中ドリル")};
$("mockBtn").onclick=()=>{const n=+$("count").value,m=$("mode").value,a=rows(),w=a.filter(r=>isWeak(r)&&!isGrad(r)),rec=a.filter(r=>isGrad(r)||((r.correct||0)>=2&&isWeak(r))),o=a.filter(r=>!isWeak(r));const ratio=m==="weak"?[.7,.2,.1]:m==="balance"?[.5,.25,.25]:[.35,.25,.4];let p=[];fill(p,w,Math.round(n*ratio[0]));fill(p,rec,Math.round(n*(ratio[0]+ratio[1])));fill(p,o,n);fill(p,a,n);if(!p.length)return alert("模擬テストを作るための学習ログがまだありません。");paper(shuffle(p.slice(0,n)),"英語 最終模擬テスト")};
$("printBtn").onclick=()=>{if(!window._paper?.length)return alert("先に紙ドリルか模擬テストを作ってください。");window.print()};$("clearBtn").onclick=()=>{if(confirm("英語の苦手ログをすべて初期化しますか？")){localStorage.removeItem(KEY);render()}};window.addEventListener("weaklogchange",render);render();
</script></body></html>
