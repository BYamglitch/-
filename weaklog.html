<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>英語 苦手ログ・紙ドリル・模擬テスト</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #dce4ee;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 7px 24px #24354b0d}h1{margin:0 0 8px;font-size:30px}h2{margin:0 0 10px}.sub,.muted{color:#6b778c;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#f1f5fa;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:25px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.controls label{font-weight:800;font-size:13px}.controls select{width:100%;margin-top:5px;padding:11px;border:1px solid #ccd7e5;border-radius:11px;background:#fff}.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}button,.back{border:0;border-radius:12px;padding:13px 15px;font-weight:900;font-size:16px;cursor:pointer;text-decoration:none;text-align:center}.primary{background:#2563eb;color:white}.secondary{background:#e8eef7;color:#26364c}.print{background:#167a52;color:white}.danger{background:#fff1f2;color:#a32437}table{width:100%;border-collapse:collapse;font-size:14px}th,td{border-bottom:1px solid #e5ebf2;padding:9px 6px;text-align:left;vertical-align:top}.score{font-weight:900}.tag{font-size:11px;color:#76839a}#paper{display:none}.paperTitle{text-align:center;margin:0 0 14px}.qitem{margin:0 0 17px;break-inside:avoid}.qnum{font-weight:900}.answerLine{border-bottom:1px solid #555;height:27px;margin-top:7px}.answerPage{page-break-before:always}.answerItem{margin:0 0 11px}@media(max-width:700px){.stats,.controls,.btns{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}@media print{body{background:#fff}.wrap>#dashboard{display:none!important}#paper{display:block!important}.wrap{max-width:none;padding:8mm 10mm}.paperPage{font-size:13pt}.qitem{margin-bottom:8mm}.answerLine{height:8mm}.tag{font-size:8pt;color:#555}@page{size:A4;margin:10mm}}
</style></head><body><main class="wrap"><section id="dashboard">
<div class="card"><h1>📚 英語 苦手ログ</h1><div class="sub">落ち単語・スペリング・英単語書き・日本語→英文・英文組み立て・5-STAGEを横断集計。3回連続正解で「苦手卒業」です。</div></div>
<div class="card"><div class="stats"><div class="stat"><b id="allN">0</b>記録問題</div><div class="stat"><b id="weakN">0</b>苦手</div><div class="stat"><b id="gradN">0</b>卒業</div><div class="stat"><b id="appsN">0</b>アプリ</div></div></div>
<div class="card"><h2>紙ドリル／最後の模擬テスト</h2><div class="controls"><label>問題数<select id="count"><option>20</option><option>30</option><option>50</option></select></label><label>紙ドリル条件<select id="threshold"><option value="1">誤答1回以上</option><option value="2" selected>誤答2回以上</option><option value="3">誤答3回以上</option></select></label><label>模試モード<select id="mode"><option value="weak">苦手重視</option><option value="balance">バランス</option><option value="real">本番風</option></select></label></div><div class="btns"><button id="drillBtn" class="primary">苦手紙ドリルを作る</button><button id="mockBtn" class="primary">最後の模擬テストを作る</button><button id="printBtn" class="print">表示中の問題を印刷</button></div><div class="muted" style="margin-top:10px">模試は「苦手＋改善済み＋その他の学習済み問題」を混ぜます。ログが少ない場合は記録済み問題の範囲で自動調整します。</div></div>
<div class="card"><h2>現在の苦手</h2><div style="overflow:auto"><table><thead><tr><th>問題</th><th>答え</th><th>アプリ</th><th>誤答</th><th>連続○</th><th>苦手度</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div class="card"><a class="back secondary" href="english.html">← 英語メニューへ</a> <button id="clearBtn" class="danger">ログを初期化</button></div></section>
<section id="paper"><div class="paperPage"><h1 id="paperTitle" class="paperTitle"></h1><div id="questions"></div></div><div class="paperPage answerPage"><h1 class="paperTitle">解答</h1><div id="answers"></div></div></section></main>
<script>
const KEY="weakLogV1",$=id=>document.getElementById(id);function load(){try{return Object.values(JSON.parse(localStorage.getItem(KEY)||"{}")||{})}catch(e){return []}}function wrongN(r){return(r.wrong||0)+(r.timeout||0)}function daysAgo(ts){return Math.max(0,(Date.now()-(ts||0))/86400000)}function score(r){const w=wrongN(r),er=r.attempts?w/r.attempts:0,recent=Math.max(0,3-daysAgo(r.lastSeenAt)/7),cross=Math.max(0,((r.apps||[]).length||1)-1)*2;return Math.round((w*3+er*6+recent+cross-(r.streak||0)*1.8)*10)/10}function isGrad(r){return(r.streak||0)>=3}function rows(){return load().filter(r=>r.subject==="英語"||!r.subject).sort((a,b)=>score(b)-score(a))}function apps(r){return(r.apps&&r.apps.length?r.apps:[r.app]).filter(Boolean).join("・")}function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function render(){const a=rows(),w=a.filter(r=>wrongN(r)>0&&!isGrad(r)),g=a.filter(isGrad);$("allN").textContent=a.length;$("weakN").textContent=w.length;$("gradN").textContent=g.length;$("appsN").textContent=new Set(a.flatMap(r=>(r.apps&&r.apps.length?r.apps:[r.app]).filter(Boolean))).size;$("rows").innerHTML=w.slice(0,100).map(r=>`<tr><td>${esc(r.question)}<div class="tag">${esc(r.category||r.unit||"")}</div></td><td>${esc(r.answer)}</td><td>${esc(apps(r))}</td><td>${wrongN(r)}</td><td>${r.streak||0}</td><td class="score">${score(r)}</td></tr>`).join("")||'<tr><td colspan="6">まだ苦手ログがありません。</td></tr>'}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function fill(base,pool,n){const keys=new Set(base.map(x=>x.itemId||[x.app,x.question,x.answer].join("|")));for(const r of shuffle(pool)){const k=r.itemId||[r.app,r.question,r.answer].join("|");if(base.length>=n)break;if(!keys.has(k)){base.push(r);keys.add(k)}}return base}function paper(list,title){$("paperTitle").textContent=title;$("questions").innerHTML=list.map((r,i)=>`<div class="qitem"><div><span class="qnum">${i+1}.</span> ${esc(r.question)}</div><div class="tag">${esc(apps(r))} ／ ${esc(r.category||r.unit||"")}</div><div class="answerLine"></div></div>`).join("");$("answers").innerHTML=list.map((r,i)=>`<div class="answerItem"><b>${i+1}.</b> ${esc(r.answer)} <span class="tag">（${esc(r.question)}）</span></div>`).join("");window._paper=list;alert(`${title}を${list.length}問作成しました。「表示中の問題を印刷」でA4印刷できます。`)}
$("drillBtn").onclick=()=>{const n=+$("count").value,th=+$("threshold").value,p=rows().filter(r=>wrongN(r)>=th&&!isGrad(r));if(!p.length)return alert("条件に合う苦手問題がまだありません。");paper(p.slice(0,n),"英語 苦手集中ドリル")};
$("mockBtn").onclick=()=>{const n=+$("count").value,m=$("mode").value,a=rows(),w=a.filter(r=>wrongN(r)>0&&!isGrad(r)),rec=a.filter(r=>isGrad(r)||((r.correct||0)>=2&&wrongN(r)>0)),o=a.filter(r=>wrongN(r)===0&&!isGrad(r));const ratio=m==="weak"?[.7,.2,.1]:m==="balance"?[.5,.25,.25]:[.35,.25,.4];let p=[];p=fill(p,w,Math.round(n*ratio[0]));p=fill(p,rec,Math.round(n*(ratio[0]+ratio[1])));p=fill(p,o,n);p=fill(p,a,n);if(!p.length)return alert("模擬テストを作るための学習ログがまだありません。");paper(shuffle(p).slice(0,n),"英語 最終模擬テスト")};
$("printBtn").onclick=()=>{if(!window._paper?.length)return alert("先に紙ドリルか模擬テストを作ってください。");window.print()};$("clearBtn").onclick=()=>{if(confirm("英語の苦手ログをすべて初期化しますか？")){localStorage.removeItem(KEY);render()}};render();
</script></body></html>
