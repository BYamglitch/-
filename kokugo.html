<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>国語｜漢字学習</title>
<style>
:root{
  --bg:#f6f7fb;--card:#fff;--ink:#1f2937;--sub:#667085;--line:#dbe1ea;
  --shadow:0 8px 26px rgba(15,23,42,.07)
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif
}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:30px;margin:4px 0 6px}
.lead{color:var(--sub);line-height:1.7;margin:0 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{
  display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:20px;padding:24px;
  box-shadow:var(--shadow);min-height:220px
}
.card:active{transform:scale(.99)}
.icon{font-size:44px;margin-bottom:12px}
.title{font-size:25px;font-weight:900;margin-bottom:8px}
.desc{color:var(--sub);line-height:1.65;font-size:15px}
.tag{
  display:inline-block;margin-top:16px;border-radius:999px;padding:7px 11px;
  background:#eef2f7;font-size:13px;font-weight:800;color:#475569
}
.order{
  margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;line-height:1.7
}
.order b{font-size:16px}
@media(max-width:620px){
  .grid{grid-template-columns:1fr}
  .card{min-height:auto}
  h1{font-size:26px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>国語｜漢字学習</h1>
  <p class="lead">学習するモードを選んでください。</p>

  <div class="grid">
    <a class="card" href="kokugo-kanji-reading.html">
      <div class="icon">👀</div>
      <div class="title">読み・漢字4択</div>
      <div class="desc">
        読みと文章を見て、正しい漢字の熟語を4択から選びます。
        馴染みのない漢字を、まず「見て選べる」状態にする練習です。
      </div>
      <div class="tag">先におすすめ</div>
    </a>

    <a class="card" href="kokugo-kanji-write.html">
      <div class="icon">✍️</div>
      <div class="title">漢字を書く</div>
      <div class="desc">
        現在使っている漢字入力ドリルです。
        読みアプリで形を覚えたあと、実際に書けるかを確認します。
      </div>
      <div class="tag">仕上げ</div>
    </a>
  </div>

  <div class="order">
    <b>おすすめ順：</b> ① 読み・漢字4択 → ② 漢字を書く
  </div>
</div>
</body>
</html>
