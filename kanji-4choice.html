<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>国語漢字｜読み→熟語4択</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1f2937;--sub:#6b7280;--line:#d9deea;--ok:#e8f7ed;--ng:#fff0f0;--accent:#334155}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:18px 14px 40px}
h1{font-size:24px;margin:4px 0 6px}
.desc{color:var(--sub);font-size:14px;line-height:1.6;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(15,23,42,.05)}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
button{font:inherit}
.bigbtn{border:1px solid var(--line);background:white;border-radius:15px;padding:16px 12px;font-weight:700;font-size:17px;min-height:62px}
.bigbtn:active{transform:scale(.99)}
.turns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.turns button{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 14px;font-weight:700}
.turns button.sel{background:#eef2ff;border-color:#94a3b8}
.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px;font-size:14px;color:var(--sub)}
.progress{height:10px;background:#e9edf5;border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress>div{height:100%;background:#64748b;width:0%}
.qnum{font-weight:800}
.sentence{font-size:22px;line-height:1.75;margin:8px 0 4px}
.reading{font-size:17px;color:#475569;margin:0 0 16px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:2px solid var(--line);background:white;border-radius:16px;padding:18px 10px;font-weight:800;font-size:22px;min-height:74px}
.choice.correct{background:var(--ok);border-color:#86c69a}
.choice.wrong{background:var(--ng);border-color:#e6a1a1}
.choice:disabled{pointer-events:none;opacity:.82}
.feedback{min-height:34px;margin-top:14px;font-weight:800;font-size:17px}
.small{font-size:13px;color:var(--sub)}
.result-num{font-size:34px;font-weight:900;margin:6px 0}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center}
.stat b{display:block;font-size:23px;margin-top:4px}
.footerbtn{width:100%;border:0;border-radius:14px;padding:15px;background:#334155;color:white;font-size:17px;font-weight:800;margin-top:12px}
.warn{background:#fffbea;border:1px solid #eadca0;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;line-height:1.5}
@media(max-width:560px){.choices{grid-template-columns:1fr}.sentence{font-size:19px}.choice{font-size:20px;min-height:62px}}
</style>
</head>
<body>
<div class="wrap">
<section id="menu">
  <h1>国語漢字｜読み → 熟語4択</h1>
  <p class="desc">まずアプリで「読みと漢字の形」を結びつけ、そのあと紙ドリルで書く練習をするための前段階です。時間制限はありません。</p>
  <div class="card">
    <div class="menu-grid">
      <button class="bigbtn" data-mode="all">📚 全範囲シャッフル<br><span class="small">161問から20問</span></button>
      <button class="bigbtn" data-mode="weak">🔁 間違えた問題だけ<br><span class="small">端末内の苦手ログ</span></button>
    </div>
    <div style="margin-top:16px;font-weight:800">何ターンやる？</div>
    <div class="turns" id="turnBtns">
      <button data-turns="1">1</button><button data-turns="2">2</button><button data-turns="3" class="sel">3</button>
      <button data-turns="4">4</button><button data-turns="5">5</button><button data-turns="6">6</button>
    </div>
    <div class="warn">各ターン20問。最初に間違えた問題はそのターンの最後にもう一度出し、正解するまで繰り返します。点数は「初回正解」のみで計算します。</div>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="topbar"><span id="turnLabel"></span><span id="scoreLabel"></span></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="card">
    <div class="qnum" id="qnum"></div>
    <div class="sentence" id="sentence"></div>
    <div class="reading" id="reading"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</section>

<section id="result" class="hidden">
  <h1>ターン結果</h1>
  <div class="card">
    <div class="small" id="resultTurn"></div>
    <div class="result-num" id="resultScore"></div>
    <div class="result-grid">
      <div class="stat">初回正解<b id="statCorrect"></b></div>
      <div class="stat">初回ミス<b id="statWrong"></b></div>
      <div class="stat">総タップ<b id="statAttempts"></b></div>
    </div>
    <div id="nextInfo" class="small"></div>
    <button id="nextBtn" class="footerbtn">次へ</button>
  </div>
</section>
</div>

慌"]}, {"id": 136, "sentence": "今年の料金は昨年と同じく「【すえおき】」になった。", "reading": "すえおき", "answer": "据え置き", "distractors": ["吹奏", "睡眠", "免疫"]}, {"id": 137, "sentence": "これまで利用した「【りれき】」を確認する。", "reading": "りれき", "answer": "履歴", "distractors": ["廃棄", "放棄", "亀裂"]}, {"id": 138, "sentence": "この地域では水田を使った「【いなさく】」が盛んだ。", "reading": "いなさく", "answer": "稲作", "distractors": ["検索", "稲穂", "皆様"]}, {"id": 139, "sentence": "制服に合わせて黒い「【かわぐつ】」を履く。", "reading": "かわぐつ", "answer": "革靴", "distractors": ["堪忍", "歓迎", "肝臓"]}, {"id": 140, "sentence": "水の中に小さな「【きほう】」ができた。", "reading": "きほう", "answer": "気泡", "distractors": ["亀裂", "希薄", "忌中"]}, {"id": 141, "sentence": "道路を一時「【へいさ】」する。", "reading": "へいさ", "answer": "閉鎖", "distractors": ["平凡", "廃棄", "逮捕"]}, {"id": 142, "sentence": "宴会で昔ながらの「【こうた】」を歌う。", "reading": "こうた", "answer": "小唄", "distractors": ["子猫", "枯木", "交換"]}, {"id": 143, "sentence": "歴史上の「【いじん】」について調べる。", "reading": "いじん", "answer": "偉人", "distractors": ["威圧", "稲穂", "花瓶"]}, {"id": 144, "sentence": "理科の実験で水の「【ふってん】」を調べる。", "reading": "ふってん", "answer": "沸点", "distractors": ["覆面", "結婚", "匹敵"]}, {"id": 145, "sentence": "新しい機械が「【かどう】」する。", "reading": "かどう", "answer": "稼働", "distractors": ["彼氏", "漢字", "花瓶"]}, {"id": 146, "sentence": "水がたまった「【しょうたく】」の多い地域を歩く。", "reading": "しょうたく", "answer": "沼沢", "distractors": ["焦点", "驚愕", "庶民"]}, {"id": 147, "sentence": "昔は「【ぞうげ】」を使った工芸品も作られた。", "reading": "ぞうげ", "answer": "象牙", "distractors": ["嘔吐", "小唄", "幼稚"]}, {"id": 148, "sentence": "小物を「【きん】ちゃく」に入れる。", "reading": "きんちゃく", "answer": "巾着", "distractors": ["驚愕", "解釈", "忌中"]}, {"id": 149, "sentence": "砂漠で大きな「【すなあらし】」が起きた。", "reading": "すなあらし", "answer": "砂嵐", "distractors": ["吹奏", "据え置き", "睡眠"]}, {"id": 150, "sentence": "着物を選ぶために「【みたけ】」を測る。", "reading": "みたけ", "answer": "身丈", "distractors": ["皆様", "亀裂", "偉人"]}, {"id": 151, "sentence": "休日に祖父と「【いご】」を打つ。", "reading": "いご", "answer": "囲碁", "distractors": ["偉人", "威圧", "稲穂"]}, {"id": 152, "sentence": "息を使って楽器を鳴らす「【すいそう】」を練習する。", "reading": "すいそう", "answer": "吹奏", "distractors": ["清掃", "睡眠", "据え置き"]}, {"id": 153, "sentence": "地域の人々の「【しんこう】」について学ぶ。", "reading": "しんこう", "answer": "信仰", "distractors": ["寝室", "薪炭", "全貌"]}, {"id": 154, "sentence": "山頂では空気が「【きはく】」になる。", "reading": "きはく", "answer": "希薄", "distractors": ["亀裂", "気泡", "地獄"]}, {"id": 155, "sentence": "昔は「【しんたん】」を大切な燃料として使った。", "reading": "しんたん", "answer": "薪炭", "distractors": ["先端", "庶民", "斜面"]}, {"id": 156, "sentence": "工場の高い「【えんとつ】」から煙が出ている。", "reading": "えんとつ", "answer": "煙突", "distractors": ["寝室", "沈没", "屈折"]}, {"id": 157, "sentence": "友達と「【ゆかい】」な時間を過ごした。", "reading": "ゆかい", "answer": "愉快", "distractors": ["慈愛", "満開", "亀裂"]}, {"id": 158, "sentence": "国語の授業で新しい「【かんじ】」を学ぶ。", "reading": "かんじ", "answer": "漢字", "distractors": ["彼氏", "稼働", "花瓶"]}, {"id": 159, "sentence": "状況を「【はあく】」する。", "reading": "はあく", "answer": "把握", "distractors": ["廃棄", "地獄", "希薄"]}, {"id": 160, "sentence": "急な「【しゃめん】」をゆっくり下る。", "reading": "しゃめん", "answer": "斜面", "distractors": ["庶民", "薪炭", "覆面"]}, {"id": 161, "sentence": "祝いの席で「【さかずき】」を上げる。", "reading": "さかずき", "answer": "杯", "distractors": ["参詣", "免疫", "匹敵"]}];
const TURN_SIZE=20;
let selectedTurns=3, mode='all', currentTurn=0;
let queue=[], seenInitial=new Set(), initialCorrect=0, initialWrong=0, attempts=0;
let weakIds=new Set(JSON.parse(localStorage.getItem('kanjiWeak4choiceV1')||'[]'));

const $=s=>document.querySelector(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function chooseTurnBank(){
  let src=(mode==='weak' && weakIds.size)?BANK.filter(x=>weakIds.has(x.id)):BANK;
  if(src.length===0) src=BANK;
  return shuffle(src).slice(0,Math.min(TURN_SIZE,src.length));
}
function startSession(){
  currentTurn=1;
  startTurn();
}
function startTurn(){
  const chosen=chooseTurnBank();
  queue=chosen.map(x=>({...x,first:true}));
  seenInitial=new Set(); initialCorrect=0; initialWrong=0; attempts=0;
  $('#menu').classList.add('hidden'); $('#result').classList.add('hidden'); $('#quiz').classList.remove('hidden');
  render();
}
function render(){
  if(queue.length===0) return finishTurn();
  const q=queue[0];
  $('#turnLabel').textContent=`${currentTurn} / ${selectedTurns} ターン`;
  $('#scoreLabel').textContent=`初回正解 ${initialCorrect} / ${seenInitial.size}`;
  $('#qnum').textContent=`${Math.min(seenInitial.size+1,TURN_SIZE)} / ${Math.min(TURN_SIZE, mode==='weak'&&weakIds.size?weakIds.size:BANK.length)}`;
  $('#bar').style.width=`${Math.min(100,(seenInitial.size/TURN_SIZE)*100)}%`;
  $('#sentence').textContent=q.sentence;
  $('#reading').textContent=`読み：${q.reading}`;
  $('#feedback').textContent='';
  const opts=shuffle([q.answer,...q.distractors]);
  const box=$('#choices'); box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='choice'; b.textContent=o;
    b.onclick=()=>answer(o,b);
    box.appendChild(b);
  });
}
function answer(opt,btn){
  const q=queue[0]; attempts++;
  [...document.querySelectorAll('.choice')].forEach(b=>b.classList.add('disabled'));
  const firstTime=!seenInitial.has(q.id);
  if(firstTime) seenInitial.add(q.id);

  if(opt===q.answer){
    btn.classList.add('correct');
    $('#feedback').textContent='○ 正解！';
    if(firstTime){ initialCorrect++; weakIds.delete(q.id); }
    queue.shift();
    localStorage.setItem('kanjiWeak4choiceV1',JSON.stringify([...weakIds]));
    setTimeout(render,700);
  } else {
    btn.classList.add('wrong');
    [...document.querySelectorAll('.choice')].forEach(b=>{if(b.textContent===q.answer)b.classList.add('correct')});
    $('#feedback').textContent=`正解：${q.answer}`;
    if(firstTime) initialWrong++;
    weakIds.add(q.id);
    localStorage.setItem('kanjiWeak4choiceV1',JSON.stringify([...weakIds]));
    // move wrong question to end; next appearance is review, not score target
    const wrong=queue.shift(); wrong.first=false; queue.push(wrong);
    setTimeout(render,1200);
  }
}
function finishTurn(){
  $('#quiz').classList.add('hidden'); $('#result').classList.remove('hidden');
  $('#resultTurn').textContent=`${currentTurn} / ${selectedTurns} ターン`;
  $('#resultScore').textContent=`${initialCorrect} / ${seenInitial.size}`;
  $('#statCorrect').textContent=initialCorrect;
  $('#statWrong').textContent=initialWrong;
  $('#statAttempts').textContent=attempts;
  $('#nextInfo').textContent=`苦手ログ：${weakIds.size}問`;
  $('#nextBtn').textContent=currentTurn<selectedTurns?'次のターンへ':'メニューへ戻る';
}
$('#nextBtn').onclick=()=>{
  if(currentTurn<selectedTurns){currentTurn++;startTurn()}
  else{$('#result').classList.add('hidden');$('#menu').classList.remove('hidden')}
};
document.querySelectorAll('#turnBtns button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#turnBtns button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); selectedTurns=Number(b.dataset.turns);
});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode;
  if(mode==='weak' && weakIds.size===0){alert('まだ苦手ログがありません。まず全範囲シャッフルをやってみましょう。');return;}
  startSession();
});
</script>
