<script>
/* ===== 共通学習ログ v2 ===== */
(function(){
  if(window.StudyLog) return;
  const KEY="studyLogV1";
  let running=false, activeSec=0, last=0, turnStartedAt=null, meta={};

  function now(){ return Date.now(); }
  function localDate(ts){
    const d=new Date(ts), z=n=>String(n).padStart(2,"0");
    return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
  }
  function addActive(){
    if(running && !document.hidden && last){
      activeSec += Math.max(0,(now()-last)/1000);
    }
    last=now();
  }
  function load(){
    try{
      const x=JSON.parse(localStorage.getItem(KEY)||"[]");
      return Array.isArray(x)?x:[];
    }catch(e){ return []; }
  }
  function save(rows){
    if(rows.length>1000) rows=rows.slice(-1000);
    localStorage.setItem(KEY,JSON.stringify(rows));
  }

  window.StudyLog={
    startTurn(m={}){
      if(running) return;
      meta=m||{};
      running=true;
      activeSec=0;
      last=now();
      turnStartedAt=last;
    },
    finishTurn(m={}){
      if(!running) return;
      addActive();
      running=false;
      const ended=now();
      const x=Object.assign({},meta,m||{});
      const rows=load();
      rows.push({
        id: ended+"-"+Math.random().toString(36).slice(2,8),
        date: localDate(ended),
        subject: x.subject||"未分類",
        app: x.app||document.title||location.pathname.split("/").pop(),
        turnLabel: x.turnLabel||"1ターン",
        durationSec: Math.max(1,Math.round(activeSec)),
        startedAt: turnStartedAt||ended,
        endedAt: ended
      });
      save(rows);
      activeSec=0; last=0; turnStartedAt=null; meta={};
      window.dispatchEvent(new Event("studylogchange"));
    },
    cancelTurn(){
      running=false; activeSec=0; last=0; turnStartedAt=null; meta={};
    }
  };

  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){
      if(running) addActive();
    }else if(running){
      last=now();
    }
  });
})();
</script>


<script>
/* ===== 共通苦手ログ v1 ===== */
(function(){
  if(window.WeakLog) return;
  const KEY="weakLogV1";
  let active=null;
  const now=()=>Date.now();
  function load(){
    try{const x=JSON.parse(localStorage.getItem(KEY)||"{}");return x&&typeof x==="object"?x:{}}
    catch(e){return {}}
  }
  function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
  function cleanKey(s){return String(s??"").trim().slice(0,240)}
  window.WeakLog={
    start(meta={}){
      active={...meta,startedAt:now()};
    },
    result(kind,meta={},elapsedSec=null){
      const m={...(active||{}),...(meta||{})};
      const q=cleanKey(m.question||m.q||m.jp||m.prompt||"");
      const a=cleanKey(m.answer||m.a||m.en||"");
      if(!q && !m.key) return;
      const subject=cleanKey(m.subject||"未分類");
      const app=cleanKey(m.app||document.title||location.pathname.split("/").pop());
      const key=cleanKey(m.key||`${subject}|${app}|${q}|${a}`);
      const db=load();
      const r=db[key]||{
        subject,app,
        category:cleanKey(m.category||m.cat||m.tag||""),
        question:q,answer:a,
        correct:0,wrong:0,timeout:0,
        attempts:0,totalResponseSec:0,
        firstSeenAt:now(),lastSeenAt:now()
      };
      if(kind==="correct") r.correct++;
      else if(kind==="timeout") r.timeout++;
      else r.wrong++;
      r.attempts++;
      let sec=elapsedSec;
      if(sec==null && active?.startedAt) sec=(now()-active.startedAt)/1000;
      if(Number.isFinite(sec) && sec>=0) r.totalResponseSec += Math.min(sec,600);
      r.lastSeenAt=now();
      if(m.category||m.cat||m.tag) r.category=cleanKey(m.category||m.cat||m.tag);
      db[key]=r; save(db); active=null;
    },
    importWeak(meta,list){
      const db=load();
      for(const x of (list||[])){
        if(!x||!(x.wrong>0||x.timeout>0)) continue;
        const subject=cleanKey(meta.subject||x.subject||"未分類");
        const app=cleanKey(meta.app||x.app||"");
        const q=cleanKey(x.question||x.q||"");
        const a=cleanKey(x.answer||x.a||"");
        const key=cleanKey(x.key||`${subject}|${app}|${q}|${a}`);
        const cur=db[key]||{
          subject,app,category:cleanKey(x.category||x.cat||""),
          question:q,answer:a,correct:0,wrong:0,timeout:0,
          attempts:0,totalResponseSec:0,firstSeenAt:now(),lastSeenAt:now()
        };
        cur.wrong=Math.max(cur.wrong||0,Number(x.wrong)||0);
        cur.timeout=Math.max(cur.timeout||0,Number(x.timeout)||0);
        cur.correct=Math.max(cur.correct||0,Number(x.correct)||0);
        cur.attempts=Math.max(cur.attempts||0,cur.wrong+cur.timeout+cur.correct);
        cur.lastSeenAt=now(); db[key]=cur;
      }
      save(db);
    }
  };
})();
</script>

let range="all",turnCount=2,mode="scribble";

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){
 const t=String(s||"")
   .normalize("NFKC")
   .toLocaleLowerCase("en-US")
   .replace(/[\u2018\u2019\u02BC\uFF07]/g,"'")
   .replace(/[\u00A0\u1680\u2000-\u200B\u202F\u205F\u3000]/g," ")
   .replace(/\s+/g," ")
   .trim()
   .replace(/[.!?。！？]+$/g,"")
   .trim();
 return t;
}
function aliases(q){
 const e=norm(q.en), a=[e];
 if(e==="doesn't")a.push(norm("does not"));
 if(e==="can't")a.push(norm("cannot"),norm("can not"));
 if(e==="i'd like")a.push(norm("i would like"));
 return [...new Set(a)];
}
function inRange(q){
 if(range==="all")return true;
 return q.lessons.includes(range);
}
function lessonLabel(q){return q.lessons.map(x=>"Lesson "+x.slice(1)).join(" / ")}

document.querySelectorAll("#rangeBtns .pick").forEach(b=>b.onclick=()=>{range=b.dataset.range;document.querySelectorAll("#rangeBtns .pick").forEach(x=>x.classList.toggle("sel",x===b))});
document.querySelectorAll("#turnBtns .pick").forEach(b=>b.onclick=()=>{turnCount=+b.dataset.turns;document.querySelectorAll("#turnBtns .pick").forEach(x=>x.classList.toggle("sel",x===b))});
document.querySelectorAll("#modeBtns .pick").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("#modeBtns .pick").forEach(x=>x.classList.toggle("sel",x===b))});

function makeTurnSets(){
 const pool=shuffle(BANK.filter(inRange));
 if(pool.length<20)throw new Error("出題数が足りません");
 allTurnSets=[]; let pos=0;
 for(let t=0;t<turnCount;t++){
   if(pos+20>pool.length)pos=0;
   const source=pos===0&&t>0?shuffle(pool):pool;
   allTurnSets.push(source.slice(pos,pos+20));
   pos+=20;
 }
}

$("startBtn").onclick=()=>{
 makeTurnSets();turnIndex=0;totalAttempts=0;totalMistakes=0;
 $("setup").classList.add("hidden");startTurn();
};
function startTurn(){
StudyLog.startTurn({subject:'英語',app:'英語・書き',turnLabel:`第${currentTurn}ターン`});
 queue=shuffle(allTurnSets[turnIndex]).map((q,i)=>({...q,_id:turnIndex+"-"+i}));
 mastered=new Set();attempts=0;mistakes=0;
 $("turnResult").classList.add("hidden");$("quiz").classList.remove("hidden");
 showQ();
}
function showQ(){
 locked=false;hintCount=0;
 if(mastered.size===20) return finishTurn();
 cur=queue.shift();try{WeakLog.start({subject:"英語",app:"英語・書き",category:lessonLabel(cur),question:cur.jp,answer:cur.en})}catch(e){}
 if(!cur) return finishTurn();
 $("turnPill").textContent=`Turn ${turnIndex+1} / ${turnCount}`;
 $("progressPill").textContent=`習得 ${mastered.size} / 20`;
 $("progressBar").style.width=(mastered.size/20*100)+"%";
 $("jp").textContent=cur.jp;
 $("source").textContent=lessonLabel(cur);
 $("artCard").innerHTML=artFor(cur);
 $("hintText").textContent="ヒントはまだ使っていません";
 $("hintBtn").textContent="💡 1文字ヒント";
 $("feedback").className="feedback";
 $("feedback").textContent="";
 $("queueNote").textContent=`未習得：${20-mastered.size}問　／　誤答はこのターンの最後へ`;
 $("answerInput").value="";
 $("gradeBtns").classList.add("hidden");
 $("scribbleArea").classList.toggle("hidden",mode!=="scribble");
 $("canvasArea").classList.toggle("hidden",mode!=="canvas");
 if(mode==="canvas")clearCanvas();
 setTimeout(()=>{if(mode==="scribble")$("answerInput").focus()},80);
}
function submitAnswer(){
 if(locked)return;
 const v=norm($("answerInput").value);
 const ok=aliases(cur).includes(v);
 locked=true;attempts++;totalAttempts++;
 if(ok){try{WeakLog.result('correct')}catch(e){}
   mastered.add(cur._id);
   showFeedback(true,"○ 正解！");
 }else{try{WeakLog.result('wrong')}catch(e){}
   mistakes++;totalMistakes++;queue.push(cur);
   showFeedback(false,`× 正解：${cur.en}　→ ターンの最後でもう一度`);
 }
 setTimeout(showQ, ok?750:1450);
}
function showFeedback(ok,msg){const f=$("feedback");f.textContent=msg;f.className="feedback show "+(ok?"good":"bad")}
$("checkBtn").onclick=submitAnswer;
$("answerInput").addEventListener("keydown",e=>{if(e.key==="Enter")submitAnswer()});
$("clearBtn").onclick=()=>{$("answerInput").value="";$("answerInput").focus()};
$("keyboardBtn").onclick=()=>{$("answerInput").focus()};

function revealHint(){
 if(!cur)return;
 const ans=String(cur.en).replace("...","").trim();
 const letters=[...ans].filter(c=>/[A-Za-z]/.test(c)).length;
 if(hintCount<letters)hintCount++;
 let shown="",seen=0;
 for(const ch of ans){
   if(/[A-Za-z]/.test(ch)){
      if(seen>=hintCount)break;
      shown+=ch;seen++;
   }else if(seen>0&&seen<=hintCount)shown+=ch;
 }
 $("hintText").textContent=shown||"ヒントはまだ使っていません";
 $("hintBtn").textContent=hintCount>=letters?"💡 すべて表示済み":`💡 次の1文字（${hintCount}）`;
}
$("hintBtn").onclick=revealHint;
function speak(){
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cur.en.replace("...",""));u.lang="en-US";u.rate=.82;speechSynthesis.speak(u)}catch(e){}
}
$("audioBtn").onclick=speak;

function finishTurn(){
StudyLog.finishTurn({subject:'英語',app:'英語・書き',turnLabel:`第${currentTurn}ターン`});
 $("quiz").classList.add("hidden");$("turnResult").classList.remove("hidden");
 $("turnTitle").textContent=`Turn ${turnIndex+1}：100%習得！`;

 if(turnIndex===turnCount-1)$("nextTurnBtn").textContent="結果を見る";else $("nextTurnBtn").textContent="次のターンへ";
}
$("nextTurnBtn").onclick=()=>{

 }else startTurn();
};

// Canvas mode
const canvas=$("pad"),ctx=canvas.getContext("2d");let drawing=false,strokes=[],current=[];
function fitCanvas(){const r=canvas.getBoundingClientRect(),dpr=devicePixelRatio||1;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);redraw()}
function point(e){const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
function redraw(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);ctx.lineWidth=4;ctx.lineCap="round";ctx.strokeStyle="#1d2939";for(const st of strokes){if(st.length<2)continue;ctx.beginPath();ctx.moveTo(...st[0]);for(const p of st.slice(1))ctx.lineTo(...p);ctx.stroke()}$("canvasHint").classList.toggle("hidden",strokes.length>0)}
canvas.addEventListener("pointerdown",e=>{drawing=true;current=[point(e)];strokes.push(current);canvas.setPointerCapture(e.pointerId);redraw()});
canvas.addEventListener("pointermove",e=>{if(!drawing)return;current.push(point(e));redraw()});
canvas.addEventListener("pointerup",()=>drawing=false);canvas.addEventListener("pointercancel",()=>drawing=false);
function clearCanvas(){strokes=[];current=[];redraw()}
$("clearCanvasBtn").onclick=clearCanvas;
$("undoBtn").onclick=()=>{strokes.pop();redraw()};
$("revealBtn").onclick=()=>{if(locked)return;locked=true;$("feedback").textContent="正解："+cur.en;$("feedback").className="feedback show bad";$("gradeBtns").classList.remove("hidden")};
document.querySelectorAll("#gradeBtns [data-grade]").forEach(b=>b.onclick=()=>{
 attempts++;totalAttempts++;
 if(b.dataset.grade==="good"){mastered.add(cur._id);showFeedback(true,"○ 書けた！");setTimeout(showQ,700)}
 else{mistakes++;totalMistakes++;queue.push(cur);showFeedback(false,"× ターンの最後でもう一度");setTimeout(showQ,1000)}
});
addEventListener("resize",()=>{if(mode==="canvas")fitCanvas()});
setTimeout(fitCanvas,100);
</script>
</body>
