*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:920px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 8px 26px rgba(16,32,57,.06)}h1{font-size:clamp(28px,4vw,42px);margin:0 0 10px;line-height:1.2}.sub{color:var(--muted);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:18px 0}select,.btn{width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font-size:16px;font-weight:800}.btn{cursor:pointer}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.orange{background:var(--accent);color:#fff;border-color:var(--accent)}.pills{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pill{padding:7px 11px;border-radius:999px;background:#eef3f9;font-size:13px;font-weight:800}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.turn{font-size:28px;font-weight:900}.timer{font-size:22px;font-weight:900}.timer.danger{color:var(--bad)}.progress{height:10px;background:#e8edf4;border-radius:999px;overflow:hidden;margin:12px 0 20px}.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}.meta{color:var(--muted);font-weight:800;font-size:14px}.question{font-size:clamp(24px,4vw,36px);font-weight:900;line-height:1.45;margin:10px 0 20px}.options{display:grid;gap:12px}.opt{text-align:left;width:100%;border:2px solid var(--line);background:#fff;border-radius:16px;padding:18px;font-size:clamp(18px,3vw,23px);font-weight:800;cursor:pointer}.opt.correct{border-color:var(--good);background:#eaf8f0;color:#086d39}.opt.wrong{border-color:var(--bad);background:#fff0ee;color:#9c2d26}.opt.dim{opacity:.58}.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;font-weight:800;line-height:1.55}.feedback.show{display:block}.feedback.good{background:#eaf8f0;color:#086d39}.feedback.bad{background:#fff0ee;color:#9c2d26}.next{display:none;margin-top:16px}.next.show{display:block}.scorebox{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}.scorecard{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fafcff}.scorecard b{display:block;font-size:27px;margin-top:4px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.review{background:#fff2cc;color:#735200}@media(max-width:600px){.wrap{padding:10px}.card{padding:17px}}

<script>
/* ===== 共通学習ログ v2 ===== */
(function(){
  if(window.StudyLog) return;
  const KEY="studyLogV1";
  let running=false, activeSec=0, last=0, turnStartedAt=null, meta={};

  function now(){ return Date.now(); }
  function localDate(ts){
    const d=new Date(ts), z=n=>String(n).padStart(2,"0");
    return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
  }
  function addActive(){
    if(running && !document.hidden && last){
      activeSec += Math.max(0,(now()-last)/1000);
    }
    last=now();
  }
  function load(){
    try{
      const x=JSON.parse(localStorage.getItem(KEY)||"[]");
      return Array.isArray(x)?x:[];
    }catch(e){ return []; }
  }
  function save(rows){
    if(rows.length>1000) rows=rows.slice(-1000);
    localStorage.setItem(KEY,JSON.stringify(rows));
  }

  window.StudyLog={
    startTurn(m={}){
      if(running) return;
      meta=m||{};
      running=true;
      activeSec=0;
      last=now();
      turnStartedAt=last;
    },
    finishTurn(m={}){
      if(!running) return;
      addActive();
      running=false;
      const ended=now();
      const x=Object.assign({},meta,m||{});
      const rows=load();
      rows.push({
        id: ended+"-"+Math.random().toString(36).slice(2,8),
        date: localDate(ended),
        subject: x.subject||"未分類",
        app: x.app||document.title||location.pathname.split("/").pop(),
        turnLabel: x.turnLabel||"1ターン",
        durationSec: Math.max(1,Math.round(activeSec)),
        startedAt: turnStartedAt||ended,
        endedAt: ended
      });
      save(rows);
      activeSec=0; last=0; turnStartedAt=null; meta={};
      window.dispatchEvent(new Event("studylogchange"));
    },
    cancelTurn(){
      running=false; activeSec=0; last=0; turnStartedAt=null; meta={};
    }
  };

  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){
      if(running) addActive();
    }else if(running){
      last=now();
    }
  });
})();
</script>

const $=s=>document.querySelector(s);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const loadWeak=()=>JSON.parse(localStorage.getItem(STORE)||"{}"),saveWeak=w=>localStorage.setItem(STORE,JSON.stringify(w));
function addWeak(id){let w=loadWeak();w[id]=(w[id]||0)+1;saveWeak(w)}function reward(id){let w=loadWeak();if(w[id]){w[id]=Math.max(0,w[id]-1);saveWeak(w)}}
let normalTurns=3,cat="ALL",plan=[],currentTurn=0,qIndex=0,locked=false,timerId=null,left=LIMIT,turnResults=[],sessionMiss=[],totalCorrect=0;
function pool(){let p=cat==="ALL"?ALL:ALL.filter(q=>q.cat===cat);return p.length?p:ALL}
function makeNormal(){let p=shuffle(pool()),arr=[];for(let t=0;t<normalTurns;t++){if(p.length<TURN_SIZE)p=shuffle(pool());let b=p.splice(0,TURN_SIZE);if(b.length<TURN_SIZE){let ids=new Set(b.map(x=>x.id));b=b.concat(shuffle(pool().filter(x=>!ids.has(x.id))).slice(0,TURN_SIZE-b.length))}arr.push({type:"normal",label:`TURN ${t+1}`,qs:b})}return arr}
function makeReview(){let p=pool(),w=loadWeak(),picked=[],seen=new Set();[...sessionMiss].reverse().forEach(id=>{if(!seen.has(id)){let q=ALL.find(x=>x.id===id);if(q&&p.some(z=>z.id===q.id)){picked.push(q);seen.add(id)}}});Object.entries(w).sort((a,b)=>b[1]-a[1]).forEach(([id])=>{id=+id;if(!seen.has(id)){let q=p.find(x=>x.id===id);if(q){picked.push(q);seen.add(id)}}});shuffle(p).forEach(q=>{if(picked.length<TURN_SIZE&&!seen.has(q.id)){picked.push(q);seen.add(q.id)}});while(picked.length<TURN_SIZE)picked.push(shuffle(p)[0]);return {type:"review",label:"復習 TURN",qs:picked.slice(0,TURN_SIZE)}}
function ensureR(){if(!turnResults[currentTurn])turnResults[currentTurn]={correct:0,wrong:0,timeout:0,type:plan[currentTurn].type,label:plan[currentTurn].label};return turnResults[currentTurn]}

StudyLog.startTurn({subject:'家庭科',app:'家庭科・期末4択',turnLabel:'第1ターン'});normalTurns=+$("#turnCount").value;cat=$("#category").value;plan=makeNormal();currentTurn=0;qIndex=0;turnResults=[];sessionMiss=[];totalCorrect=0;$("#start").classList.add("hidden");$("#final").classList.add("hidden");$("#turnResult").classList.add("hidden");$("#quiz").classList.remove("hidden");showQ()}
function showQ(){locked=false;clearInterval(timerId);left=LIMIT;let t=plan[currentTurn],q=t.qs[qIndex],r=ensureR();$("#turnTitle").innerHTML=t.type==="review"?'<span class="pill review">復習 TURN</span>':t.label;$("#catLabel").textContent=q.cat;$("#qmeta").textContent=`${qIndex+1} / 20　｜　このターン ${r.correct} 点`;$("#question").textContent=q.q;$("#bar").style.width=`${qIndex/20*100}%`;$("#feedback").className="feedback";$("#nextBtn").classList.remove("show");$("#options").innerHTML="";shuffle([q.a,...q.d]).forEach(o=>{let b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>answer(o,b);$("#options").appendChild(b)});updateTimer();timerId=setInterval(()=>{left-=.1;if(left<=0){left=0;clearInterval(timerId);timeout()}updateTimer()},100)}
function updateTimer(){$("#timer").textContent=left.toFixed(1);$("#timer").classList.toggle("danger",left<=3)}
function lockOpts(a,clicked){document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===a)b.classList.add("correct");else if(b===clicked)b.classList.add("wrong");else b.classList.add("dim")})}
function answer(choice,btn){if(locked)return;locked=true;clearInterval(timerId);let q=plan[currentTurn].qs[qIndex],r=ensureR(),ok=choice===q.a;if(ok){r.correct++;totalCorrect++;reward(q.id)}else{r.wrong++;sessionMiss.push(q.id);addWeak(q.id)}lockOpts(q.a,btn);let f=$("#feedback");f.className="feedback show "+(ok?"good":"bad");f.innerHTML=ok?`✅ 正解！ <b>${q.a}</b>`:`❌ 正解は <b>${q.a}</b>`;$("#qmeta").textContent=`${qIndex+1} / 20　｜　このターン ${r.correct} 点`;if(ok)setTimeout(advance,1000);else $("#nextBtn").classList.add("show")}
function timeout(){if(locked)return;locked=true;let q=plan[currentTurn].qs[qIndex],r=ensureR();r.timeout++;sessionMiss.push(q.id);addWeak(q.id);lockOpts(q.a,null);let f=$("#feedback");f.className="feedback show bad";f.innerHTML=`⏰ 時間切れ。正解は <b>${q.a}</b>`;$("#nextBtn").classList.add("show")}
function advance(){qIndex++;if(qIndex>=20)finishTurn();else showQ()}$("#nextBtn").onclick=advance;

StudyLog.finishTurn({subject:'家庭科',app:'家庭科・期末4択',turnLabel:(plan[currentTurn]?.label||`第${currentTurn+1}ターン`)});clearInterval(timerId);$("#quiz").classList.add("hidden");$("#turnResult").classList.remove("hidden");let r=ensureR(),rev=plan[currentTurn].type==="review";$("#turnResultTitle").textContent=rev?"復習ターン終了！":`${plan[currentTurn].label} 終了！`;$("#turnScore").textContent=`${r.correct} / 20`;$("#totalScore").textContent=`${totalCorrect} / ${turnResults.length*20}`;$("#missCount").textContent=`${r.wrong+r.timeout}問`;$("#turnMessage").textContent=rev?"今回の誤答・時間切れを中心に復習しました。":(currentTurn===normalTurns-1?"次は、今回の誤答・時間切れを優先した復習ターンです。":"次の通常ターンへ進みます。");$("#continueBtn").textContent=rev?"最終結果を見る":"次のターンへ"}
$("#continueBtn").onclick=()=>{$("#turnResult").classList.add("hidden");if(plan[currentTurn].type==="review"){showFinal();return}currentTurn++;StudyLog.startTurn({subject:'家庭科',app:'家庭科・期末4択',turnLabel:(plan[currentTurn]?.label||`第${currentTurn+1}ターン`)});if(currentTurn===normalTurns)plan.push(makeReview());qIndex=0;$("#quiz").classList.remove("hidden");showQ()};
function showFinal(){$("#final").classList.remove("hidden");let total=turnResults.length*20,pct=Math.round(totalCorrect/total*100);$("#finalSummary").innerHTML=`<div class="scorebox"><div class="scorecard">総合得点<b>${totalCorrect} / ${total}</b></div><div class="scorecard">正答率<b>${pct}%</b></div><div class="scorecard">要復習<b>${new Set(sessionMiss).size}問</b></div></div>`;$("#scoreTable").innerHTML=`<table><thead><tr><th>ターン</th><th>得点</th><th>誤答</th><th>時間切れ</th></tr></thead><tbody>${turnResults.map(r=>`<tr><td>${r.type==="review"?"復習 TURN":r.label}</td><td><b>${r.correct} / 20</b></td><td>${r.wrong}</td><td>${r.timeout}</td></tr>`).join("")}</tbody></table>`}
$("#retryWeak").onclick=()=>{StudyLog.startTurn({subject:"家庭科",app:"家庭科・期末4択",turnLabel:"苦手だけ TURN"});let p=pool(),w=loadWeak(),qs=Object.entries(w).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).map(([id])=>p.find(q=>q.id===+id)).filter(Boolean);let ids=new Set(qs.map(q=>q.id));qs=qs.concat(shuffle(p.filter(q=>!ids.has(q.id))).slice(0,20-qs.length));plan=[{type:"review",label:"苦手だけ TURN",qs:qs.slice(0,20)}];normalTurns=0;currentTurn=0;qIndex=0;turnResults=[];sessionMiss=[];totalCorrect=0;$("#final").classList.add("hidden");$("#quiz").classList.remove("hidden");showQ()};
