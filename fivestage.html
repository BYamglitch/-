(function(){
  if(window.WeakLog && window.WeakLog.version==="ELL2") return;
  const KEY="weakLogV1"; let active=null; const now=()=>Date.now();
  const clean=s=>String(s??"").normalize("NFKC").trim().replace(/\s+/g," ").slice(0,800);

  function save(x){try{localStorage.setItem(KEY,JSON.stringify(x));window.dispatchEvent(new Event("weaklogchange"))}catch(e){}}
  function write(kind,m,elapsedSec=null){
    m=m||{}; const q=clean(m.question||m.q||m.jp||m.prompt||""), a=clean(m.answer||m.a||m.en||"");
    if(!q&&!a&&!m.itemId&&!m.key)return;
    const subject=clean(m.subject||"英語"), app=clean(m.app||document.title||location.pathname.split("/").pop()), itemId=clean(m.itemId||"");

    const slowSec=Number.isFinite(m.slowSec)?m.slowSec:(app.includes("日本語→英文")?6:app.includes("英文組み立て")?12:app.includes("5-STAGE")?8:app.includes("スペリング")?10:app.includes("落ち単語")?5:app.includes("書き")?15:10);
    const isSlow=sec!==null && sec>=slowSec;
    if(kind==="correct"){r.correct=(r.correct||0)+1;r.streak=(r.streak||0)+1;if(isSlow){r.slow=(r.slow||0)+1;r.fastStreak=0}else r.fastStreak=(r.fastStreak||0)+1}
    else if(kind==="timeout"){r.timeout=(r.timeout||0)+1;r.streak=0;r.fastStreak=0}
    else{r.wrong=(r.wrong||0)+1;r.streak=0;r.fastStreak=0}
    r.attempts=(r.attempts||0)+1;
    if(m.firstAttempt===true){if(kind==="correct")r.firstTryCorrect=(r.firstTryCorrect||0)+1;else r.firstTryWrong=(r.firstTryWrong||0)+1}

    r.lastResult=isSlow&&kind==="correct"?"slow":kind;r.lastSeenAt=t;db[key]=r;save(db);active=null;
  }

  const weak=active.filter(x=>weaknessScore(x)>0).sort((a,b)=>weaknessScore(b)-weaknessScore(a));
  const prep=active.filter(x=>x.type==="前置詞").length;
  $("mockIntroMsg").textContent=`今回・過去の苦手ログを反映して30問を作ります。苦手候補 ${weak.length}問 ／ 前置詞候補 ${prep}問。模擬テスト中は正解を表示せず、最後にまとめて採点します。`;
  $("mockIntro").classList.remove("hidden");
}
function buildMock(){
  const active=pool(), n=Math.min(30,active.length), chosen=[], used=new Set();
  const add=x=>{const k=qKey(x);if(!used.has(k)&&chosen.length<n){used.add(k);chosen.push(x)}};
  const ranked=shuffle(active).sort((a,b)=>weaknessScore(b)-weaknessScore(a));
  const weakTarget=Math.min(Math.ceil(n*.6),ranked.filter(x=>weaknessScore(x)>0).length);
  ranked.filter(x=>weaknessScore(x)>0).slice(0,weakTarget).forEach(add);
  const prepTarget=Math.min(Math.ceil(n*.25),active.filter(x=>x.type==="前置詞").length);
  shuffle(active.filter(x=>x.type==="前置詞")).sort((a,b)=>weaknessScore(b)-weaknessScore(a)).forEach(x=>{if(chosen.filter(y=>y.type==="前置詞").length<prepTarget)add(x)});
  shuffle(active).forEach(add);
  return shuffle(chosen).slice(0,n);
}
function startMock(){
  inMock=true;mockQueue=buildMock();mockIndex=0;mockCorrect=0;mockAnswers=[];
  $("mockIntro").classList.add("hidden");$("mockResult").classList.add("hidden");$("quiz").classList.remove("hidden");renderMock();
}
function renderMock(){fiveShownAt=performance.now();
  if(mockIndex>=mockQueue.length)return finishMock();
  locked=false;const cur=mockQueue[mockIndex];
  $("turnPill").textContent="最終模擬テスト";$("progressPill").textContent=`${mockIndex+1}/${mockQueue.length}`;$("bar").style.width=`${mockIndex/mockQueue.length*100}%`;
  $("type").textContent=`${cur.unit}｜${cur.stage}｜${cur.type}`;$("instruction").textContent=instructionFor(cur);$("pagePill").textContent=cur.page==="—"?"既存ドリル":`p.${cur.page}`;$("q").textContent=cur.q;
  showJapanese(cur)
  $("feedback").className="feedback hidden";$("small").textContent="本番モード：正解は最後にまとめて確認";$("opts").innerHTML="";
  [...new Map(shuffle(cur.opts).map(o=>[String(o).normalize("NFKC").toLowerCase().replace(/[?？!！。.．]+$/g,"").replace(/\s+/g," ").trim(),o])).values()].forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=displayOption(cur,o);b.dataset.value=o;b.onclick=()=>answerMock(b,o,cur);$("opts").appendChild(b)});
}
function answerMock(btn,o,cur){
  if(locked)return;locked=true;const ok=o===cur.a;if(ok){mockCorrect++;logCorrect(cur)}else{logWrong(cur)}
  mockAnswers.push({cur,selected:o,ok});btn.classList.add(ok?"correct":"wrong");setTimeout(()=>{mockIndex++;renderMock()},350);
}
function finishMock(){
  inMock=false;$("quiz").classList.add("hidden");$("mockResult").classList.remove("hidden");
  const total=mockQueue.length,pct=total?Math.round(mockCorrect/total*100):0,miss=mockAnswers.filter(x=>!x.ok);
  $("mockTitle").textContent=`模擬テスト ${mockCorrect}/${total}（${pct}%）`;
  $("mockSummary").textContent=miss.length?`誤答 ${miss.length}問。今回の誤答も苦手ログへ追加しました。次回の模擬テストでは優先出題されます。`:`全問正解！ 苦手ログには正解履歴を反映しました。`;
  const typeCount={};miss.forEach(x=>typeCount[x.cur.type]=(typeCount[x.cur.type]||0)+1);const top=Object.entries(typeCount).sort((a,b)=>b[1]-a[1]).slice(0,3);
  $("mockWeakness").className="feedback "+(miss.length?"ng":"ok");$("mockWeakness").textContent=top.length?`今回の弱点：${top.map(([t,n])=>`${t} ${n}問`).join(" ／ ")}`:"今回の弱点：なし";
  $("mockMissed").textContent=miss.length?miss.map((x,i)=>`${i+1}. [${x.cur.unit}・${x.cur.type}] ${x.cur.q}\n   あなた：${x.selected} ／ 正解：${x.cur.a}\n   日本語訳：${x.cur.jp}`).join("\n\n"):"";
}
$("mockStartBtn").onclick=startMock;$("mockRetryBtn").onclick=startMock;
</script></body></html>
