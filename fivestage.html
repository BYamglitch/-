function instructionFor(cur){

function render(){if(mastered>=queue.length+mastered || mastered>=20)return finishTurn();locked=false;const cur=queue[0];const target=Math.min(20,pool().length);$("turnPill").textContent=`Turn ${turnIndex+1}/${turns}`;$("progressPill").textContent=`習得 ${mastered}/${target}`;$("bar").style.width=`${mastered/target*100}%`;$("type").textContent=`${cur.unit}｜${cur.stage}｜${cur.type}`;$("instruction").textContent=instructionFor(cur);$("pagePill").textContent=cur.page==="—"?"既存ドリル":`p.${cur.page}`;$("q").textContent=cur.q;$("feedback").className="feedback hidden";$("small").textContent=`未習得：${target-mastered}問 ／ 誤答はこのターンの最後へ`;$("opts").innerHTML="";shuffle(cur.opts).forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>answer(b,o,cur,target);$("opts").appendChild(b)})}
