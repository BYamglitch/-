<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>社会・世界地理</title>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#172033;--muted:#657184;--line:#d9e0ea;
  --accent:#2b5f9e;--good:#137a48;--goodbg:#ebf8ef;
  --bad:#a23232;--badbg:#fff0ef;--warn:#c58a19;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;
}
button,select{font:inherit}
button{touch-action:manipulation}
.app{max-width:820px;margin:auto;padding:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:22px;box-shadow:0 8px 26px rgba(20,32,51,.06)
}
.hidden{display:none!important}
h1{font-size:clamp(28px,5vw,40px);line-height:1.18;margin:0 0 10px}
.lead{color:var(--muted);line-height:1.7;margin:0 0 18px}
.mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{
  min-height:92px;border:1px solid var(--line);border-radius:17px;background:#fff;
  padding:14px;text-align:left;font-size:18px;font-weight:900;color:var(--ink)
}
.mode small{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-top:6px;line-height:1.5}
.chapterbox{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:14px;background:#fbfcfe}
select{width:100%;min-height:48px;margin-top:8px;border:1px solid #bdc8d6;border-radius:12px;background:#fff;padding:8px 10px}
.chapterbtn,.action,.next{
  width:100%;border:0;border-radius:15px;padding:14px;font-size:17px;font-weight:900;margin-top:10px
}
.chapterbtn,.primary{background:var(--accent);color:#fff}
.secondary{background:#edf1f6;color:var(--ink)}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:16px}

.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pill{font-size:13px;font-weight:850;background:#eef2f8;padding:7px 10px;border-radius:999px}
.progress{height:10px;background:#e6ebf3;border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress div{height:100%;background:var(--accent);width:0;transition:width .25s ease}
.timerLabel{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}
.timer{height:14px;background:#e8edf4;border-radius:999px;overflow:hidden;margin-bottom:18px}
.timer div{height:100%;width:100%;background:var(--accent);transition:width .1s linear}
.section{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:7px}
.question{font-size:clamp(21px,5.5vw,29px);font-weight:900;line-height:1.45;margin:6px 0 18px}
.choices{display:grid;gap:11px}
.choice{
  width:100%;min-height:66px;border:2px solid var(--line);background:#fff;border-radius:16px;
  padding:13px 14px;text-align:left;font-size:18px;font-weight:800;line-height:1.4
}
.choice.correct{border-color:var(--good);background:var(--goodbg);color:#0e6c33}
.choice.wrong{border-color:var(--bad);background:var(--badbg);color:#982626}
.feedback{display:none;margin-top:14px;padding:13px 14px;border-radius:14px;background:#f2f5f9;line-height:1.5}
.feedback.show{display:block}
.feedback.good{border-left:5px solid var(--good)}
.feedback.bad{border-left:5px solid var(--bad)}
.next{display:none;background:var(--accent);color:#fff}
.next.show{display:block}
.mastery{
  margin-top:10px;padding:10px 12px;background:#f6f8fb;border-radius:13px;
  color:var(--muted);font-size:13px;font-weight:800
}
.bigscore{font-size:46px;font-weight:1000;margin:10px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0}
.stat{background:#f4f6fa;border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:25px}
.actions{display:grid;gap:10px}
.action{margin:0}
@media(max-width:520px){
  .app{padding:10px}
  .card{padding:17px}
  .mode-grid{grid-template-columns:1fr}
  .choice{min-height:70px;font-size:18px}
}

/* ===== iPad最適化 ===== */
.app{max-width:980px;padding:max(16px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.card{padding:clamp(22px,3vw,34px);border-radius:26px}
.mix-hero{
  width:100%;display:flex;align-items:center;gap:16px;margin:8px 0 16px;
  min-height:112px;padding:20px 22px;border:0;border-radius:22px;
  text-align:left;background:linear-gradient(135deg,#185d4d,#3d806f);color:#fff;
  box-shadow:0 10px 24px rgba(24,93,77,.22);cursor:pointer
}
.mix-hero b{display:block;font-size:clamp(23px,3.2vw,31px);line-height:1.25}
.mix-hero small{display:block;font-size:14px;line-height:1.5;margin-top:7px;font-weight:700;opacity:.92}
.hero-icon{font-size:38px;flex:0 0 auto}
.mode{min-height:104px;padding:17px;font-size:21px}
.mode small{font-size:13px}
.chapterbox{padding:17px}
.choice{min-height:76px;padding:16px 18px;font-size:clamp(19px,2.4vw,23px)}
.question{font-size:clamp(24px,3.5vw,32px);line-height:1.5}
.next,.action,.chapterbtn{min-height:58px;font-size:19px}
.timer{height:16px}
@media (min-width:700px) and (orientation:landscape){
  .choices{grid-template-columns:1fr 1fr;gap:14px}
  .choice{min-height:92px}
  .mode-grid{grid-template-columns:repeat(3,1fr)}
}
@media (min-width:700px) and (orientation:portrait){
  .mode-grid{grid-template-columns:1fr 1fr}
  .choices{grid-template-columns:1fr}
}

</style>
</head>

style="position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:9999;
text-decoration:none;background:#fff;color:#24324a;border:1px solid #d8dfeb;border-radius:999px;
padding:10px 14px;font:700 14px -apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;
box-shadow:0 4px 14px rgba(0,0,0,.12)">← メニュー</a>

<div class="app">

<section id="start" class="card">
  <div style="font-size:42px">🌍</div>
  <h1>社会・地理<br>期末テスト4択ドリル</h1>
  <div class="lead">
    <b>iPad用。</b> 1ターン30問・1問20秒。<br>
    間違えた問題・時間切れの問題は、<b>正解するまでそのターン内で再出題</b>します。
    「総合シャッフル」は世界地理15問＋日本地理15問を選び、30問の順番を完全に混ぜて出題します。
  </div>
  <button class="mix-hero" data-mode="mix">
    <span class="hero-icon">🔀</span>
    <span><b>世界地理＋日本地理　総合シャッフル</b><small>世界15問＋日本15問 ／ 30問をランダム順で出題</small></span>
  </button>
  <div class="mode-grid">
    <button class="mode" data-mode="world">🌏 世界地理だけ<small>第1〜8章から30問</small></button>
    <button class="mode" data-mode="japan">🗾 日本地理だけ<small>第9〜16章から30問</small></button>
    <button class="mode" data-mode="weak">💀 苦手だけ<small>過去の誤答・時間切れを優先</small></button>
  </div>

  <div class="chapterbox">
    <b>📚 章を指定して練習</b>
    <select id="chapterSelect"></select>
    <button id="chapterBtn" class="chapterbtn">この章から30問</button>
  </div>

  <div class="note">
    元ドリルの短答問題を4択化した問題バンクを使用しています。
    正解時は1秒後に自動で次へ進みます。誤答・時間切れの場合は正解を確認して「次の問題へ」を押してください。
    制限時間は数字では表示せず、上部のバーだけで示します。
  </div>
</section>

<section id="quiz" class="card hidden">
  <div class="meta">
    <span id="modePill" class="pill"></span>
    <span id="counter" class="pill"></span>
    <span id="attempts" class="pill"></span>
  </div>
  <div class="progress"><div id="progressBar"></div></div>

  <div class="timerLabel">制限時間</div>
  <div class="timer"><div id="timerBar"></div></div>

  <div id="section" class="section"></div>
  <div id="question" class="question"></div>
  <div id="choices" class="choices"></div>
  <div id="feedback" class="feedback"></div>
  <button id="nextBtn" class="next">次の問題へ</button>
  <div id="mastery" class="mastery"></div>
</section>

<section id="result" class="card hidden">
  <div style="font-size:42px">🏁</div>
  <h1>1ターン完全クリア！</h1>
  <div id="score" class="bigscore"></div>
  <div id="scoreText" class="lead"></div>

  <div class="stats">
    <div class="stat"><b id="firstCorrect">0</b>初回正解</div>
    <div class="stat"><b id="wrongCount">0</b>誤答回数</div>
    <div class="stat"><b id="timeoutCount">0</b>時間切れ</div>
  </div>

  <div id="encourage" class="lead"></div>

  <div class="actions">
    <button id="sameAgain" class="action primary">もう1ターン</button>
    <button id="homeBtn" class="action secondary">メニューへ戻る</button>
  </div>
</section>

</div>

<script>
const ALL=[{"chapter":1,"title":"世界と日本の地域構成","num":1,"q":"地球上の大きな陸地のまとまりを何というか。","a":"大陸","id":1,"scope":"世界","cat":"general","d":["海洋","半島","島"]},{"chapter":1,"title":"世界と日本の地域構成","num":2,"q":"世界最大の大陸は何か。","a":"ユーラシア大陸","id":2,"scope":"世界","cat":"general","d":["アフリカ大陸","北アメリカ大陸","南アメリカ大陸"]},{"chapter":1,"title":"世界と日本の地域構成","num":3,"q":"世界最大の海洋は何か。","a":"太平洋","id":3,"scope":"世界","cat":"physical","d":["大西洋","インド洋","北極海"]},{"chapter":1,"title":"世界と日本の地域構成","num":4,"q":"世界をアジア州など六つに分けた地域区分を何というか。","a":"州","id":4,"scope":"世界","cat":"general","d":["大陸","地方","地域"]},{"chapter":1,"title":"世界と日本の地域構成","num":5,"q":"日本が属する州は何か。","a":"アジア州","id":5,"scope":"世界","cat":"region","d":["ヨーロッパ州","北アメリカ州","オセアニア州"]},{"chapter":1,"title":"世界と日本の地域構成","num":6,"q":"国と国との境界を何というか。","a":"国境","id":6,"scope":"世界","cat":"general","d":["県境","海岸線","領海線"]},{"chapter":1,"title":"世界と日本の地域構成","num":7,"q":"国の政治の中心となる都市を何というか。","a":"首都","id":7,"scope":"世界","cat":"general","d":["最大都市","港湾都市","衛星都市"]},{"chapter":1,"title":"世界と日本の地域構成","num":8,"q":"赤道から南北の位置を表すものを何というか。","a":"緯度","id":8,"scope":"世界","cat":"map_term","d":["経度","標高","時差"]},{"chapter":1,"title":"世界と日本の地域構成","num":9,"q":"本初子午線から東西の位置を表すものを何というか。","a":"経度","id":9,"scope":"世界","cat":"map_term","d":["緯度","標高","時差"]},{"chapter":1,"title":"世界と日本の地域構成","num":11,"q":"緯度0度の緯線を何というか。","a":"赤道","id":10,"scope":"世界","cat":"map_term","d":["本初子午線","北回帰線","南回帰線"]},{"chapter":1,"title":"世界と日本の地域構成","num":12,"q":"経度0度の経線を何というか。","a":"本初子午線","id":11,"scope":"世界","cat":"map_term","d":["赤道","日付変更線","標準時子午線"]},{"chapter":1,"title":"世界と日本の地域構成","num":13,"q":"各国・地域が共通の時刻として定める時刻を何というか。","a":"標準時","id":12,"scope":"世界","cat":"general","d":["地方時","世界時","夏時間"]},{"chapter":1,"title":"世界と日本の地域構成","num":14,"q":"日本の標準時子午線は東経何度か。","a":"東経135度","id":13,"scope":"世界","cat":"degree","d":["東経120度","東経150度","東経165度"]},{"chapter":1,"title":"世界と日本の地域構成","num":15,"q":"日付を調整するため、おおむね180度付近に設けられた線を何というか。","a":"日付変更線","id":14,"scope":"世界","cat":"general","d":["本初子午線","標準時子午線","赤道"]} 16,"title":"北海道地方","num":3,"q":"北海道東部に広がる台地を何というか。","a":"根釧台地","id":273,"scope":"日本","cat":"landform_name","d":["十勝台地","武蔵野台地","シラス台地"]},{"chapter":16,"title":"北海道地方","num":4,"q":"北海道の冷涼な気候を生かした大規模農業を何というか。","a":"畑作","id":274,"scope":"日本","cat":"climate","d":["酪農","稲作","果樹栽培"]},{"chapter":16,"title":"北海道地方","num":5,"q":"根釧台地などで盛んな農業を何というか。","a":"酪農","id":275,"scope":"日本","cat":"physical","d":["畑作","稲作","果樹栽培"]},{"chapter":16,"title":"北海道地方","num":6,"q":"十勝平野で栽培が盛んな作物を一つ答えよ。","a":"小麦","id":276,"scope":"日本","cat":"physical","d":["じゃがいも","てんさい","大豆"]},{"chapter":16,"title":"北海道地方","num":7,"q":"北海道で大規模な土地を使い機械化して行う農業を何というか。","a":"大規模農業","id":277,"scope":"日本","cat":"physical","d":["混合農業","近郊農業","園芸農業"]},{"chapter":16,"title":"北海道地方","num":8,"q":"北海道周辺で盛んな水産業を何というか。","a":"漁業","id":278,"scope":"日本","cat":"physical","d":["養殖漁業","栽培漁業","沿岸漁業"]},{"chapter":16,"title":"北海道地方","num":9,"q":"世界自然遺産に登録された北海道東部の地域はどこか。","a":"知床","id":279,"scope":"日本","cat":"physical","d":["釧路湿原","阿寒湖","大雪山"]},{"chapter":16,"title":"北海道地方","num":11,"q":"北海道の先住民族を何というか。","a":"アイヌ民族","id":280,"scope":"日本","cat":"physical","d":["マオリ","アボリジナルピープル","琉球民族"]},{"chapter":16,"title":"北海道地方","num":12,"q":"北海道の開拓を進めるため明治政府が置いた役所を何というか。","a":"開拓使","id":281,"scope":"日本","cat":"physical","d":["北海道庁","屯田兵","樺太庁"]},{"chapter":16,"title":"北海道地方","num":13,"q":"札幌市に人口が集中する現象を何というか。","a":"一極集中","id":282,"scope":"日本","cat":"concept","d":["郊外化","過疎化","ドーナツ化現象"]},{"chapter":16,"title":"北海道地方","num":14,"q":"北海道の代表的な観光資源を一つ答えよ。","a":"雪","id":283,"scope":"日本","cat":"physical","d":["流氷","温泉","ラベンダー"]},{"chapter":16,"title":"北海道地方","num":15,"q":"流氷が見られる海は何か。","a":"オホーツク海","id":284,"scope":"日本","cat":"waterbody","d":["日本海","太平洋","東シナ海"]},{"chapter":16,"title":"北海道地方","num":16,"q":"北海道で森林を生かした産業を何というか。","a":"林業","id":285,"scope":"日本","cat":"physical","d":["農業","漁業","畜産業"]},{"chapter":16,"title":"北海道地方","num":17,"q":"北海道で再生可能エネルギーとして利用が進むものを一つ答えよ。","a":"風力発電","id":286,"scope":"日本","cat":"physical","d":["太陽光発電","地熱発電","水力発電"]},{"chapter":16,"title":"北海道地方","num":18,"q":"知床で重視される考え方は何か。","a":"自然環境の保全","id":287,"scope":"日本","cat":"concept","d":["観光開発","都市開発","産業振興"]},{"chapter":16,"title":"北海道地方","num":19,"q":"観光客の増加で自然への負荷が高まる問題を何というか。","a":"オーバーツーリズム","id":288,"scope":"日本","cat":"concept","d":["マスツーリズム","エコツーリズム","観光公害"]}];
const STORE="geoWeak20Mastery_v1";
const LIMIT_MS=20000;
const TURN_SIZE=30;

const $=s=>document.querySelector(s);

const WEAK_LOG_V2="socialWeakLogV2";
const SLOW_MS=12000;
let questionStartedAt=0;
function weakLogLoad(){try{return JSON.parse(localStorage.getItem(WEAK_LOG_V2)||"{}")||{}}catch(e){return {}}}
function recordWeak(q,outcome,elapsedMs){
  const all=weakLogLoad(), key=String(q.id), now=Date.now();
  const r=all[key]||{id:q.id,scope:q.scope,chapter:q.chapter,title:q.title,category:q.cat,question:q.q,answer:q.a,wrong:0,timeout:0,slow:0,attempts:0,correct:0,totalMs:0,maxMs:0,streak:0,lastSeenAt:0};
  r.scope=q.scope;r.chapter=q.chapter;r.title=q.title;r.category=q.cat;r.question=q.q;r.answer=q.a;
  r.attempts=(r.attempts||0)+1;r.totalMs=(r.totalMs||0)+Math.round(elapsedMs||0);r.maxMs=Math.max(r.maxMs||0,Math.round(elapsedMs||0));r.lastSeenAt=now;
  if(outcome==="wrong"){r.wrong=(r.wrong||0)+1;r.streak=0}
  else if(outcome==="timeout"){r.timeout=(r.timeout||0)+1;r.streak=0}
  else {r.correct=(r.correct||0)+1;r.streak=(r.streak||0)+1;if((elapsedMs||0)>=SLOW_MS)r.slow=(r.slow||0)+1}
  all[key]=r;localStorage.setItem(WEAK_LOG_V2,JSON.stringify(all));
}

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pick(a,n){return shuffle(a).slice(0,Math.min(n,a.length))}
function stats(){
  try{return JSON.parse(localStorage.getItem(STORE)||"{}")}catch{return {}}
}
function miss(id,k){
  const s=stats(),x=String(id);
  s[x]=s[x]||{wrong:0,timeout:0};
  s[x][k]=(s[x][k]||0)+1;
  localStorage.setItem(STORE,JSON.stringify(s));
}
function reward(id){
  const s=stats(),x=String(id);
  if(!s[x])return;
  s[x].wrong=Math.max(0,(s[x].wrong||0)-1);
  s[x].timeout=Math.max(0,(s[x].timeout||0)-1);
  localStorage.setItem(STORE,JSON.stringify(s));
}
function distractors(q){return shuffle([...q.d]).slice(0,3)}

function build(mode,chapter=null){
  if(mode==="chapter"){
    const a=ALL.filter(q=>q.chapter===chapter);
    let out=[];
    while(out.length<TURN_SIZE) out.push(...shuffle(a));
    return out.slice(0,TURN_SIZE);
  }
  if(mode==="world") return pick(ALL.filter(q=>q.scope==="世界"),TURN_SIZE);
  if(mode==="japan") return pick(ALL.filter(q=>q.scope==="日本"),TURN_SIZE);
  if(mode==="mix"){
    return shuffle([
      ...pick(ALL.filter(q=>q.scope==="世界"),15),
      ...pick(ALL.filter(q=>q.scope==="日本"),15)
    ]);
  }
  const st=stats();
  const weak=ALL.map(q=>({
    q,
    score:(st[q.id]?.wrong||0)*2+(st[q.id]?.timeout||0)
  }))
  .filter(x=>x.score>0)
  .sort((a,b)=>b.score-a.score)
  .map(x=>x.q);

  if(weak.length>=TURN_SIZE) return shuffle(weak.slice(0,50)).slice(0,TURN_SIZE);

  const rest=ALL.filter(q=>!weak.some(w=>w.id===q.id));
  return shuffle([...weak,...pick(rest,TURN_SIZE-weak.length)]);
}

let currentMode="mix";
let currentChapter=null;
let baseSession=[];
let queue=[];
let currentItem=null;
let cleared=new Set();
let firstAttemptDone=new Set();
let firstCorrectCount=0;
let wrongCount=0;
let timeoutCount=0;
let totalAttempts=0;
let locked=false;
let timerId=null;
let timeLeftMs=LIMIT_MS;

function label(){
  if(currentMode==="world")return"🌏 世界地理";
  if(currentMode==="japan")return"🗾 日本地理";
  if(currentMode==="mix")return"🔀 世界＋日本 総合";
  if(currentMode==="weak")return"💀 苦手";
  return"📚 章別";
}

function start(mode,custom=null,chapter=null){
  currentMode=mode;
  currentChapter=chapter;
  baseSession=custom||build(mode,chapter);

  // 30枠をそれぞれ独立して完全クリアする。
  queue=baseSession.map((q,i)=>({q,slot:i,attempt:1}));
  currentItem=null;
  cleared=new Set();
  firstAttemptDone=new Set();
  firstCorrectCount=0;
  wrongCount=0;
  timeoutCount=0;
  totalAttempts=0;

  $("#start").classList.add("hidden");
  $("#result").classList.add("hidden");
  $("#quiz").classList.remove("hidden");
  showQuestion();
}

function showQuestion(){
  clearInterval(timerId);
  locked=false;

  if(queue.length===0){
    finishTurn();
    return;
  }

  currentItem=queue.shift();
  const q=currentItem.q;
  totalAttempts++;

  $("#modePill").textContent=label();
  $("#counter").textContent=`クリア ${cleared.size}/${TURN_SIZE}`;
  $("#attempts").textContent=`挑戦 ${totalAttempts}回`;
  $("#progressBar").style.width=`${(cleared.size/TURN_SIZE)*100}%`;
  $("#section").textContent=`第${q.chapter}章　${q.title}`;
  $("#question").textContent=q.q;
  $("#feedback").className="feedback";
  $("#feedback").textContent="";
  $("#nextBtn").className="next";
  $("#mastery").textContent=`残り ${TURN_SIZE-cleared.size}問。間違えた問題は正解するまで後ろに戻ります。`;

  const opts=shuffle([q.a,...distractors(q)]);
  $("#choices").innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("button");
    b.className="choice";
    b.textContent=o;
    b.onclick=()=>answer(o,b);
    $("#choices").appendChild(b);
  });

  timeLeftMs=LIMIT_MS;
  updateTimer();
  questionStartedAt=performance.now();
  const started=questionStartedAt;
  timerId=setInterval(()=>{
    timeLeftMs=Math.max(0,LIMIT_MS-(performance.now()-started));
    updateTimer();
    if(timeLeftMs<=0) timeout();
  },100);
}

function updateTimer(){
  const ratio=timeLeftMs/LIMIT_MS;
  $("#timerBar").style.width=`${ratio*100}%`;
  $("#timerBar").style.background=
    ratio<0.25?"var(--bad)":
    ratio<0.5?"var(--warn)":
    "var(--accent)";
}

function lock(correct,clicked=null){
  document.querySelectorAll(".choice").forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct)b.classList.add("correct");
  });
  if(clicked&&clicked.textContent!==correct)clicked.classList.add("wrong");
}

function answer(o,b){
  if(locked)return;
  locked=true;
  clearInterval(timerId);

  const item=currentItem;
  const q=item.q;
  const ok=o===q.a;
  const elapsedMs=Math.min(LIMIT_MS,Math.max(0,performance.now()-questionStartedAt));
  recordWeak(q,ok?"correct":"wrong",elapsedMs);

  lock(q.a,b);
  const f=$("#feedback");

  if(ok){
    if(item.attempt===1 && !firstAttemptDone.has(item.slot)){
      firstAttemptDone.add(item.slot);
      firstCorrectCount++;
    }
    cleared.add(item.slot);
    reward(q.id);

    f.className="feedback show good";
    f.innerHTML=`✅ 正解！<br><b>${q.a}</b>`;

    $("#counter").textContent=`クリア ${cleared.size}/${TURN_SIZE}`;
    $("#progressBar").style.width=`${(cleared.size/TURN_SIZE)*100}%`;
    $("#mastery").textContent=
      cleared.size===TURN_SIZE
      ?"30問すべて正解しました！"
      :`残り ${TURN_SIZE-cleared.size}問。`;

    setTimeout(showQuestion,1000);
  }else{
    if(item.attempt===1) firstAttemptDone.add(item.slot);
    wrongCount++;
    miss(q.id,"wrong");

    // 同じ「枠」を、正解するまでターンの末尾へ戻す。
    queue.push({q,slot:item.slot,attempt:item.attempt+1});

    f.className="feedback show bad";
    f.innerHTML=`❌ 正解は「<b>${q.a}</b>」<br>この問題は、もう一度出題されます。`;
    $("#nextBtn").className="next show";
  }
}

function timeout(){
  if(locked)return;
  locked=true;
  clearInterval(timerId);

  const item=currentItem;
  const q=item.q;
  if(item.attempt===1) firstAttemptDone.add(item.slot);
  timeoutCount++;
  miss(q.id,"timeout");
  recordWeak(q,"timeout",LIMIT_MS);

  queue.push({q,slot:item.slot,attempt:item.attempt+1});

  lock(q.a);
  const f=$("#feedback");
  f.className="feedback show bad";
  f.innerHTML=`⏰ 時間切れ！<br>正解は「<b>${q.a}</b>」<br>この問題は、もう一度出題されます。`;
  $("#nextBtn").className="next show";
}

$("#nextBtn").onclick=showQuestion;

function finishTurn(){
  clearInterval(timerId);
  $("#quiz").classList.add("hidden");
  $("#result").classList.remove("hidden");

  const firstScore=Math.round(firstCorrectCount/TURN_SIZE*100);
  $("#score").textContent="30 / 30 クリア";
  $("#scoreText").textContent=`最終的に全問正解。初回正答率は ${firstScore}点（${firstCorrectCount}/${TURN_SIZE}問）でした。`;
  $("#firstCorrect").textContent=firstCorrectCount;
  $("#wrongCount").textContent=wrongCount;
  $("#timeoutCount").textContent=timeoutCount;

  if(wrongCount===0 && timeoutCount===0){
    $("#encourage").textContent="🎉 初回から完全正解！";
  }else{
    $("#encourage").textContent=`全問正解までの総挑戦回数は ${totalAttempts}回。間違えた問題も最後まで正解して終了しました。`;
  }
}

$("#sameAgain").onclick=()=>start(currentMode,null,currentChapter);
$("#homeBtn").onclick=()=>{ window.location.href="social.html"; };

document.querySelectorAll(".mode, .mix-hero").forEach(b=>{
  b.onclick=()=>start(b.dataset.mode);
});

const chapters=[...new Map(ALL.map(q=>[q.chapter,q.title])).entries()];
chapters.forEach(([n,title])=>{
  const o=document.createElement("option");
  o.value=n;
  o.textContent=`第${n}章 ${title}`;
  $("#chapterSelect").appendChild(o);
});
$("#chapterBtn").onclick=()=>{
  const chapter=Number($("#chapterSelect").value);
  start("chapter",null,chapter);
};
</script>

<script>
window.addEventListener("load", function(){
  setTimeout(function(){
    if (typeof start === "function") start("world");
  }, 0);
});
</script>
