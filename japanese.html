<script>
/* ===== 共通学習ログ v2 ===== */
(function(){
  if(window.StudyLog) return;
  const KEY="studyLogV1";
  let running=false, activeSec=0, last=0, turnStartedAt=null, meta={};

  function now(){ return Date.now(); }
  function localDate(ts){
    const d=new Date(ts), z=n=>String(n).padStart(2,"0");
    return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
  }
  function addActive(){
    if(running && !document.hidden && last){
      activeSec += Math.max(0,(now()-last)/1000);
    }
    last=now();
  }
  function load(){
    try{
      const x=JSON.parse(localStorage.getItem(KEY)||"[]");
      return Array.isArray(x)?x:[];
    }catch(e){ return []; }
  }
  function save(rows){
    if(rows.length>1000) rows=rows.slice(-1000);
    localStorage.setItem(KEY,JSON.stringify(rows));
  }

  window.StudyLog={
    startTurn(m={}){
      if(running) return;
      meta=m||{};
      running=true;
      activeSec=0;
      last=now();
      turnStartedAt=last;
    },
    finishTurn(m={}){
      if(!running) return;
      addActive();
      running=false;
      const ended=now();
      const x=Object.assign({},meta,m||{});
      const rows=load();
      rows.push({
        id: ended+"-"+Math.random().toString(36).slice(2,8),
        date: localDate(ended),
        subject: x.subject||"未分類",
        app: x.app||document.title||location.pathname.split("/").pop(),
        turnLabel: x.turnLabel||"1ターン",
        durationSec: Math.max(1,Math.round(activeSec)),
        startedAt: turnStartedAt||ended,
        endedAt: ended
      });
      save(rows);
      activeSec=0; last=0; turnStartedAt=null; meta={};
      window.dispatchEvent(new Event("studylogchange"));
    },
    cancelTurn(){
      running=false; activeSec=0; last=0; turnStartedAt=null; meta={};
    }
  };

  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){
      if(running) addActive();
    }else if(running){
      last=now();
    }
  });
})();
</script>


<script>
/* ===== 共通苦手ログ v1 ===== */
(function(){
  if(window.WeakLog) return;
  const KEY="weakLogV1";
  let active=null;
  const now=()=>Date.now();
  function load(){
    try{const x=JSON.parse(localStorage.getItem(KEY)||"{}");return x&&typeof x==="object"?x:{}}
    catch(e){return {}}
  }
  function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
  function cleanKey(s){return String(s??"").trim().slice(0,240)}
  window.WeakLog={
    start(meta={}){
      active={...meta,startedAt:now()};
    },
    result(kind,meta={},elapsedSec=null){
      const m={...(active||{}),...(meta||{})};
      const q=cleanKey(m.question||m.q||m.jp||m.prompt||"");
      const a=cleanKey(m.answer||m.a||m.en||"");
      if(!q && !m.key) return;
      const subject=cleanKey(m.subject||"未分類");
      const app=cleanKey(m.app||document.title||location.pathname.split("/").pop());
      const key=cleanKey(m.key||`${subject}|${app}|${q}|${a}`);
      const db=load();
      const r=db[key]||{
        subject,app,
        category:cleanKey(m.category||m.cat||m.tag||""),
        question:q,answer:a,
        correct:0,wrong:0,timeout:0,
        attempts:0,totalResponseSec:0,
        firstSeenAt:now(),lastSeenAt:now()
      };
      if(kind==="correct") r.correct++;
      else if(kind==="timeout") r.timeout++;
      else r.wrong++;
      r.attempts++;
      let sec=elapsedSec;
      if(sec==null && active?.startedAt) sec=(now()-active.startedAt)/1000;
      if(Number.isFinite(sec) && sec>=0) r.totalResponseSec += Math.min(sec,600);
      r.lastSeenAt=now();
      if(m.category||m.cat||m.tag) r.category=cleanKey(m.category||m.cat||m.tag);
      db[key]=r; save(db); active=null;
    },
    importWeak(meta,list){
      const db=load();
      for(const x of (list||[])){
        if(!x||!(x.wrong>0||x.timeout>0)) continue;
        const subject=cleanKey(meta.subject||x.subject||"未分類");
        const app=cleanKey(meta.app||x.app||"");
        const q=cleanKey(x.question||x.q||"");
        const a=cleanKey(x.answer||x.a||"");
        const key=cleanKey(x.key||`${subject}|${app}|${q}|${a}`);
        const cur=db[key]||{
          subject,app,category:cleanKey(x.category||x.cat||""),
          question:q,answer:a,correct:0,wrong:0,timeout:0,
          attempts:0,totalResponseSec:0,firstSeenAt:now(),lastSeenAt:now()
        };
        cur.wrong=Math.max(cur.wrong||0,Number(x.wrong)||0);
        cur.timeout=Math.max(cur.timeout||0,Number(x.timeout)||0);
        cur.correct=Math.max(cur.correct||0,Number(x.correct)||0);
        cur.attempts=Math.max(cur.attempts||0,cur.wrong+cur.timeout+cur.correct);
        cur.lastSeenAt=now(); db[key]=cur;
      }
      save(db);
    }
  };
})();
</script>

意味を表す。","page":"p328"},{"kanji":"猫","reading":"ねこ","hint":"ネコ科の動物。","page":"p328"},{"kanji":"井","reading":"い","hint":"井戸。","page":"p328"},{"kanji":"捉","reading":"とらえる","hint":"つかまえる。意味をしっかりつかむ。","page":"p329"},{"kanji":"焦","reading":"あせる","hint":"気持ちが急ぐ。こげる。","page":"p329"},{"kanji":"斎","reading":"さい","hint":"身を清めることなどを表す。","page":"p329"},{"kanji":"爪","reading":"つめ","hint":"指の先にあるかたい部分。","page":"p329"},{"kanji":"霊","reading":"れい","hint":"たましい。目に見えない存在。","page":"p329"},{"kanji":"姓","reading":"せい","hint":"名字。家の名。","page":"p329"},{"kanji":"据","reading":"すえる","hint":"動かないように置く。","page":"p329"},{"kanji":"稲","reading":"いね","hint":"米が実る植物。","page":"p329"},{"kanji":"泡","reading":"あわ","hint":"液体の中や表面にできる気体の粒。","page":"p329"},{"kanji":"唄","reading":"うた","hint":"うた。歌うもの。","page":"p329"},{"kanji":"沸","reading":"わく","hint":"液体が熱せられて激しく泡立つ。","page":"p329"},{"kanji":"沼","reading":"ぬま","hint":"浅く水がたまった場所。","page":"p329"},{"kanji":"巾","reading":"はば","hint":"布や、幅を表すのに使う字。","page":"p329"},{"kanji":"丈","reading":"たけ","hint":"長さ・高さ。丈夫の『丈』。","page":"p329"},{"kanji":"吹","reading":"ふく","hint":"風が動く。息を出す。","page":"p329"},{"kanji":"薄","reading":"うすい","hint":"厚みや濃さが少ない。","page":"p329"},{"kanji":"煙","reading":"けむり","hint":"物が燃えたときに出るもの。","page":"p329"},{"kanji":"漠","reading":"ばく","hint":"広々としてはっきりしない様子。","page":"p329"},{"kanji":"斜","reading":"ななめ","hint":"まっすぐでなく傾いている。","page":"p329"},{"kanji":"威","reading":"い","hint":"人をおそれさせる力・勢い。","page":"p329"}];const STORE='japaneseKanjiExamWeak_v1';const $=s=>document.querySelector(s);
let turns=2,currentTurn=1,queue=[],cleared=0,current=null,miss=0,totalMiss=0,mode='canvas';let weak=JSON.parse(localStorage.getItem(STORE)||'{}');const used=new Set();
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('#turnBtns').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#turnBtns button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');turns=+b.dataset.turns};
$('#modeTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#modeTabs button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');mode=b.dataset.mode;$('#canvasArea').classList.toggle('hidden',mode!=='canvas');$('#textArea').classList.toggle('hidden',mode!=='text')};
function makeTurn(){let fresh=BANK.filter(x=>!used.has(x.kanji));if(fresh.length<20){used.clear();fresh=[...BANK]}const pool=[...fresh].sort((a,b)=>(weak[b.kanji]||0)-(weak[a.kanji]||0)).slice(0,Math.min(50,fresh.length));const picked=shuffle(pool).slice(0,20);picked.forEach(x=>used.add(x.kanji));return picked.map(x=>({item:x}))}
$('#startBtn').onclick=()=>{$('#setup').classList.add('hidden');startTurn()};
function startTurn(){
StudyLog.startTurn({subject:'国語',app:'国語・漢字の書き',turnLabel:`第${currentTurn}ターン`});queue=makeTurn();cleared=0;miss=0;$('#quiz').classList.remove('hidden');$('#turnEnd').classList.add('hidden');renderNext()}
function renderNext(){if(!queue.length)return endTurn();current=queue.shift();const x=current.item;try{WeakLog.start({subject:'国語',app:'国語・漢字の書き',category:x.page||'',question:'読み：'+x.reading,answer:x.kanji})}catch(e){}$('#turnPill').textContent=`${currentTurn} / ${turns}ターン`;$('#progressPill').textContent=`クリア ${cleared} / 20`;$('#pagePill').textContent=x.page;$('#bar').style.width=(cleared/20*100)+'%';$('#reading').textContent=x.reading;$('#hintBox').textContent=x.hint;$('#hintBox').classList.add('hidden');$('#answerBox').classList.add('hidden');$('#answerKanji').textContent=x.kanji;$('#answerMeta').textContent=`読み：${x.reading}`;$('#feedback').textContent='';$('#answerInput').value='';clearCanvas()}
$('#hintBtn').onclick=()=>$('#hintBox').classList.toggle('hidden');
$('#audioBtn').onclick=()=>{const u=new SpeechSynthesisUtterance(current.item.reading);u.lang='ja-JP';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)};
function showAnswer(){$('#answerInput').blur();$('#answerBox').classList.remove('hidden')}$('#showAnswer1').onclick=showAnswer;$('#showAnswer2').onclick=showAnswer;
$('#goodBtn').onclick=()=>{try{WeakLog.result('correct')}catch(e){}weak[current.item.kanji]=Math.max(0,(weak[current.item.kanji]||0)-1);localStorage.setItem(STORE,JSON.stringify(weak));cleared++;$('#feedback').textContent='✅ クリア';setTimeout(renderNext,500)};
$('#badBtn').onclick=()=>{try{WeakLog.result('wrong')}catch(e){}weak[current.item.kanji]=(weak[current.item.kanji]||0)+2;localStorage.setItem(STORE,JSON.stringify(weak));miss++;totalMiss++;queue.push(current);$('#feedback').textContent='↩ この漢字をターンの最後へ回します';setTimeout(renderNext,650)};
$('#deleteBtn').onclick=()=>{const a=Array.from($('#answerInput').value);a.pop();$('#answerInput').value=a.join('');$('#answerInput').focus()};$('#clearTextBtn').onclick=()=>{$('#answerInput').value='';$('#answerInput').focus()};
function endTurn(){
StudyLog.finishTurn({subject:'国語',app:'国語・漢字の書き',turnLabel:`第${currentTurn}ターン`});$('#quiz').classList.add('hidden');$('#turnEnd').classList.remove('hidden');$('#turnSummary').textContent=`20問すべてクリア。書けなかった延べ回数：${miss}回`;$('#nextTurnBtn').textContent=currentTurn>=turns?'結果を見る':'次のターンへ'}
$('#nextTurnBtn').onclick=()=>{if(currentTurn>=turns){$('#turnEnd').classList.add('hidden');$('#final').classList.remove('hidden');$('#finalSummary').textContent=`${turns}ターン終了。書けなかった延べ回数：${totalMiss}回。次回は苦手漢字が少し出やすくなります。`}else{currentTurn++;startTurn()}};
const canvas=$('#pad'),ctx=canvas.getContext('2d');let drawing=false,strokes=[],stroke=[];
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);redraw()}
function pos(e){const r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;stroke=[pos(e)];canvas.setPointerCapture(e.pointerId);$('#canvasHelp').classList.add('hidden')});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=pos(e),l=stroke[stroke.length-1];ctx.strokeStyle='#111';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(l[0],l[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();stroke.push(p)});
canvas.addEventListener('pointerup',()=>{if(drawing){drawing=false;strokes.push(stroke);stroke=[]}});canvas.addEventListener('pointercancel',()=>drawing=false);
function redraw(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);ctx.strokeStyle='#111';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';for(const s of strokes){if(s.length<2)continue;ctx.beginPath();ctx.moveTo(s[0][0],s[0][1]);for(let i=1;i<s.length;i++)ctx.lineTo(s[i][0],s[i][1]);ctx.stroke()}$('#canvasHelp').classList.toggle('hidden',strokes.length>0)}
function clearCanvas(){strokes=[];stroke=[];ctx.clearRect(0,0,canvas.width,canvas.height);$('#canvasHelp').classList.remove('hidden')}$('#undoBtn').onclick=()=>{strokes.pop();redraw()};$('#clearCanvasBtn').onclick=clearCanvas;window.addEventListener('resize',()=>setTimeout(resize,100));setTimeout(resize,150);
</script></body></html>
