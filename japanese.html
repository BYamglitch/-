<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>国語｜漢字学習メニュー</title>
<style>
:root{--bg:#f6f2fb;--ink:#24212b;--sub:#6b6475;--line:#ded6e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink)}
.wrap{max-width:820px;margin:auto;padding:24px 16px 48px}
.back{display:inline-block;text-decoration:none;color:#5b426f;font-weight:800;margin-bottom:14px}
.hero{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 8px 28px rgba(58,34,71,.08)}
h1{margin:0 0 6px;font-size:30px}
.lead{margin:0 0 20px;color:var(--sub);line-height:1.65}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:20px;padding:22px;background:#fff;min-height:210px}
.card:active{transform:scale(.99)}
.icon{font-size:42px}
.card h2{font-size:23px;margin:10px 0 8px}
.card p{margin:0;color:var(--sub);line-height:1.7}
.badge{display:inline-block;margin-top:14px;padding:6px 10px;border-radius:999px;background:#f1eaf7;color:#624676;font-weight:800;font-size:13px}
.order{margin-top:16px;padding:14px 16px;border-radius:14px;background:#f8f5fb;color:#54485f;line-height:1.7}
@media(max-width:620px){.grid{grid-template-columns:1fr}.card{min-height:auto}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 科目一覧へ</a>
  <section class="hero">
    <h1>国語｜漢字学習</h1>
    <p class="lead">学習するモードを選んでください。</p>
    <div class="grid">
      <a class="card" href="japanese-reading.html">
        <div class="icon">👀</div>
        <h2>読み・漢字4択</h2>
        <p>読みと文脈を見て、正しい漢字の熟語を4択から選びます。紙の書き取り前の準備用です。</p>
        <span class="badge">先におすすめ</span>
      </a>
      <a class="card" href="japanese-write.html">
        <div class="icon">✍️</div>
        <h2>漢字を書く</h2>
        <p>これまで使っていた国語の漢字書き取りアプリです。読み4択のあとに仕上げとして使います。</p>
        <span class="badge">仕上げ</span>
      </a>
    </div>
    <div class="order"><b>おすすめ順：</b> ① 読み・漢字4択 → ② 漢字を書く</div>
  </section>
</div>
</body>
</html>
