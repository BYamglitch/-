const KEY="socialCapitalAbbrevWeakV1";
let queue=[],base=[],cur=null,first=0,wrong=0,attempts=0,currentRegion="all",answered=false;

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function weak(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function saveWrong(x){const w=weak();w[x.id]=(w[x.id]||0)+1;localStorage.setItem(KEY,JSON.stringify(w))}
function show(id){["home","quiz","result"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id))}
function start(region,onlyWeak=false){
 currentRegion=region;
 let arr=region==="all"?BANK:BANK.filter(x=>x.region===region);
 if(onlyWeak){const w=weak();arr=arr.filter(x=>w[x.id]);if(!arr.length){alert("まだ苦手ログがありません。まず通常問題を解いてください。");return}}
 base=shuffle(arr);queue=[...base];first=wrong=attempts=0;show("quiz");render();
}
function render(){
 cur=queue.shift();answered=false;
 const done=base.length-queue.filter(x=>!x._retry).length;
 document.getElementById("count").textContent=`残り ${queue.length+1}問`;
 document.getElementById("attempt").textContent=`挑戦 ${attempts}回`;
 document.getElementById("bar").style.width=`${Math.min(100,(first/(base.length||1))*100)}%`;
 document.getElementById("regionHead").textContent=`【${cur.region}】`;
 document.getElementById("kind").textContent=`出題分野：${cur.type}`;
 document.getElementById("q").textContent=cur.q;

 const c=document.getElementById("choices");c.innerHTML="";
 opts.forEach(v=>{const b=document.createElement("button");b.className="choice";b.textContent=v;b.onclick=()=>answer(b,v);c.appendChild(b)});
 document.getElementById("fb").className="feedback";document.getElementById("next").className="next";
}
function answer(btn,v){
 if(answered)return;answered=true;attempts++;
 [...document.querySelectorAll(".choice")].forEach(b=>b.disabled=true);
 const ok=v===cur.a;const fb=document.getElementById("fb");
 if(ok){btn.classList.add("ok");first++;fb.textContent="正解！";fb.className="feedback show";setTimeout(advance,900)}
 else{btn.classList.add("ng");[...document.querySelectorAll(".choice")].find(b=>b.textContent===cur.a)?.classList.add("ok");wrong++;saveWrong(cur);fb.textContent=`正解：${cur.a}　→ この問題は最後にもう一度出ます。`;fb.className="feedback show";queue.push({...cur,_retry:true});document.getElementById("next").className="next show"}
}
function advance(){if(queue.length)render();else finish()}
function finish(){show("result");document.getElementById("score").textContent=`${base.length}問クリア`;document.getElementById("resultText").textContent=`誤答 ${wrong}回／総挑戦 ${attempts}回。間違えた問題は「苦手だけ再挑戦」に残ります。`}

document.getElementById("again").onclick=()=>start(currentRegion);
