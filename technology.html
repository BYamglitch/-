<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>技術 期末試験対策 4択ドリル</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#10233f;--muted:#667085;--line:#d9e2ef;--accent:#246b5f;--good:#087a45;--bad:#c13b32}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink)}
.wrap{max-width:920px;margin:auto;padding:18px} .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 8px 24px rgba(16,35,63,.06)}
h1{font-size:clamp(28px,4vw,42px);margin:0 0 10px;line-height:1.25} .sub{color:var(--muted);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
select,.btn{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:white;color:var(--ink);font-size:16px;font-weight:800}
.btn{cursor:pointer} .primary{background:var(--ink);border-color:var(--ink);color:white} .accent{background:var(--accent);border-color:var(--accent);color:white}
.hidden{display:none!important} .top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.turn{font-size:28px;font-weight:900} .meta{font-size:14px;font-weight:800;color:var(--muted)}
.timer{font-size:22px;font-weight:900} .danger{color:var(--bad)}
.progress{height:10px;background:#e7edf5;border-radius:999px;overflow:hidden;margin:12px 0 20px} .progress>div{height:100%;background:var(--accent);width:0}
.q{font-size:clamp(24px,4vw,36px);font-weight:900;line-height:1.45;margin:10px 0 20px}
.opts{display:grid;gap:12px} .opt{text-align:left;width:100%;padding:18px;border:2px solid var(--line);border-radius:16px;background:white;font-size:clamp(18px,3vw,23px);font-weight:800;cursor:pointer}
.opt.correct{background:#e8f7ef;border-color:var(--good);color:#086b3c} .opt.wrong{background:#fff0ee;border-color:var(--bad);color:#962d27} .opt.dim{opacity:.58}
.feedback{display:none;margin-top:18px;padding:16px;border-radius:14px;font-weight:800} .feedback.show{display:block} .feedback.good{background:#e8f7ef;color:#086b3c} .feedback.bad{background:#fff0ee;color:#962d27}
.next{display:none;margin-top:16px} .next.show{display:block}
.scoregrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0} .score{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfcfe} .score b{display:block;font-size:26px;margin-top:3px}
table{width:100%;border-collapse:collapse} th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#eef3f8;font-size:13px;font-weight:800}
.review{background:#fff2cc;color:#795600}
@media(max-width:600px){.wrap{padding:10px}.card{padding:17px}.q{font-size:25px}}
</style>
</head>
<body><div class="wrap">
<section id="start" class="card">
<h1>🛠 技術 期末試験対策<br>4択ドリル</h1>
<p class="sub">教科書データをもとに、材料と加工・生物育成・エネルギー変換・情報の技術から出題します。<b>1ターン20問</b>。各ターンの20問は、<b>間違えた問題・時間切れの問題をターンの末尾へ回し、正解するまで再出題します。</b> 20問すべて正解して初めてターン終了です。復習TURNも残しています。</p>
<div class="grid">
<label><b>今回やる通常ターン数</b><br><select id="turnCount"><option value="1">1ターン（20問＋復習20問）</option><option value="2">2ターン（40問＋復習20問）</option><option value="3" selected>3ターン（60問＋復習20問）</option><option value="4">4ターン（80問＋復習20問）</option><option value="5">5ターン（100問＋復習20問）</option></select></label>
<label><b>出題範囲</b><br><select id="cat"><option value="ALL">全範囲MIX</option><option>材料と加工</option><option>生物育成</option><option>エネルギー変換</option><option>情報</option></select></label>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><span class="badge">1問10秒</span><span class="badge">正解1秒後自動遷移</span><span class="badge">ターン別得点</span><span class="badge">正解するまで反復</span><span class="badge">復習TURN</span><span class="badge">苦手履歴保存</span></div>
<button id="startBtn" class="btn primary">スタート</button>
</section>

<section id="quiz" class="card hidden">
<div class="top"><div><div id="turnTitle" class="turn"></div><div id="catLabel" class="meta"></div></div><div id="timer" class="timer">10.0</div></div>
<div class="progress"><div id="bar"></div></div><div id="qmeta" class="meta"></div><div id="question" class="q"></div><div id="options" class="opts"></div>
<div id="feedback" class="feedback"></div><button id="nextBtn" class="btn primary next">次の問題へ</button>
</section>

<section id="turnResult" class="card hidden">
<h2 id="trTitle"></h2><div class="scoregrid"><div class="score">このターン<b id="turnScore"></b></div><div class="score">累計<b id="totalScore"></b></div><div class="score">誤答・時間切れ<b id="missCount"></b></div></div>
<p id="turnMsg" class="sub"></p><button id="continueBtn" class="btn primary">次のターンへ</button>
</section>

<section id="final" class="card hidden">
<h2>🏁 今回の結果</h2><div id="summary"></div><h3>ターン別スコア</h3><div id="table"></div>
<div class="grid"><button id="weakBtn" class="btn accent">苦手問題でもう1回</button><button id="restart" class="btn primary">最初から</button></div>
</section>
</div>

]}, {"id": 116, "cat": "情報", "q": "コンピュータウイルス対策として適切なのはどれか。", "a": "OSやソフトを更新し対策ソフトも活用する", "d": ["不明な添付ファイルを必ず開く", "更新を一切しない", "出所不明のソフトを自由に入れる"]}, {"id": 117, "cat": "情報", "q": "情報モラルとして適切なのはどれか。", "a": "他人の権利やプライバシーを尊重する", "d": ["個人情報を無断公開する", "著作物を自由にコピーして配布する", "SNSで他人を傷つけてもよい"]}, {"id": 118, "cat": "情報", "q": "知的財産権に含まれるものとして適切なのはどれか。", "a": "著作権", "d": ["電気抵抗", "位置エネルギー", "肥料成分"]}, {"id": 119, "cat": "情報", "q": "著作権が守る対象として適切なのはどれか。", "a": "創作的に表現された著作物", "d": ["電池の電圧", "植物の水分量", "木材の密度"]}, {"id": 120, "cat": "情報", "q": "個人情報の扱いとして適切なのはどれか。", "a": "必要性を考え適切に管理する", "d": ["本人に無断で広く公開する", "パスワードと一緒にSNSへ載せる", "誰にでも送る"]}, {"id": 121, "cat": "情報", "q": "プログラムとは何か。", "a": "コンピュータに行わせる処理の手順を記述したもの", "d": ["コンピュータの外箱", "ネットワークケーブル", "画像の1画素"]}, {"id": 122, "cat": "情報", "q": "プログラミングで処理を順番に行う構造を何というか。", "a": "順次", "d": ["分岐", "反復", "暗号化"]}, {"id": 123, "cat": "情報", "q": "条件によって処理を変える構造を何というか。", "a": "分岐", "d": ["順次", "反復", "圧縮"]}, {"id": 124, "cat": "情報", "q": "同じ処理を繰り返す構造を何というか。", "a": "反復", "d": ["順次", "分岐", "復号"]}, {"id": 125, "cat": "情報", "q": "フローチャートを使う主な目的はどれか。", "a": "処理の流れを図で表す", "d": ["画像を圧縮する", "通信速度を測る", "材料を加工する"]}, {"id": 126, "cat": "情報", "q": "変数の役割として適切なのはどれか。", "a": "値を入れて利用するための場所", "d": ["ネットワーク上の住所", "画像の色だけ", "電流を制限する部品"]}, {"id": 127, "cat": "情報", "q": "イベントを利用するプログラムの説明として適切なのはどれか。", "a": "クリックなどの出来事をきっかけに処理する", "d": ["常に同じ処理だけを行う", "電気を発生させる", "木材を接着する"]}, {"id": 128, "cat": "情報", "q": "双方向性のあるコンテンツの特徴として適切なのはどれか。", "a": "利用者の操作に応じて情報や動作が変化する", "d": ["利用者は見るだけで操作できない", "必ず紙で提供される", "音声を使えない"]}, {"id": 129, "cat": "情報", "q": "ユーザインタフェースとは何か。", "a": "人とコンピュータが情報をやり取りする接点", "d": ["ネットワークケーブルの規格", "電池の端子", "木材の接合部"]}, {"id": 130, "cat": "情報", "q": "アクセシビリティを高める工夫として適切なのはどれか。", "a": "多様な利用者が使いやすい表示や操作にする", "d": ["文字を極端に小さくする", "色だけで情報を伝える", "操作方法を複雑にする"]}, {"id": 131, "cat": "情報", "q": "計測・制御システムでセンサの役割はどれか。", "a": "周囲の状態を計測して情報を得る", "d": ["機械を直接動かすだけ", "情報を永久保存するだけ", "電気を発電する"]}, {"id": 132, "cat": "情報", "q": "計測・制御システムでアクチュエータの役割はどれか。", "a": "指示に応じ const TURN=20,LIMIT=10,STORE="technology_exam_weak_v1";
const $=s=>document.querySelector(s); const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const getWeak=()=>JSON.parse(localStorage.getItem(STORE)||"{}"); const saveWeak=w=>localStorage.setItem(STORE,JSON.stringify(w));
function miss(id){let w=getWeak();w[id]=(w[id]||0)+1;saveWeak(w)} function reward(id){let w=getWeak();if(w[id])w[id]=Math.max(0,w[id]-1);saveWeak(w)}
let normalTurns=3,cat="ALL",plan=[],ti=0,qi=0,locked=false,timer=null,left=LIMIT,results=[],sessionMiss=[],totalCorrect=0,retryPending=false;
function pool(){return cat==="ALL"?ALL:ALL.filter(q=>q.cat===cat)}
function makeTurns(){let p=shuffle(pool()),arr=[];for(let t=0;t<normalTurns;t++){if(p.length<TURN)p=p.concat(shuffle(pool()));arr.push({type:"normal",label:`TURN ${t+1}`,qs:p.splice(0,TURN)})}return arr}
function reviewTurn(){let p=pool(),seen=new Set(),pick=[];[...sessionMiss].reverse().forEach(id=>{let q=ALL.find(x=>x.id===id);if(q&&(!cat||cat==="ALL"||q.cat===cat)&&!seen.has(id)){pick.push(q);seen.add(id)}});Object.entries(getWeak()).sort((a,b)=>b[1]-a[1]).forEach(([id])=>{id=+id;let q=p.find(x=>x.id===id);if(q&&!seen.has(id)){pick.push(q);seen.add(id)}});shuffle(p).forEach(q=>{if(pick.length<TURN&&!seen.has(q.id)){pick.push(q);seen.add(q.id)}});while(pick.length<TURN)pick.push(shuffle(p)[0]);return {type:"review",label:"復習 TURN",qs:pick.slice(0,TURN)}}
function cur(){return plan[ti]}
function start(){normalTurns=+$("#turnCount").value;cat=$("#cat").value;plan=makeTurns();ti=0;qi=0;results=[];sessionMiss=[];totalCorrect=0;$("#start").classList.add("hidden");$("#final").classList.add("hidden");$("#quiz").classList.remove("hidden");show()}
function show(){locked=false;retryPending=false;clearInterval(timer);left=LIMIT;let q=cur().qs[qi],r=results[ti]||{correct:0,wrong:0,timeout:0,type:cur().type,label:cur().label};results[ti]=r;$("#turnTitle").innerHTML=cur().type==="review"?'<span class="badge review">復習 TURN</span>':cur().label;$("#catLabel").textContent=q.cat;$("#qmeta").textContent=`クリア ${r.correct} / 20　｜　挑戦 ${qi+1}回目`;$("#question").textContent=q.q;$("#bar").style.width=`${Math.min(100,r.correct/20*100)}%`;$("#feedback").className="feedback";$("#feedback").innerHTML="";$("#nextBtn").classList.remove("show");$("#options").innerHTML="";shuffle([q.a,...q.d]).forEach(o=>{let b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>answer(o,b);$("#options").appendChild(b)});tick();timer=setInterval(()=>{left-=.1;if(left<=0){left=0;clearInterval(timer);timeout()}tick()},100)}
function tick(){$("#timer").textContent=left.toFixed(1);$("#timer").classList.toggle("danger",left<=3)}
function lockAns(a,clicked){document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.textContent===a)b.classList.add("correct");else if(b===clicked)b.classList.add("wrong");else b.classList.add("dim")})}
function answer(choice,btn){if(locked)return;locked=true;clearInterval(timer);let q=cur().qs[qi],r=results[ti],ok=choice===q.a;if(ok){r.correct++;totalCorrect++;reward(q.id)}else{r.wrong++;sessionMiss.push(q.id);miss(q.id)}lockAns(q.a,btn);let f=$("#feedback");f.className="feedback show "+(ok?"good":"bad");f.innerHTML=ok?`✅ 正解！ <b>${q.a}</b>`:`❌ 正解は <b>${q.a}</b>`;$("#qmeta").textContent=`クリア ${r.correct} / 20　｜　挑戦 ${qi+1}回目`;if(ok){$("#nextBtn").textContent="次の問題へ";setTimeout(advance,1000)}else{cur().qs.push(q);$("#nextBtn").textContent="次の問題へ";$("#nextBtn").classList.add("show")}}
function timeout(){if(locked)return;locked=true;let q=cur().qs[qi],r=results[ti];r.timeout++;sessionMiss.push(q.id);miss(q.id);cur().qs.push(q);lockAns(q.a,null);let f=$("#feedback");f.className="feedback show bad";f.innerHTML=`⏰ 時間切れ。正解は <b>${q.a}</b><br>この問題はターンの末尾でもう一度出ます。`;$("#nextBtn").textContent="次の問題へ";$("#nextBtn").classList.add("show")}
function advance(){qi++;if(qi>=cur().qs.length)finishTurn();else show()} $("#nextBtn").onclick=advance;
function finishTurn(){clearInterval(timer);$("#quiz").classList.add("hidden");$("#turnResult").classList.remove("hidden");let r=results[ti];$("#trTitle").textContent=cur().type==="review"?"復習ターン終了！":cur().label+" 終了！";$("#turnScore").textContent=`${r.correct} / 20`;$("#totalScore").textContent=`${totalCorrect} / ${results.filter(Boolean).length*20}`;$("#missCount").textContent=`${r.wrong+r.timeout} 問`;$("#turnMsg").textContent=cur().type==="review"?"今回の誤答・時間切れを中心に復習しました。":(ti===normalTurns-1?"通常ターン終了。次は復習TURNです。":"次の通常ターンへ進みます。");$("#continueBtn").textContent=cur().type==="review"?"最終結果を見る":"次のターンへ"}
$("#continueBtn").onclick=()=>{$("#turnResult").classList.add("hidden");if(cur().type==="review")return finishAll();ti++;if(ti===normalTurns)plan.push(reviewTurn());qi=0;$("#quiz").classList.remove("hidden");show()};
function finishAll(){$("#final").classList.remove("hidden");let total=results.length*20,pct=Math.round(totalCorrect/total*100);$("#summary").innerHTML=`<div class="scoregrid"><div class="score">総合得点<b>${totalCorrect} / ${total}</b></div><div class="score">正答率<b>${pct}%</b></div><div class="score">今回の要復習<b>${new Set(sessionMiss).size} 問</b></div></div>`;$("#table").innerHTML='<table><thead><tr><th>ターン</th><th>得点</th><th>誤答</th><th>時間切れ</th></tr></thead><tbody>'+results.map(r=>`<tr><td>${r.type==="review"?"復習 TURN":r.label}</td><td><b>${r.correct} / 20</b></td><td>${r.wrong}</td><td>${r.timeout}</td></tr>`).join("")+'</tbody></table>'}
$("#weakBtn").onclick=()=>{let p=pool(),w=getWeak(),pick=Object.entries(w).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).map(([id])=>p.find(q=>q.id===+id)).filter(Boolean),seen=new Set(pick.map(q=>q.id));pick=pick.concat(shuffle(p.filter(q=>!seen.has(q.id))).slice(0,Math.max(0,20-pick.length)));plan=[{type:"review",label:"苦手だけ TURN",qs:pick.slice(0,20)}];normalTurns=0;ti=0;qi=0;results=[];sessionMiss=[];totalCorrect=0;$("#final").classList.add("hidden");$("#quiz").classList.remove("hidden");show()};
$("#restart").onclick=()=>location.reload();$("#startBtn").onclick=start;
</script></body></html>
