25, "cat": "体育③ 多様な楽しみ方", "q": "豊かなスポーツライフに必要な能力として適切なのはどれか。", "a": "ルールや用具などを工夫する力", "d": ["競技を避ける力", "勝敗を隠す力", "一人だけで決める力"], "page": "p10-11", "priority": "通常"}, {"id": 26, "cat": "体育③ 多様な楽しみ方", "q": "豊かなスポーツライフに必要な能力として適切なのはどれか。", "a": "うまくコミュニケーションをとる力", "d": ["会話を避ける力", "相手の意見を無視する力", "競技時間を長くする力"], "page": "p10-11", "priority": "通常"}, {"id": 27, "cat": "体育③ 多様な楽しみ方", "q": "豊かなスポーツライフに必要な能力として適切なのはどれか。", "a": "メンバーで役割分担する力", "d": ["役割をなくす力", "一人ですべて行う力", "他人に任せきる力"], "page": "p10-11", "priority": "通常"}, {"id": 28, "cat": "体育③ 多様な楽しみ方", "q": "運動やスポーツの継続に有効な「3つの間」はどれか。", "a": "仲間・空間・時間", "d": ["場所・費用・勝敗", "記録・体力・道具", "学校・家庭・地域"], "page": "p10-11", "priority": "章まとめ"}, {"id": 29, "cat": "体育③ 多様な楽しみ方", "q": "自然と親しんだり仲間と交流したりしながら、仲間とともに課題を達成していく楽しみ方はどれか。", "a": "仲間と協力する楽しみ方", "d": ["競争だけの楽しみ方", "観戦だけの楽しみ方", "記録測定だけの楽しみ方"], "page": "p10-11", "priority": "通常"}, {"id": 30, "cat": "体育④ 章のまとめ", "q": "運動やスポーツは、運動不足を何し、健康を維持するのに役立つか。", "a": "解消する", "d": ["増加する", "無視する", "固定する"], "page": "p14-15", "priority": "章まとめ"}, {"id": 31, "cat": "体育④ 章のまとめ", "q": "運動やスポーツでは、目標となる記録や技をどうすることに楽しさがあるか。", "a": "達成する", "d": ["削除する", "隠す", "平均する"], "page": "p14-15", "priority": "章まとめ"}, {"id": 32, "cat": "体育④ 章のまとめ", "q": "運動やスポーツでは、仲間と何することも楽しさの一つか。", "a": "交流する", "d": ["距離を置く", "競技をやめる", "役割をなくす"], "page": "p14-15", "priority": "章まとめ"}, {"id": 33, "cat": "体育④ 章のまとめ", "q": "体育の授業で運動やスポーツに実際に取り組むのは、4つのかかわり方のうちどれか。", "a": "する", "d": ["みる", "支える", "知る"], "page": "p14-15", "priority": "章まとめ"}, {"id": 34, "cat": "体育④ 章のまとめ", "q": "試合の記録やデータを調べるのは、4つのかかわり方のうちどれか。", "a": "知る", "d": ["する", "みる", "支える"], "page": "p14-15", "priority": "章まとめ"}, {"id": 35, "cat": "保健① 健康の成り立ち", "q": "健康の状態は何と何がかかわり合って成り立つか。", "a": "主体と環境", "d": ["運動と競技", "食事と睡眠だけ", "家庭と学校だけ"], "page": "p18-19", "priority": "章まとめ"}, {"id": 36, "cat": "保健① 健康の成り立ち", "q": "主体の要因に含まれるものはどれか。", "a": "年齢", "d": ["気温", "医療機関", "バリアフリー"], "page": "p18-19", "priority": "通常"}, {"id": 37, "cat": "保健① 健康の成り立ち", "q": "主体の要因に含まれるものはどれか。", "a": "性", "d": ["湿度", "保健・医療機関", "健康保障制度"], "page": "p18-19", "priority": "通常"}, {"id": 38, "cat": "保健① 健康の成り立ち", "q": "主体の要因に含まれるものはどれか。", "a": "抵抗力", "d": ["日照", "騒音", "労働条件"], "page": "p18-19", "priority": "通常"}, {"id": 39, "cat": "保健① 健康の成り立ち", "q": "主体の要因に含まれるものはどれか。", "a": "遺伝", "d": ["気温", "人間関係", "経済状態"], "page": "p18-19", "priority": "通常"}, {"id": 40, "cat": "保健① 健康の成り立ち", "q": "主体の要因のうち、生活上の習慣や行動に含まれるものはどれか。", "a": "運動・食事・休養・睡眠", "d": ["気温・湿度・騒音・日照", "ウイルス・細菌・動物", "医療機関・健康保障制度"], "page": "p18-19", "priority": "通常"}, {"id": 41, "cat": "保健① 健康の成り立ち", "q": "環境の要因のうち、物理的・化学的環境の要因に含まれるものはどれか。", "a": "温度・湿度・有害化学物質", "d": ["年齢・性・抵抗力", "運動・食事・睡眠", "人間関係・経済状態"], "page": "p18-19", "priority": "通常"}, {"id": 42, "cat": "保健① 健康の成り立ち", "q": "環境の要因のうち、生物学的環境の要因に含まれるものはどれか。", "a": "ウイルスや細菌", "d": ["年齢や性", "運動や食事", "医療機関やバリアフリー"], "page": "p18-19", "priority": "通常"}, {"id": 43, "cat": "保健① 健康の成り立ち", "q": "環境の要因のうち、社会的環境の要因に含まれるものはどれか。", "a": "人間関係や保健・医療機関", "d": ["年齢や性", "気温や湿度", "ウイルスや細菌"], "page": "p18-19", "priority": "通常"}, {"id": 44, "cat": "保健① 健康の成り立ち", "q": "教科書では、健康の状態についてどのようにとらえているか。", "a": "主体と環境が互いにかかわり合う動的な状態", "d": ["病気がないかどうかだけ", "体力の数値だけで決まる状態", "本人の努力だけで決まる状態"], "page": "p18-19", "priority": "通常"}, {"id": 45, "cat": "保健② 運動と健康", "q": "適度な運動をすることで発達するとされるものはどれか。", "a": "骨や筋肉", "d": ["視力だけ", "味覚だけ", "髪の毛だけ"], "page": "p20-21", "priority": "章まとめ"}, {"id": 46, "cat": "保健② 運動と健康", "q": "持久的な運動を続けることで発達するものはどれか。", "a": "呼吸器・循環器", "d": ["消化器だけ", "感覚器だけ", "皮膚だけ"], "page": "p20-21", "priority": "通常"}, {"id": 47, "cat": "保健② 運動と健康", "q": "運動を続けることで高まるものとして教科書に示されているのはどれか。", "a": "体の抵抗力", "d": ["眠気だけ", "食欲だけ", "視力だけ"], "page": "p20-21", "priority": "章まとめ"}, {"id": 48, "cat": "保健② 運動と健康", "q": "運動は肥満や生活習慣病の予防にどのような効果があるか。", "a": "予防に効果がある", "d": ["必ず発症させる", "関係がない", "睡眠だけに影響する"], "page": "p20-21", "priority": "通常"}, {"id": 49, "cat": "保健② 運動と健康", "q": "運動による心の健康への効果として適切なのはどれか。", "a": "気分転換になる", "d": ["必ず緊張が高まる", "交流が減る", "判断力が必ず低下する"], "page": "p20-21", "priority": "通常"}, {"id": 50, "cat": "保健② 運動と健康", "q": "運動による心の健康への効果として適切なのはどれか。", "a": "ストレスの軽減", "d": ["疲労の固定", "孤立の促進", "食事回数の減少"], "page": "p20-21", "priority": "通常"}, {"id": 51, "cat": "保健② 運動と健康", "q": "運動による心の健康への効果として教科書に示されているものはどれか。", "a": "コミュニケーションの機会", "d": ["学習時間の消失", "人との交流の減少", "睡眠不足の促進"], "page": "p20-21", "priority": "通常"}, {"id": 52, "cat": "保健② 運動と健康", "q": "現代社会で運動不足になりやすい背景として適切なのはどれか。", "a": "生活の便利化により体を使う機会が減っている", "d": ["学校がなくなったから", "食事が1日1回になったから", "競技の種類が減ったから"], "page": "p20-21", "priority": "通常"}, {"id": 53, "cat": "保健② 運動と健康", "q": "運動量を確保するための日常生活の工夫として適切なのはどれか。", "a": "近い距離は歩く", "d": ["すべて車で移動する", "階段を避ける", "座る時間を増やす"], "page": "p20-21", "priority": "通常"}, {"id": 54, "cat": "保健② 運動と健康", "q": "運動のしすぎについて教科書が注意していることはどれか。", "a": "発育途中の体に負担をかけすぎることがある", "d": ["必ず健康になる", "睡眠が不要になる", "食事が不要になる"], "page": "p20-21", "priority": "通常"}, {"id": 55, "cat": "保健③ 食事と健康", "q": "体をつくる栄養素として教科書に示されているものはどれか。", "a": "たんぱく質・カルシウム・鉄など", "d": ["酸素だけ", "水だけ", "塩分だけ"], "page": "p22-23", "priority": "章まとめ"}, {"id": 56, "cat": "保健③ 食事と健康", "q": "炭水化物や脂質の主な役割はどれか。", "a": "体を動かすためのエネルギーを生み出す", "d": ["骨だけをつくる", "視力だけを高める", "睡眠時間を延ばす"], "page": "p22-23", "priority": "章まとめ"}, {"id": 57, "cat": "保健③ 食事と健康", "q": "栄養素や水分などを体内に取り入れる過程に関係するものはどれか。", "a": "消化", "d": ["観戦", "競争", "応援"], "page": "p22-23", "priority": "通常"}, {"id": 58, "cat": "保健③ 食事と健康", "q": "発育期に適切な食事がとれず、体にとり入れる栄養素が不足すると起こりうることはどれか。", "a": "体や内臓などの発育が順調に進まない", "d": ["必ず身長が伸びる", "必ず体力が上がる", "病気と無関係になる"], "page": "p22-23", "priority": "通常"}, {"id": 59, "cat": "保健③ 食事と健康", "q": "エネルギーの過不足による問題として適切なのはどれか。", "a": "とりすぎると体脂肪が増えて肥満につながる", "d": ["不足すると必ず肥満になる", "とりすぎると必ず貧血になる", "不足すると必ず骨が強くなる"], "page": "p22-23", "priority": "章まとめ"}, {"id": 60, "cat": "保健③ 食事と健康", "q": "1日の食事回数として教科書が基本としているのはどれか。", "a": "1日3回", "d": ["1日1回", "1日2回", "1日5回"], "page": "p22-23", "priority": "通常"}, {"id": 61, "cat": "保健③ 食事と健康", "q": "健康的な食習慣として適切なのはどれか。", "a": "主食・主菜・副菜を基本に多くの食材を組み合わせる", "d": ["主食だけ食べる", "好きな食品だけ食べる", "食事回数を毎日変える"], "page": "p22-23", "priority": "通常"}, {"id": 62, "cat": "保健③ 食事と健康", "q": "自分に必要なエネルギー量は何によって異なるか。", "a": "性・年齢・体の大きさ・運動量など", "d": ["好きな教科だけ", "血液型だけ", "出席番号だけ"], "page": "p22-23", "priority": "通常"}, {"id": 63, "cat": "保健③ 食事と健康", "q": "朝食をとることによる変化として教科書の図で示されているのはどれか。", "a": "体温が上がる", "d": ["体温が必ず下がる", "呼吸が止まる", "脈拍がなくなる"], "page": "p22-23", "priority": "通常"}, {"id": 64, "cat": "保健③ 食事と健康", "q": "就寝直前に多く食べることについて適切なのはどれか。", "a": "消化器に負担をかけ、翌朝の食欲にも影響する", "d": ["睡眠の質を必ず高める", "翌朝必ず食欲が増す", "健康に影響しない"], "page": "p22-23", "priority": "通常"}, {"id": 65, "cat": "保健③ 食事と健康", "q": "朝食を食べる頻度と「調子が悪いと感じることがよくある」割合の関係として、教科書の資料から読み取れるのはどれか。", "a": "朝食を食べないほど、その割合が高い傾向がある", "d": ["朝食を食べないほど低い", "関係は全くみられない", "毎日食べる人が最も高い"], "page": "p22-23", "priority": "資料読み取り"}, {"id": 66, "cat": "保健④ 休養・睡眠", "q": "疲労がたまると起こりやすいこととして教科書に示されているのはどれか。", "a": "体の抵抗力が低下する", "d": ["必ず筋力が高まる", "必ず集中力が高まる", "必ず食欲が増える"], "page": "p24-25", "priority": "章まとめ"}, {"id": 67, "cat": "保健④ 休養・睡眠", "q": "疲労がたまったときの精神的な変化として適切なのはどれか。", "a": "気分が不安定になることがある", "d": ["常に集中力が増す", "必ず気分が高揚する", "判断力が必ず上がる"], "page": "p24-25", "priority": "通常"}, {"id": 68, "cat": "保健④ 休養・睡眠", "q": "疲労がたまる原因として教科書に示されているものはどれか。", "a": "運動や学習、作業などを長時間続けること", "d": ["適度な休養をとること", "十分な睡眠をとること", "気分転換をすること"], "page": "p24-25", "priority": "通常"}, {"id": 69, "cat": "保健④ 休養・睡眠", "q": "休養による疲労回復の方法として適切なのはどれか。", "a": "体を休める", "d": ["休まず作業を続ける", "夜更かしする", "食事を抜く"], "page": "p24-25", "priority": "章まとめ"}, {"id": 70, "cat": "保健④ 休養・睡眠", "q": "休養による疲労回復の方法として適切なのはどれか。", "a": "好きなことをするなど気分転換をする", "d": ["疲れても無理を続ける", "睡眠を削る", "運動を一切しない"], "page": "p24-25", "priority": "通常"}, {"id": 71, "cat": "保健④ 休養・睡眠", "q": "睡眠中、疲労回復に加えて起こることとして教科書に示されているのはどれか。", "a": "成長ホルモンが分泌される", "d": ["骨が消える", "心臓が止まる", "消化器が働かなくなる"], "page": "p24-25", "priority": "章まとめ"}, {"id": 72, "cat": "保健④ 休養・睡眠", "q": "成長ホルモンの分泌が多くなるのは、どのような睡眠のときか。", "a": "深い眠りのとき", "d": ["起きているときだけ", "食事中だけ", "運動中だけ"], "page": "p24-25", "priority": "通常"}, {"id": 73, "cat": "保健④ 休養・睡眠", "q": "睡眠の質を高めるために適切なのはどれか。",  "必ず折れやすくなる"], "page": "p28-29", "priority": "章まとめ"}, {"id": 86, "cat": "保健⑥ 章のまとめ", "q": "運動を続けると発達するものはどれか。", "a": "呼吸器・循環器", "d": ["視覚・聴覚", "味覚・嗅覚", "歯・毛髪"], "page": "p28-29", "priority": "章まとめ"}, {"id": 87, "cat": "保健⑥ 章のまとめ", "q": "運動は体の何を高め、疲れにくい体づくりに役立つか。", "a": "抵抗力", "d": ["身長だけ", "視力だけ", "睡眠時間だけ"], "page": "p28-29", "priority": "章まとめ"}, {"id": 88, "cat": "保健⑥ 章のまとめ", "q": "運動によって何が消費されるため、肥満や生活習慣病の予防に効果があるか。", "a": "エネルギー", "d": ["酸素だけ", "水分だけ", "カルシウムだけ"], "page": "p28-29", "priority": "章まとめ"}, {"id": 89, "cat": "保健⑥ 章のまとめ", "q": "運動をすることによって期待される心の効果はどれか。", "a": "気分転換", "d": ["緊張の固定", "不安の増加", "交流の減少"], "page": "p28-29", "priority": "章まとめ"}, {"id": 90, "cat": "保健⑥ 章のまとめ", "q": "たんぱく質が不足した場合に起こる可能性として、章のまとめで示されているものはどれか。", "a": "体力の低下・抵抗力の低下・皮膚病", "d": ["肥満・動脈硬化", "骨や歯の発育不良", "めまい・息切れ"], "page": "p28-29", "priority": "章まとめ"}, {"id": 91, "cat": "保健⑥ 章のまとめ", "q": "カルシウムが不足した場合に起こる可能性として、章のまとめで示されているものはどれか。", "a": "骨・歯の発育不良", "d": ["肥満・動脈硬化", "めまい・息切れ", "視力低下だけ"], "page": "p28-29", "priority": "章まとめ"}, {"id": 92, "cat": "保健⑥ 章のまとめ", "q": "鉄が不足した場合に起こる可能性として、章のまとめで示されているものはどれか。", "a": "貧血・めまい・息切れ", "d": ["肥満・動脈硬化", "骨・歯の発育不良", "大腸がん"], "page": "p28-29", "priority": "章まとめ"}, {"id": 93, "cat": "保健⑥ 章のまとめ", "q": "ビタミンAが不足した場合に起こる可能性として、章のまとめで示されているものはどれか。", "a": "視力低下・抵抗力低下・皮膚病", "d": ["肥満・動脈硬化", "骨・歯の発育不良", "貧血・息切れ"], "page": "p28-29", "priority": "章まとめ"}, {"id": 94, "cat": "保健⑥ 章のまとめ", "q": "脂肪をとりすぎた場合に起こる可能性として、章のまとめで示されているものはどれか。", "a": "肥満・動脈硬化・大腸がん", "d": ["骨・歯の発育不良", "貧血・めまい", "視力低下"], "page": "p28-29", "priority": "章まとめ"}, {"id": 95, "cat": "保健⑥ 章のまとめ", "q": "ナトリウム（食塩）をとりすぎた場合に起こる可能性として、章のまとめで示されているものはどれか。", "a": "高血圧", "d": ["貧血", "骨折", "視力低下"], "page": "p28-29", "priority": "章まとめ"}, {"id": 96, "cat": "保健⑥ 章のまとめ", "q": "心身の疲労を感じたとき、休養による回復として適切なのはどれか。", "a": "体を休める", "d": ["さらに無理をする", "睡眠を減らす", "食事を抜く"], "page": "p28-29", "priority": "章まとめ"}, {"id": 97, "cat": "保健⑥ 章のまとめ", "q": "疲労の回復に役立つ方法として適切なのはどれか。", "a": "気分転換をはかる", "d": ["夜更かしする", "休養を避ける", "食事回数を const STORE='health_pe_exam_2026_final_v2';
const WEAKKEY='weakLogV1';
const STUDYKEY='studyLogV1';
const $=s=>document.querySelector(s);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let mode='summary', turns=3, turnIndex=0, queue=[], current=null, answered=false, started=0, raf=0;
let slotDone=new Set(), firstSeen=new Set(), firstCorrect=0, wrong=0, timeoutN=0, sessionStart=0;

function loadLocal(key){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch(e){return {}}}
function saveLocal(key,v){localStorage.setItem(key,JSON.stringify(v))}

function updateWeak(q,kind,elapsed){
  const db=loadLocal(WEAKKEY);
  const key=`保健体育|保健体育・前期期末|${q.q}|${q.a}`;
  const r=db[key]||{subject:'保健体育',app:'保健体育・前期期末',category:q.cat,question:q.q,answer:q.a,correct:0,wrong:0,timeout:0,attempts:0,totalResponseSec:0,firstSeenAt:Date.now(),lastSeenAt:Date.now()};
  if(kind==='correct')r.correct++; else if(kind==='timeout')r.timeout++; else r.wrong++;
  r.attempts++; r.totalResponseSec += Math.max(0,Math.min(600,elapsed||0)); r.lastSeenAt=Date.now(); db[key]=r; saveLocal(WEAKKEY,db);
  const w=loadLocal(STORE); w[q.id]=w[q.id]||{wrong:0,timeout:0,correct:0};
  w[q.id][kind]=(w[q.id][kind]||0)+1; saveLocal(STORE,w);
}
function logStudyStart(){sessionStart=Date.now()}
function logStudyFinish(){
  const rows=(()=>{try{const x=JSON.parse(localStorage.getItem(STUDYKEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}})();
  const ended=Date.now(), d=new Date(ended), z=n=>String(n).padStart(2,'0');
  rows.push({subject:'保健体育',app:'保健体育・前期期末',turnLabel:`第${turnIndex+1}ターン`,
    date:`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`,
    startedAt:sessionStart,endedAt:ended,
    durationSec:Math.max(1,Math.round((ended-sessionStart)/1000))});
  localStorage.setItem(STUDYKEY,JSON.stringify(rows.slice(-1000)));
}

function pool(){
  if(mode==='pe') return BANK.filter(q=>q.page.startsWith('p6')||q.page.startsWith('p8')||q.page.startsWith('p10')||q.page.startsWith('p14'));
  if(mode==='health') return BANK.filter(q=>!['体育① 必要性と楽しさ','体育② かかわり方','体育③ 多様な楽しみ方','体育④ 章のまとめ'].includes(q.cat));
  if(mode==='summary') {
    const pri=BANK.filter(q=>q.priority==='章まとめ');
    const rest=BANK.filter(q=>q.priority!=='章まとめ');
    return [...shuffle(pri),...shuffle(pri),...shuffle(rest)];
  }
  if(mode==='weak'){
    const s=loadLocal(STORE);
    return [...BANK].sort((a,b)=>(((s[b.id]?.wrong||0)*2+(s[b.id]?.timeout||0))-((s[a.id]?.wrong||0)*2+(s[a.id]?.timeout||0))));
  }
  return BANK;
}
function makeTurn(){
  const p=pool();
  let picked=[];
  if(mode==='weak') {
    const s=loadLocal(STORE);
    const weak=p.filter(q=>(s[q.id]?.wrong||0)+(s[q.id]?.timeout||0)>0).slice(0,20);
    picked=[...weak];
    const rest=shuffle(BANK.filter(q=>!picked.some(x=>x.id===q.id)));
    picked.push(...rest.slice(0,20-picked.length));
  } else {
    const unique=[...new Map(shuffle(p).map(q=>[q.id,q])).values()];
    picked=unique.slice(0,20);
    if(picked.length<20) picked.push(...shuffle(BANK.filter(q=>!picked.some(x=>x.id===q.id))).slice(0,20-picked.length));
  }
  queue=picked.map((q,i)=>({q,slot:i,attempt:1})); slotDone=new Set(); firstSeen=new Set();
  firstCorrect=0; wrong=0; timeoutN=0;
}

function startTurn(){
  logStudyStart(); makeTurn();
  $('#setup').classList.add('hidden'); $('#result').classList.add('hidden'); $('#quiz').classList.remove('hidden');
  showQuestion();
}
function showQuestion(){
  cancelAnimationFrame(raf); answered=false;
  if(slotDone.size>=20) return finishTurn();
  current=queue.shift();
  if(!current) return finishTurn();
  const q=current.q;
  $('#turnPill').textContent=`第${turnIndex+1} / ${turns}ターン`;
  $('#progressPill').textContent=`クリア ${slotDone.size} / 20`;
  $('#qmeta').textContent=`${q.cat} ｜ 教科書 ${q.page}${q.priority==='章まとめ'?' ｜ ★章のまとめ重点':''}`;
  $('#question').textContent=q.q;
  $('#feedback').className='feedback hidden'; $('#feedback').textContent='';
  const opts=shuffle([q.a,...q.d]);
  const box=$('#choices'); box.innerHTML='';
  opts.forEach(v=>{const b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>answer(v,b);box.appendChild(b)});
  started=performance.now();
}
function tick(){}
function answer(v,btn){
  if(answered)return; answered=true; cancelAnimationFrame(raf);
  const q=current.q; const elapsed=(performance.now()-started)/1000; const ok=v===q.a;
  document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add('ok')}); 
  const f=$('#feedback'); f.classList.remove('hidden');
  const firstKey=current.slot;
  if(!firstSeen.has(firstKey)){firstSeen.add(firstKey); if(ok) firstCorrect++;}
  if(ok){
    updateWeak(q,'correct',elapsed); slotDone.add(current.slot); f.textContent='✅ 正解！'; f.classList.add('good');
    setTimeout(showQuestion,800);
  }else{
    if(btn)btn.classList.add('ng');
    const kind=btn?'wrong':'timeout'; updateWeak(q,kind,elapsed); if(btn)wrong++;else timeoutN++;
    queue.push({q,slot:current.slot,attempt:current.attempt+1});
    f.textContent=(btn?'❌ 不正解':'⏰ 時間切れ')+`　正解：${q.a}　→ ターンの最後でもう一度`;
    f.classList.add('bad'); setTimeout(showQuestion,1500);
  }
}
function finishTurn(){
  logStudyFinish(); $('#quiz').classList.add('hidden'); $('#result').classList.remove('hidden');
  $('#score').textContent=`${firstCorrect} / 20`;
  $('#firstCorrect').textContent=firstCorrect; $('#wrongN').textContent=wrong; $('#timeoutN').textContent=timeoutN;
  $('#nextTurnBtn').textContent=turnIndex+1<turns?'次のターンへ':'終了';
}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.style.outline='');b.style.outline='4px solid #93c5fd'});
document.querySelectorAll('#turnBtns button').forEach(b=>b.onclick=()=>{turns=+b.dataset.n;document.querySelectorAll('#turnBtns button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
$('#startBtn').onclick=()=>{turnIndex=0;startTurn()};
$('#nextTurnBtn').onclick=()=>{if(turnIndex+1>=turns){location.reload()}else{turnIndex++;startTurn()}};
$('#homeBtn').onclick=()=>location.reload();
</script>
</body></html>
