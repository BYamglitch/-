<head>

<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#18212f;--muted:#67748a;--line:#dbe2ec;--accent:#315fb4;--ok:#1a7f4b;--ng:#b63b3b}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 24px #0000000d}
h1{font-size:30px;margin:0 0 10px} .lead{color:var(--muted);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}
.mode,.primary,.choice,.next{border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:800;cursor:pointer}
.mode{background:#edf2fb;text-align:left} .mode small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.primary{width:100%;background:var(--accent);color:white}
.hidden{display:none!important}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;font-weight:800}
.barbg{height:14px;background:#e6ebf2;border-radius:999px;overflow:hidden;margin:8px 0 18px}
.bar{height:100%;width:100%;background:var(--accent);transform-origin:left center}
.q{font-size:27px;line-height:1.55;font-weight:900;margin:8px 0 20px}
.choices{display:grid;gap:12px}
.choice{background:#f7f9fc;border:2px solid var(--line);text-align:left;min-height:66px}
.choice.correct{border-color:var(--ok);background:#eefaf3} .choice.wrong{border-color:var(--ng);background:#fff1f1}
.feedback{min-height:52px;margin-top:14px;font-size:18px;font-weight:800;line-height:1.5}
.next{width:100%;background:#202a3a;color:#fff;margin-top:6px}
.pill{display:inline-block;background:#eef2f7;border-radius:999px;padding:6px 10px;font-size:13px;color:var(--muted);font-weight:800}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{background:#f5f7fb;border-radius:14px;padding:14px;text-align:center} .stat b{display:block;font-size:25px}
@media(max-width:600px){.grid{grid-template-columns:1fr} .q{font-size:23px} .choice{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">

<div class="grid">
<button class="mode" data-mode="all">🔥 総合MIX<small>全分野から20問</small></button>
<button class="mode" data-mode="運動と健康">💪 運動と健康<small>発達・有酸素運動・心身への効果</small></button>

<button class="mode" data-mode="食事と健康">🍚 食事と健康<small>栄養・欠乏/過剰・食事のリズム</small></button>
<button class="mode" data-mode="weak">💀 苦手優先<small>誤答・時間切れの多い問題を優先</small></button>
</div>
</section>

<section id="quiz" class="card hidden">
<div class="top">
<span id="modeLabel"></span>
<span id="progress"></span>
</div>
<div class="barbg"><div id="bar" class="bar"></div></div>
<div><span id="cat" class="pill"></span></div>
<div id="question" class="q"></div>
<div id="choices" class="choices"></div>
<div id="feedback" class="feedback"></div>
<button id="next" class="next hidden">次へ</button>
</section>

<h1>✅ ターン完了</h1>
<p class="lead">最初の20問をすべて正解しました。</p>

<button id="again" class="primary">もう1ターン</button>
</section>
</div>

let mode="all", queue=[], totalSlots=20, slotDone=new Set(), firstAttempt=new Map();
let current=null, currentSlot=null, timer=null, deadline=0, answered=false;
let wrong=0, timeouts=0;

function buildSession(m){
 const base=m==="all"?ALL:m==="weak"?null:ALL.filter(q=>q.cat===m || (m==="運動と健康"&&q.cat==="総合") || (m==="食事と健康"&&q.cat==="総合") || (m==="スポーツの楽しみ方"&&q.cat==="総合"));
 if(m==="weak"){
   const s=stats();
   const ranked=ALL.map(q=>({q,score:(s[q.id]?.wrong||0)*2+(s[q.id]?.timeout||0)})).sort((a,b)=>b.score-a.score);
   const weak=ranked.filter(x=>x.score>0).map(x=>x.q);
   const rest=ALL.filter(q=>!weak.some(w=>w.id===q.id));
   return shuffle([...weak.slice(0,20),...pick(rest,20-weak.slice(0,20).length)]);
 }
 return pick(base,20);
}

function start(m){
 mode=m; const qs=buildSession(m);
 queue=qs.map((q,i)=>({q,slot:i}));
 totalSlots=queue.length; slotDone=new Set(); firstAttempt=new Map(); wrong=0; timeouts=0;
 $("#start").classList.add("hidden"); $("#result").classList.add("hidden"); $("#quiz").classList.remove("hidden");
 $("#modeLabel").textContent={all:"🔥 総合MIX",weak:"💀 苦手優先"}[m]||m;
 nextQ();
}

function nextQ(){
 clearInterval(timer); answered=false; $("#feedback").textContent=""; $("#next").classList.add("hidden");
 if(queue.length===0) return finish();
 const item=queue.shift(); current=item.q; currentSlot=item.slot;
 $("#cat").textContent=current.cat;
 $("#question").textContent=current.q;
 $("#progress").textContent=`正解済み ${slotDone.size} / ${totalSlots}`;
 const choices=shuffle([current.a,...current.d]);
 const box=$("#choices"); box.innerHTML="";
 choices.forEach(c=>{
   const b=document.createElement("button"); b.className="choice"; b.textContent=c;
   b.onclick=()=>answer(c,b); box.appendChild(b);
 });
 deadline=Date.now()+20000;
 updateBar(); timer=setInterval(updateBar,100);
}

function updateBar(){
 const left=Math.max(0,deadline-Date.now());
 $("#bar").style.transform=`scaleX(${left/20000})`;
 if(left<=0){clearInterval(timer);timeout();}
}

function markButtons(correct,clicked=null){
 [...document.querySelectorAll(".choice")].forEach(b=>{
   b.disabled=true;
   if(b.textContent===current.a)b.classList.add("correct");
 });
 if(clicked&&clicked.textContent!==current.a)clicked.classList.add("wrong");
}

function answer(val,btn){
 if(answered)return; answered=true; clearInterval(timer);
 const isFirst=!firstAttempt.has(currentSlot);
 if(isFirst) firstAttempt.set(currentSlot,val===current.a);
 if(val===current.a){
   saveStat(current.id,"correct"); markButtons(true,btn);
   $("#feedback").textContent="○ 正解！";
   slotDone.add(currentSlot);
   setTimeout(nextQ,900);
 }else{
   wrong++; saveStat(current.id,"wrong"); markButtons(false,btn);
   $("#feedback").textContent=`× 正解は「${current.a}」`;
   queue.push({q:current,slot:currentSlot});
   $("#next").classList.remove("hidden");
 }
}

function timeout(){
 if(answered)return; answered=true; timeouts++; saveStat(current.id,"timeout");
 const isFirst=!firstAttempt.has(currentSlot); if(isFirst) firstAttempt.set(currentSlot,false);
 markButtons(false);
 $("#feedback").textContent=`時間切れ。正解は「${current.a}」`;
 queue.push({q:current,slot:currentSlot});
 $("#next").classList.remove("hidden");
}
$("#next").onclick=nextQ;

function finish(){
 $("#quiz").classList.add("hidden"); $("#result").classList.remove("hidden");
 const first=[...firstAttempt.values()].filter(Boolean).length;
 $("#firstScore").textContent=`${first}/${totalSlots}`;
 $("#wrongCount").textContent=wrong;
 $("#timeoutCount").textContent=timeouts;
}
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(b.dataset.mode));
$("#again").onclick=()=>{$("#result").classList.add("hidden");$("#start").classList.remove("hidden")};
</script>
</body></html>
