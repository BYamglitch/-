点をもつ企業を何というか。","a":"多国籍企業","id":154,"scope":"正式範囲","cat":"teacher","d":["国営企業","中小企業","協同組合"]},{"chapter":6,"title":"北アメリカ州","num":996,"q":"車社会などによるCO2排出増加と関係する環境問題は何か。","a":"地球温暖化","id":155,"scope":"正式範囲","cat":"teacher","d":["砂漠化だけ","酸性雨だけ","海面低下"]},{"chapter":6,"title":"北アメリカ州","num":997,"q":"CO2など、地球温暖化に関係する気体を何というか。","a":"温室効果ガス","id":156,"scope":"正式範囲","cat":"teacher","d":["希ガス","不活性ガス","燃料ガス"]},{"chapter":6,"title":"北アメリカ州","num":998,"q":"太陽光など、繰り返し利用できるエネルギーを何というか。","a":"再生可能エネルギー","id":157,"scope":"正式範囲","cat":"teacher","d":["化石燃料","鉱産資源","一次産品"]}];const KEY="socialWeakLogV2",$=id=>document.getElementById(id);function load(){try{return Object.values(JSON.parse(localStorage.getItem(KEY)||"{}")||{})}catch(e){return[]}}function avg(r){return r.attempts?Math.round((r.totalMs||0)/r.attempts/100)/10:0}function score(r){return (r.wrong||0)*4+(r.timeout||0)*5+(r.slow||0)*2+Math.max(0,(avg(r)-8)/2)-(r.streak||0)}function weak(r){return (r.wrong||0)+(r.timeout||0)+(r.slow||0)>0 && (r.streak||0)<3}function filtBank(){const a=$('area').value;return BANK.filter(q=>a==='all'||String(q.chapter)===a)}function logs(){const a=$('area').value;return load().filter(r=>a==='all'||String(r.chapter)===a)}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){const a=logs(),w=a.filter(weak),days=new Set();a.forEach(r=>Object.keys(r.daily||{}).forEach(d=>days.add(d)));$('allN').textContent=a.length;$('weakN').textContent=w.length;$('slowN').textContent=a.reduce((s,r)=>s+(r.slow||0),0);$('daysN').textContent=days.size;$('rows').innerHTML=w.sort((x,y)=>score(y)-score(x)).slice(0,100).map(r=>`<tr><td>${esc(r.question)}</td><td>${esc(r.title||'')}</td><td>${r.wrong||0}</td><td>${r.timeout||0}</td><td>${r.slow||0}</td><td>${avg(r)}秒</td><td class="score">${score(r).toFixed(1)}</td></tr>`).join('')||'<tr><td colspan="7">苦手ログはまだありません。</td></tr>';const dd={};a.forEach(r=>Object.entries(r.daily||{}).forEach(([d,x])=>{const z=dd[d]||(dd[d]={attempts:0,correct:0,wrong:0,timeout:0,slow:0});for(const k of Object.keys(z))z[k]+=x[k]||0}));$('daily').innerHTML=Object.entries(dd).sort((a,b)=>b[0].localeCompare(a[0])).map(([d,x])=>`<tr><td>${d}</td><td>${x.attempts}</td><td>${x.correct}</td><td>${x.wrong}</td><td>${x.timeout}</td><td>${x.slow}</td></tr>`).join('')||'<tr><td colspan="6">今回の更新後から日別集計されます。</td></tr>'}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function choices(q){return shuffle([q.a,...(q.d||[]).slice(0,3)])}function paper(list,title){$('paperTitle').textContent=title;$('questions').innerHTML=list.map((q,i)=>{const op=choices(q);return `<div class="qitem"><div><span class="qnum">${i+1}.</span> ${esc(q.q)}</div><div class="tag">${esc(q.title)}</div><div class="opts">${op.map((x,j)=>`<span>${['①','②','③','④'][j]} ${esc(x)}</span>`).join('')}</div><div class="answerLine"></div></div>`}).join('');$('answers').innerHTML=list.map((q,i)=>`<p><b>${i+1}.</b> ${esc(q.a)}</p>`).join('');window._paper=list;alert(`${title}を${list.length}問作成しました。`)}function fill(base,pool,n){const ids=new Set(base.map(q=>q.id));for(const q of shuffle(pool)){if(base.length>=n)break;if(!ids.has(q.id)){base.push(q);ids.add(q.id)}}return base}$('area').onchange=render;$('drillBtn').onclick=()=>{const n=+$('count').value,m=new Map(BANK.map(q=>[String(q.id),q])),qs=logs().filter(weak).sort((a,b)=>score(b)-score(a)).map(r=>m.get(String(r.id))).filter(Boolean);if(!qs.length)return alert('苦手問題がまだありません。');paper(qs.slice(0,n),'社会・地理 苦手集中ドリル')};$('mockBtn').onclick=()=>{const n=+$('count').value,mode=$('mode').value,pool=filtBank(),m=new Map(pool.map(q=>[String(q.id),q])),ls=logs().sort((a,b)=>score(b)-score(a)),weakQs=ls.filter(weak).map(r=>m.get(String(r.id))).filter(Boolean),ratio=mode==='weak'?.7:mode==='balance'?.5:.35,p=[];fill(p,weakQs,Math.round(n*ratio));fill(p,pool,n);paper(shuffle(p).slice(0,n),'社会・地理 正式範囲 最終模擬テスト')};$('printBtn').onclick=()=>{if(!window._paper)return alert('先に問題を作ってください。');window.print()};$('clearBtn').onclick=()=>{if(confirm('社会・地理の苦手ログをすべてリセットしますか？')){localStorage.removeItem(KEY);render()}};render();</script></body></html>
