r){return (r.wrong||0)+(r.timeout||0)+(r.slow||0)>0 && (r.streak||0)<3}function filtBank(){const a=$('area').value;return BANK.filter(q=>a==='all'||String(q.chapter)===a)}function logs(){const a=$('area').value;return load().filter(r=>a==='all'||String(r.chapter)===a)}function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){const a=logs(),w=a.filter(weak),days=new Set();a.forEach(r=>Object.keys(r.daily||{}).forEach(d=>days.add(d)));$('allN').textContent=a.length;$('weakN').textContent=w.length;$('slowN').textContent=a.reduce((s,r)=>s+(r.slow||0),0);$('daysN').textContent=days.size;$('rows').innerHTML=w.sort((x,y)=>score(y)-score(x)).slice(0,100).map(r=>`<tr><td>${esc(r.question)}</td><td>${esc(r.title||'')}</td><td>${r.wrong||0}</td><td>${r.timeout||0}</td><td>${r.slow||0}</td><td>${avg(r)}秒</td><td class="score">${score(r).toFixed(1)}</td></tr>`).join('')||'<tr><td colspan="7">苦手ログはまだありません。</td></tr>';const dd={};a.forEach(r=>Object.entries(r.daily||{}).forEach(([d,x])=>{const z=dd[d]||(dd[d]={attempts:0,correct:0,wrong:0,timeout:0,slow:0});for(const k of Object.keys(z))z[k]+=x[k]||0}));$('daily').innerHTML=Object.entries(dd).sort((a,b)=>b[0].localeCompare(a[0])).map(([d,x])=>`<tr><td>${d}</td><td>${x.attempts}</td><td>${x.correct}</td><td>${x.wrong}</td><td>${x.timeout}</td><td>${x.slow}</td></tr>`).join('')||'<tr><td colspan="6">今回の更新後から日別集計されます。時間制限はなく、20秒以上かかった回答を「遅答」として記録します。</td></tr>'}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function paper(list,title){$('paperTitle').textContent=title;$('questions').innerHTML=list.map((q,i)=>{const longAns=String(q.a||'').length>=18||/[理由|ため|こと|影響|原因]/.test(String(q.q||''));return `<div class="qitem"><div><span class="qnum">${i+1}.</span> ${esc(q.q)}</div><div class="tag">${esc(q.title)}</div><div class="answerBox${longAns?' long':''}"></div></div>`}).join('');$('answers').innerHTML=list.map((q,i)=>`<p><b>${i+1}.</b> ${esc(q.a)}</p>`).join('');window._paper=list;alert(`${title}を${list.length}問作成しました。選択肢なしの記述式です。`)}function fill(base,pool,n){const ids=new Set(base.map(q=>q.id));for(const q of shuffle(pool)){if(base.length>=n)break;if(!ids.has(q.id)){base.push(q);ids.add(q.id)}}return base}$('area').onchange=render;$('drillBtn').onclick=()=>{const n=+$('count').value,m=new Map(BANK.map(q=>[String(q.id),q])),qs=logs().filter(weak).sort((a,b)=>score(b)-score(a)).map(r=>m.get(String(r.id))).filter(Boolean);if(!qs.length)return alert('苦手問題がまだありません。');paper(qs.slice(0,n),'社会・地理 苦手集中ドリル')};$('mockBtn').onclick=()=>{const n=+$('count').value,mode=$('mode').value,pool=filtBank(),m=new Map(pool.map(q=>[String(q.id),q])),ls=logs().sort((a,b)=>score(b)-score(a)),weakQs=ls.filter(weak).map(r=>m.get(String(r.id))).filter(Boolean),ratio=mode==='weak'?.7:mode==='balance'?.5:.35,p=[];fill(p,weakQs,Math.round(n*ratio));fill(p,pool,n);paper(shuffle(p).slice(0,n),'社会・地理 追加資料統合版 最終模擬テスト')};$('printBtn').onclick=()=>{if(!window._paper)return alert('先に問題を作ってください。');window.print()};$('clearBtn').onclick=()=>{if(confirm('社会・地理の苦手ログをすべてリセットしますか？')){localStorage.removeItem(KEY);render()}};render();</script></body></html>
