function migrateLegacy(){
  if(localStorage.getItem("socialLegacyMigratedV2"))return;
  try{
    const old=JSON.parse(localStorage.getItem("geoWeak20Mastery_v1")||"{}")||{};
    const cur=JSON.parse(localStorage.getItem(KEY)||"{}")||{};
    for(const [id,v] of Object.entries(old)){
      const q=BANK.find(x=>String(x.id)===String(id)); if(!q)continue;
      const w=v.wrong||0,t=v.timeout||0; if(w+t<=0)continue;
      const r=cur[id]||{id:q.id,question:q.q,answer:q.a,wrong:0,timeout:0,slow:0,attempts:0,correct:0,totalMs:0,maxMs:0,streak:0,lastSeenAt:Date.now()};
      r.scope=q.scope;r.title=q.title;r.question=q.q;r.answer=q.a;
      r.wrong=Math.max(r.wrong||0,w);r.timeout=Math.max(r.timeout||0,t);r.attempts=Math.max(r.attempts||0,w+t);cur[id]=r;
    }
    localStorage.setItem(KEY,JSON.stringify(cur));localStorage.setItem("socialLegacyMigratedV2","1");
  }catch(e){}
}
migrateLegacy();
const $=id=>document.getElementById(id);const SCOPE_IDS=new Set(BANK.map(q=>String(q.id)));function load(){try{return Object.values(JSON.parse(localStorage.getItem(KEY)||"{}")||{}).filter(r=>SCOPE_IDS.has(String(r.id)))}catch(e){return []}}function avg(r){return r.attempts?Math.round((r.totalMs||0)/r.attempts):0}function days(ts){return Math.max(0,(Date.now()-(ts||0))/86400000)}function score(r){const w=r.wrong||0,t=r.timeout||0,s=r.slow||0,a=avg(r)/1000,recent=Math.max(0,3-days(r.lastSeenAt)/7);return Math.round((w*4+t*5+s*2+Math.max(0,a-12.0*.65)*.7+recent-(r.streak||0)*.8)*10)/10}function weak(r){return (r.wrong||0)+(r.timeout||0)+(r.slow||0)>0&&score(r)>0}function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function uniq(a){return [...new Set(a)]}
function choices(q){return shuffle([q.a,...(q.d||[]).slice(0,3)])}
function render(){const a=load().sort((x,y)=>score(y)-score(x)),w=a.filter(weak);$("allN").textContent=a.length;$("weakN").textContent=w.length;$("slowN").textContent=a.filter(r=>(r.slow||0)>0).length;$("seenN").textContent=a.reduce((n,r)=>n+(r.attempts||0),0);$("rows").innerHTML=w.slice(0,100).map(r=>`<tr><td>${esc(r.question)}<div class="tag">${esc(r.answer)}</div></td><td>${esc(`第${r.chapter||"?"}章 ${r.title||""}`)}</td><td>${r.wrong||0}</td><td>${r.timeout||0}</td><td>${r.slow||0}</td><td>${(avg(r)/1000).toFixed(1)}秒</td><td class="score">${score(r)}</td></tr>`).join("")||'<tr><td colspan="7">まだ苦手ログがありません。アプリを解くとここに蓄積されます。</td></tr>'}
function bankMap(){return new Map(BANK.map(q=>[String(q.id),q]))}function loggedQuestions(){const m=bankMap();return load().map(r=>({r,q:m.get(String(r.id))})).filter(x=>x.q)}function fill(base,pool,n){const ids=new Set(base.map(q=>String(q.id)));for(const q of pool){if(base.length>=n)break;if(!ids.has(String(q.id))){base.push(q);ids.add(String(q.id))}}return base}
function balanced(list,n){return list.slice(0,n)}
function paper(list,title){$("paperTitle").textContent=title;$("questions").innerHTML=list.map((q,i)=>{const op=choices(q);return `<div class="qitem"><div><span class="qnum">${i+1}.</span> ${esc(q.q)}</div><div class="tag">${esc(q.scope)} ／ ${esc(q.section||q.title||"")}</div><div class="opts">${op.map((x,j)=>`<span>${["①","②","③","④"][j]||"・"} ${esc(x)}</span>`).join("")}</div><div class="answerLine"></div></div>`}).join("");$("answers").innerHTML=list.map((q,i)=>`<div class="answerItem"><b>${i+1}.</b> ${esc(q.a)} <span class="tag">（${esc(q.q)}）</span></div>`).join("");window._paper=list;alert(`${title}を${list.length}問作成しました。「表示中の問題を印刷」でA4印刷できます。`)}
$("drillBtn").onclick=()=>{const n=+$("count").value,th=$("threshold").value,m=bankMap();let r=load().filter(x=>th==="wrong2"?(x.wrong||0)>=2:th==="wrong3"?(x.wrong||0)>=3:th==="slow"?(x.slow||0)>0:weak(x)).sort((a,b)=>score(b)-score(a));let qs=r.map(x=>m.get(String(x.id))).filter(Boolean);if(!qs.length)return alert("条件に合う苦手問題がまだありません。");paper(balanced(qs,n),"社会・地理 正式範囲 苦手集中ドリル")};
$("mockBtn").onclick=()=>{const n=+$("count").value,mode=$("mode").value,m=bankMap(),logs=load().sort((a,b)=>score(b)-score(a)),weakIds=logs.filter(weak).map(r=>String(r.id));if(!logs.length)return alert("模擬テストを作るための学習ログがまだありません。");const weakQs=weakIds.map(id=>m.get(id)).filter(Boolean);const ratio=mode==="weak"?.7:mode==="balance"?.5:.35;let p=[];fill(p,weakQs,Math.round(n*ratio));fill(p,shuffle(BANK.filter(q=>!weakIds.includes(String(q.id)))),n);p=balanced(p,n);paper(shuffle(p),"社会・地理 正式範囲 最終模擬テスト")};
$("printBtn").onclick=()=>{if(!window._paper?.length)return alert("先に紙ドリルか模擬テストを作ってください。");window.print()};$("clearBtn").onclick=()=>{if(confirm("社会・地理の苦手ログを初期化しますか？")){localStorage.removeItem(KEY);render()}};render();</script></body></html>
