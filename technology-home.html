<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>技術家庭 前期期末試験対策</title>
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#172033;--sub:#667085;--line:#d9e2ec;--tech:#334155;--home:#b56518;--mix:#2563eb;--good:#078747;--bad:#c43b31}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(#edf3f8,#fafcff);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink)}
.wrap{max-width:900px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 8px 26px #17203312;margin-bottom:14px}
h1{font-size:clamp(30px,6vw,44px);margin:0 0 8px}.sub{color:var(--sub);line-height:1.7}
.modegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:18px 0}@media(max-width:650px){.modegrid{grid-template-columns:1fr}}
.mode{border:2px solid var(--line);border-radius:17px;padding:17px 14px;background:#fff;text-align:left;font-weight:900;font-size:19px;min-height:90px}
.mode small{display:block;color:var(--sub);font-size:13px;margin-top:5px;line-height:1.4}.mode.sel{outline:4px solid #bfdbfe;border-color:#60a5fa}
.turnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.turnrow button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-weight:800}
.turnrow button.sel{border-color:var(--mix);background:#eaf1ff;color:var(--mix)}
.primary,.secondary{width:100%;border:0;border-radius:14px;padding:14px;font-weight:900;font-size:17px;margin-top:9px}.primary{background:var(--mix);color:#fff}.secondary{background:#edf2f7;color:#334155}
.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.pill{background:#eef2f7;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:850}
.progress{height:10px;background:#e7edf4;border-radius:999px;overflow:hidden;margin:13px 0}.progress div{height:100%;background:var(--mix);width:0;transition:.2s}
.timer{height:8px;background:#e7edf4;border-radius:999px;overflow:hidden;margin:8px 0 18px}.timer div{height:100%;background:#64748b;width:100%;transform-origin:left}
.meta{font-size:13px;color:var(--sub);font-weight:800;margin-bottom:8px}.question{font-size:clamp(23px,4.8vw,32px);font-weight:950;line-height:1.45;margin:8px 0 18px}
.choices{display:grid;gap:10px}.choice{width:100%;min-height:62px;border:2px solid var(--line);background:#fff;border-radius:15px;padding:13px 14px;text-align:left;font-size:17px;font-weight:850;line-height:1.4}
.choice.ok{border-color:var(--good);background:#edfdf2;color:#116b31}.choice.ng{border-color:var(--bad);background:#fff0f0;color:#991b1b}
.feedback{margin-top:13px;border-radius:14px;padding:12px 14px;font-weight:850;line-height:1.5;background:#f1f5f9}.feedback.good{border-left:5px solid var(--good)}.feedback.bad{border-left:5px solid var(--bad)}
.score{font-size:44px;font-weight:1000;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8fafc;border-radius:12px;padding:11px;text-align:center}.stat b{display:block;font-size:25px}
.note{font-size:12px;color:var(--sub);line-height:1.65;margin-top:12px}
</style></head><body><main class="wrap">
<section id="setup" class="card">
<h1>技術家庭 期末対策</h1>
<div class="sub">本番と同じ「技術＋家庭科」を1本に統合しました。<br>単独演習も、技術10問＋家庭科10問の総合演習もできます。</div>
<div class="modegrid" id="modes">
<button class="mode" data-mode="tech">🛠️ 技術<small>技術だけ20問</small></button>
<button class="mode" data-mode="home">🍳 家庭科<small>家庭科だけ20問</small></button>
<button class="mode sel" data-mode="mix">🎯 総合問題<small>技術10問＋家庭科10問</small></button>
</div>
<div><b>ターン数</b></div>
<div class="turnrow" id="turnBtns"><button class="sel" data-n="3">3ターン</button><button data-n="4">4ターン</button><button data-n="5">5ターン</button><button data-n="6">6ターン</button></div>
<button id="startBtn" class="primary">開始</button>
<div class="note">1ターン20問・1問20秒。誤答／時間切れは同じターンの最後へ回し、正解するまで反復します。学習時間ログ・苦手ログにも対応しています。</div>
</section>

<section id="quiz" class="card hidden">
<div class="top"><span id="turnPill" class="pill"></span><span id="progressPill" class="pill"></span><span id="timePill" class="pill">20秒</span></div>
<div class="progress"><div id="progressBar"></div></div><div class="timer"><div id="timerBar"></div></div>
<div id="meta" class="meta"></div><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="feedback" class="feedback hidden"></div>
</section>

<section id="result" class="card hidden">
<h1>ターン終了！</h1><div id="score" class="score"></div>
<div class="stats"><div class="stat"><b id="firstN">0</b>初回正解</div><div class="stat"><b id="wrongN">0</b>誤答</div><div class="stat"><b id="timeoutN">0</b>時間切れ</div></div>
<button id="nextBtn" class="primary">次のターンへ</button><button id="homeBtn" class="secondary">最初に戻る</button>
</section>
</main>
<script>
const BANK=[{"id":"T1","subject":"技術","cat":"工夫と材料","q":"木材の特徴として最も適切なのはどれか。","a":"繊維方向によって強さや加工のしやすさが異なる","d":["どの方向でも全く同じ性質をもつ","水分を全く含まない","熱を加えると必ず透明になる"]},{"id":"T2","subject":"技術","cat":"工夫と材料","q":"木材の年輪から読み取れることとして最も適切なのはどれか。","a":"成長の様子","d":["電気抵抗","融点","磁力"]},{"id":"T3","subject":"技術","cat":"工夫と材料","q":"木材を乾燥させる主な目的として適切なのはどれか。","a":"変形や割れを減らし利用しやすくする","d":["必ず色を白くする","金属に変える","電気を通しやすくする"]},{"id":"T4","subject":"技術","cat":"工夫と材料","q":"木質材料の例として最も適切なのはどれか。","a":"合板","d":["PET","アルミニウム","鋼"]},{"id":"T5","subject":"技術","cat":"工夫と材料","q":"合板は主にどのように作られるか。","a":"薄い板を繊維方向を変えて重ねて接着する","d":["木粉を溶かして鋳型に流す","金属板を重ねて溶接する","樹脂を発泡させる"]},{"id":"T6","subject":"技術","cat":"工夫と材料","q":"集成材の説明として適切なのはどれか。","a":"ひき板などを接着してつくる木質材料","d":["薄板を必ず直角に重ねる材料","金属粉を焼き固めた材料","熱可塑性樹脂を成形した材料"]},{"id":"T7","subject":"技術","cat":"工夫と材料","q":"金属の性質として一般に当てはまりやすいものはどれか。","a":"熱や電気を伝えやすい","d":["全て水に浮く","全て磁石につく","全て透明である"]},{"id":"T8","subject":"技術","cat":"工夫と材料","q":"鉄を主成分とする金属材料として最も適切なのはどれか。","a":"鋼","d":["アルミニウム","銅","チタン"]},{"id":"T9","subject":"技術","cat":"工夫と材料","q":"アルミニウムの特徴として適切なのはどれか。","a":"比較的軽い","d":["必ず磁石に強くつく","木材より必ず重い","透明である"]},{"id":"T10","subject":"技術","cat":"工夫と材料","q":"銅の利用例として適切なのはどれか。","a":"電線","d":["木製家具","ガラス窓","紙袋"]},{"id":"T11","subject":"技術","cat":"工夫と材料","q":"プラスチックの特徴として適切なのはどれか。","a":"種類によって性質が異なり成形しやすいものが多い","d":["全て同じ温度で溶ける","全て水に溶ける","全て金属より重い"]},{"id":"T12","subject":"技術","cat":"工夫と材料","q":"PETの分類として適切なのはどれか。","a":"プラスチック","d":["木質材料","金属材料","セラミックス"]},{"id":"T13","subject":"技術","cat":"工夫と材料","q":"プラスチックの識別表示が役立つ主な目的はどれか。","a":"分別やリサイクル","d":["木材の乾燥","金属の熱処理","発電量の測定"]},{"id":"T14","subject":"技術","cat":"木材の加工と構造","q":"丈夫な構造にする工夫として適切なのはどれか。","a":"三角形を利用する","d":["細長い部材だけを使う","接合部を固定しない","必ず曲線だけにする"]},{"id":"T15","subject":"技術","cat":"木材の加工と構造","q":"構造を丈夫にする方法として適切なのはどれか。","a":"筋かいを入れる","d":["接合部をゆるくする","材料をできるだけ薄くする","支えをなくす"]},{"id":"T16","subject":"技術","cat":"木材の加工と構造","q":"製図で、物体を正面・平面・側面などから表す方法はどれか。","a":"第三角法による正投影図","d":["透視図","地形図","円グラフ"]},{"id":"T1 function answer(v,btn){
 if(locked)return;locked=true;cancelAnimationFrame(raf);const q=current.q,sec=Math.min(20,(performance.now()-startAt)/1000),ok=v===q.a;
 document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add('ok')});
 const f=$('#feedback');f.classList.remove('hidden');if(!firstSeen.has(current.slot)){firstSeen.add(current.slot);if(ok)firstCorrect++;}
 if(ok){logWeak(q,'correct',sec);done.add(current.slot);f.textContent='✅ 正解！';f.classList.add('good');setTimeout(show,800)}
 else{if(btn)btn.classList.add('ng');const kind=btn?'wrong':'timeout';logWeak(q,kind,sec);if(btn)wrong++;else timeouts++;queue.push(current);f.textContent=(btn?'❌ 不正解':'⏰ 時間切れ')+`　正解：${q.a}　→ ターンの最後でもう一度`;f.classList.add('bad');setTimeout(show,1450)}
}
function finish(){logStudy();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#score').textContent=`${firstCorrect} / 20`;$('#firstN').textContent=firstCorrect;$('#wrongN').textContent=wrong;$('#timeoutN').textContent=timeouts;$('#nextBtn').textContent=turn+1<turns?'次のターンへ':'終了'}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
document.querySelectorAll('#turnBtns button').forEach(b=>b.onclick=()=>{turns=+b.dataset.n;document.querySelectorAll('#turnBtns button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});
$('#startBtn').onclick=()=>{turn=0;begin()};$('#nextBtn').onclick=()=>{if(turn+1>=turns)location.reload();else{turn++;begin()}};$('#homeBtn').onclick=()=>location.reload();
</script></body></html>
