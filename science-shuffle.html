.feedback{display:none;margin-top:14px;padding:13px 14px;border-radius:14px;background:#f2f5f9;line-height:1.5}

.stat{background:#f4f6fa;border-radius:14px;padding:12px 8px;text-align:center}

.primary{background:var(--accent);color:#fff}

.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:16px}

<script>
/* ===== 共通学習ログ v2 ===== */
(function(){
  if(window.StudyLog) return;
  const KEY="studyLogV1";
  let running=false, activeSec=0, last=0, turnStartedAt=null, meta={};

  function now(){ return Date.now(); }
  function localDate(ts){
    const d=new Date(ts), z=n=>String(n).padStart(2,"0");
    return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
  }
  function addActive(){
    if(running && !document.hidden && last){
      activeSec += Math.max(0,(now()-last)/1000);
    }
    last=now();
  }
  function load(){
    try{
      const x=JSON.parse(localStorage.getItem(KEY)||"[]");
      return Array.isArray(x)?x:[];
    }catch(e){ return []; }
  }
  function save(rows){
    if(rows.length>1000) rows=rows.slice(-1000);
    localStorage.setItem(KEY,JSON.stringify(rows));
  }

  window.StudyLog={
    startTurn(m={}){
      if(running) return;
      meta=m||{};
      running=true;
      activeSec=0;
      last=now();
      turnStartedAt=last;
    },
    finishTurn(m={}){
      if(!running) return;
      addActive();
      running=false;
      const ended=now();
      const x=Object.assign({},meta,m||{});
      const rows=load();
      rows.push({
        id: ended+"-"+Math.random().toString(36).slice(2,8),
        date: localDate(ended),
        subject: x.subject||"未分類",
        app: x.app||document.title||location.pathname.split("/").pop(),
        turnLabel: x.turnLabel||"1ターン",
        durationSec: Math.max(1,Math.round(activeSec)),
        startedAt: turnStartedAt||ended,
        endedAt: ended
      });
      save(rows);
      activeSec=0; last=0; turnStartedAt=null; meta={};
      window.dispatchEvent(new Event("studylogchange"));
    },
    cancelTurn(){
      running=false; activeSec=0; last=0; turnStartedAt=null; meta={};
    }
  };

  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){
      if(running) addActive();
    }else if(running){
      last=now();
    }
  });
})();
</script>


<script>
/* ===== 共通苦手ログ v1 ===== */
(function(){
  if(window.WeakLog) return;
  const KEY="weakLogV1";
  let active=null;
  const now=()=>Date.now();
  function load(){
    try{const x=JSON.parse(localStorage.getItem(KEY)||"{}");return x&&typeof x==="object"?x:{}}
    catch(e){return {}}
  }
  function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
  function cleanKey(s){return String(s??"").trim().slice(0,240)}
  window.WeakLog={
    start(meta={}){
      active={...meta,startedAt:now()};
    },
    result(kind,meta={},elapsedSec=null){
      const m={...(active||{}),...(meta||{})};
      const q=cleanKey(m.question||m.q||m.jp||m.prompt||"");
      const a=cleanKey(m.answer||m.a||m.en||"");
      if(!q && !m.key) return;
      const subject=cleanKey(m.subject||"未分類");
      const app=cleanKey(m.app||document.title||location.pathname.split("/").pop());
      const key=cleanKey(m.key||`${subject}|${app}|${q}|${a}`);
      const db=load();
      const r=db[key]||{
        subject,app,
        category:cleanKey(m.category||m.cat||m.tag||""),
        question:q,answer:a,
        correct:0,wrong:0,timeout:0,
        attempts:0,totalResponseSec:0,
        firstSeenAt:now(),lastSeenAt:now()
      };
      if(kind==="correct") r.correct++;
      else if(kind==="timeout") r.timeout++;
      else r.wrong++;
      r.attempts++;
      let sec=elapsedSec;
      if(sec==null && active?.startedAt) sec=(now()-active.startedAt)/1000;
      if(Number.isFinite(sec) && sec>=0) r.totalResponseSec += Math.min(sec,600);
      r.lastSeenAt=now();
      if(m.category||m.cat||m.tag) r.category=cleanKey(m.category||m.cat||m.tag);
      db[key]=r; save(db); active=null;
    },
    importWeak(meta,list){
      const db=load();
      for(const x of (list||[])){
        if(!x||!(x.wrong>0||x.timeout>0)) continue;
        const subject=cleanKey(meta.subject||x.subject||"未分類");
        const app=cleanKey(meta.app||x.app||"");
        const q=cleanKey(x.question||x.q||"");
        const a=cleanKey(x.answer||x.a||"");
        const key=cleanKey(x.key||`${subject}|${app}|${q}|${a}`);
        const cur=db[key]||{
          subject,app,category:cleanKey(x.category||x.cat||""),
          question:q,answer:a,correct:0,wrong:0,timeout:0,
          attempts:0,totalResponseSec:0,firstSeenAt:now(),lastSeenAt:now()
        };
        cur.wrong=Math.max(cur.wrong||0,Number(x.wrong)||0);
        cur.timeout=Math.max(cur.timeout||0,Number(x.timeout)||0);
        cur.correct=Math.max(cur.correct||0,Number(x.correct)||0);
        cur.attempts=Math.max(cur.attempts||0,cur.wrong+cur.timeout+cur.correct);
        cur.lastSeenAt=now(); db[key]=cur;
      }
      save(db);
    }
  };
})();
</script>

: "物質のすがたとその変化", "q": "純粋な物質が沸騰している間、温度は基本的にどうなるか。", "a": "一定に保たれる", "type": "state", "calc": false, "explain": "正解：一定に保たれる"}, {"id": 54, "subject": "化学", "section": "物質のすがたとその変化", "q": "液体が沸騰するときの温度を何というか。", "a": "沸点", "type": "term", "calc": false, "explain": "正解：沸点"}, {"id": 55, "subject": "化学", "section": "物質のすがたとその変化", "q": "固体がとけるときの温度を何というか。", "a": "融点", "type": "term", "calc": false, "explain": "正解：融点"}, {"id": 56, "subject": "化学", "section": "物質のすがたとその変化", "q": "物質によって融点や沸点は同じか、異なるか。", "a": "異なる", "type": "state", "calc": false, "explain": "正解：異なる"}, {"id": 57, "subject": "化学", "section": "混合物の分け方", "q": "液体を加熱して気体にし、それを冷やして再び液体として集める方法を何というか。", "a": "蒸留", "type": "term", "calc": false, "explain": "正解：蒸留"}, {"id": 58, "subject": "化学", "section": "混合物の分け方", "q": "蒸留は、液体の何の違いを利用して混合物を分ける方法か。", "a": "沸点", "type": "term", "calc": false, "explain": "正解：沸点"}, {"id": 59, "subject": "化学", "section": "混合物の分け方", "q": "水とエタノールの混合物を加熱したとき、先に多く気体になりやすいのはどちらか。", "a": "沸点の低い方", "type": "state", "calc": false, "explain": "正解：沸点の低い方"}, {"id": 60, "subject": "化学", "section": "混合物の分け方", "q": "蒸留装置で出てきた気体を冷やす部分の役割は何か。", "a": "気体を液体に戻す", "type": "method", "calc": false, "explain": "正解：気体を液体に戻す"}, {"id": 61, "subject": "生物", "section": "動物の体のつくりと生活", "q": "動物の体には、その生活のしかたに合ったどのような特徴が見られるか。", "a": "体のつくり", "type": "term", "calc": false, "explain": "正解：体のつくり"}, {"id": 62, "subject": "生物", "section": "動物の体のつくりと生活", "q": "肉食動物と草食動物では、食べるものの違いに応じて何のつくりに違いが見られるか。", "a": "歯", "type": "term", "calc": false, "explain": "正解：歯"}, {"id": 63, "subject": "生物", "section": "動物の体のつくりと生活", "q": "肉食動物で、獲物をとらえるのに適した発達した歯は何か。", "a": "犬歯", "type": "term", "calc": false, "explain": "正解：犬歯"}, {"id": 64, "subject": "生物", "section": "動物の体のつくりと生活", "q": "草食動物で、草をすりつぶすのに適した発達した歯は何か。", "a": "臼歯", "type": "term", "calc": false, "explain": "正解：臼歯"}, {"id": 65, "subject": "生物", "section": "動物の体のつくりと生活", "q": "肉食動物では、目は顔の前方につくことが多いか、側方につくことが多いか。", "a": "前方", "type": "position", "calc": false, "explain": "正解：前方" 呼吸するか。", "a": "肺", "type": "term", "calc": false, "explain": "正解：肺"}, {"id": 80, "subject": "生物", "section": "脊椎動物の特徴", "q": "魚類の体表は主に何でおおわれているか。", "a": "うろこ", "type": "term", "calc": false, "explain": "正解：うろこ"}, {"id": 81, "subject": "生物", "section": "脊椎動物の特徴", "q": "爬虫類の体表は主に何でおおわれているか。", "a": "うろこ", "type": "term", "calc": false, "explain": "正解：うろこ"}, {"id": 82, "subject": "生物", "section": "脊椎動物の特徴", "q": "鳥類の体表は主に何でおおわれているか。", "a": "羽毛", "type": "term", "calc": false, "explain": "正解：羽毛"}, {"id": 83, "subject": "生物", "section": "脊椎動物の特徴", "q": "哺乳類の体表は主に何でおおわれているか。", "a": "毛", "type": "term", "calc": false, "explain": "正解：毛"}, {"id": 84, "subject": "生物", "section": "脊椎動物の特徴", "q": "両生類の体表は、一般にどのような皮膚か。", "a": "しめった皮膚", "type": "state", "calc": false, "explain": "正解：しめった皮膚"}, {"id": 85, "subject": "生物", "section": "脊椎動物の特徴", "q": "卵から子がかえる生まれ方を何というか。", "a": "卵生", "type": "term", "calc": false, "explain": "正解：卵生"}, {"id": 86, "subject": "生物", "section": "脊椎動物の特徴", "q": "母親の体内で育った子が生まれる生まれ方を何というか。", "a": "胎生", "type": "term", "calc": false, "explain": "正解：胎生"}, {"id": 87, "subject": "生物", "section": "脊椎動物の特徴", "q": "体温が外界の温度によって変化する動物を何というか。", "a": "変温動物", "type": "term", "calc": false, "explain": "正解：変温動物"}, {"id": 88, "subject": "生物", "section": "脊椎動物の特徴", "q": "外界の温度が変わっても体温をほぼ一定に保つ動物を何というか。", "a": "恒温動物", "type": "term", "calc": false, "explain": "正解：恒温動物"}, {"id": 89, "subject": "生物", "section": "脊椎動物の特徴", "q": "鳥類は変温動物・恒温動物のどちらか。", "a": "恒温動物", "type": "term", "calc": false, "explain": "正解：恒温動物"}, {"id": 90, "subject": "生物", "section": "脊椎動物の特徴", "q": "哺乳類は変温動物・恒温動物のどちらか。", "a": "恒温動物", "type": "term", "calc": false, "explain": "正解：恒温動物"}, {"id": 91, "subject": "生物", "section": "脊椎動物の特徴", "q": "魚類は変温動物・恒温動物のどちらか。", "a": "変温動物", "type": "term", "calc": false, "explain": "正解：変温動物"}, {"id": 92, "subject": "生物", "section": "脊椎動物の特徴", "q": "両生類は変温動物・恒温動物のどちらか。", "a": "変温動物", "type": "term", "calc": false, "explain": "正解：変温動物"}, {"id": 93, "subject": "生物", "section": "脊椎動物の特徴", "q": "爬虫類は変温動物・恒温動物のどちらか。", "a": "変温動物", "type": "term", "calc": false, "explain": "正解：変温動物"}, {"id": 94, "subject": "生物", "section": "無脊椎動物", "q": "背骨がない動物を何というか。", "a": "無脊椎動物", "type": "term", "calc": false, "explain": "正解：無脊椎動物"}, {"id": 95, "subject": "生物", "section": "無脊椎動物", "q": "昆虫やエビ・カニのなかまなど、体やあしに節がある動物を何というか。", "a": "節足動物", "type": "term", "calc": false, "explain": "正解：節足動物"}, {"id": 96, "subject": "生物", "section": "節足動物", "q": "節足動物の体をおおう、かたい殻のようなつくりを何というか。", "a": "外骨格", "type": "term", "calc": false, "explain": "正解：外骨格"}, {"id": 97, "subject": "生物", "section": "節足動物", "q": "昆虫類の体は、基本的に何・何・何の3つに分かれるか。", "a": "頭部・胸部・腹部", "type": "group", "calc": false, "explain": "正解：頭部・胸部・腹部"}, {"id": 98, "subject": "生物", "section": "節足動物", "q": "昆虫類のあしは胸部に何対あるか。", "a": "3対", "type": "number", "calc": false, "explain": "正解：3対"}, {"id": 99, "subject": "生物", "section": "節足動物", "q": "昆虫類のあしは全部で何本か。", "a": "6本", "type": "number", "calc": false, "explain": "正解：6本"}, {"id": 100, "subject": "生物", "section": "節足動物", "q": "昆虫類の触角は何対あるか。", "a": "1対", "type": "number", "calc": false, "explain": "正解：1対"}, {"id": 101, "subject": "生物", "section": "節足動物", "q": "昆虫は体のどこにある気門から空気を取り入れるか。", "a": "体側", "type": "position", "calc": false, "explain": "正解：体側"}, {"id": 102, "subject": "生物", "section": "節足動物", "q": "昆虫が空気を体内に運ぶ管を何というか。", "a": "気管", "type": "term", "calc": false, "explain": "正解：気管"}, {"id": 103, "subject": "生物", "section": "節足動物", "q": "エビやカニなどのなかまを何類というか。", "a": "甲殻類", "type": "term", "calc": false, "explain": "正解：甲殻類"}, {"id": 104, "subject": "生物", "section": "節足動物", "q": "エビやカニなどの甲殻類は主に何で呼吸するか。", "a": "えら", "type": "term", "calc": false, "explain": "正解：えら"}, {"id": 105, "subject": "生物", "section": "節足動物", "q": "節足動物は、成長するときに何を行うか。", "a": "脱皮", "type": "term", "calc": false, "explain": "正解：脱皮"}, {"id": 106, "subject": "生物", "section": "軟体動物", "q": "アサリやイカなど、内臓がやわらかい膜に包まれている動物を何というか。", "a": "軟体動物", "type": "term", "calc": false, "explain": "正解：軟体動物"}, {"id": 107, " function shuffle(arr){
  const x=[...arr];
  for(let i=x.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}

function uniq(arr){ return [...new Set(arr)]; }
function pick(arr,n){ return shuffle(arr).slice(0,Math.min(n,arr.length)); }

function stats(){
  try{ return JSON.parse(localStorage.getItem(STORE)||"{}"); }
  catch{ return {}; }
}

function saveMiss(id,kind){
  const s=stats(), k=String(id);
  s[k]=s[k]||{wrong:0,timeout:0};
  s[k][kind]=(s[k][kind]||0)+1;
  localStorage.setItem(STORE,JSON.stringify(s));
}

function rewardCorrect(id){
  const s=stats(), k=String(id);
  if(!s[k]) return;
  s[k].wrong=Math.max(0,(s[k].wrong||0)-1);
  s[k].timeout=Math.max(0,(s[k].timeout||0)-1);
  localStorage.setItem(STORE,JSON.stringify(s));
}

function buildSession(mode){
  const chem=ALL.filter(q=>q.subject==="化学");
  const bio=ALL.filter(q=>q.subject==="生物");
  if(mode==="chem") return pick(chem,20);
  if(mode==="bio") return pick(bio,20);
  if(mode==="mix") return shuffle([...pick(chem,10),...pick(bio,10)]);
  const s=stats();
  const weak=ALL.map(q=>({
    q, score:(s[q.id]?.wrong||0)*2+(s[q.id]?.timeout||0)
  })).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).map(x=>x.q);
  if(weak.length>=20) return shuffle(weak.slice(0,35)).slice(0,20);
  const rest=ALL.filter(q=>!weak.some(w=>w.id===q.id));
  return shuffle([...weak,...pick(rest,20-weak.length)]);
}

function nearNumber(q){
  const a=q.a.replace(/\s+/g,"");
  let m;

  // 月の範囲
  m=a.match(/^(\d+)～(\d+)月(上旬|中旬|下旬)?$/);
  if(m){
    const lo=+m[1], hi=+m[2], tail=m[3]||"";
    return [
      `${Math.max(1,lo-1)}～${Math.max(2,hi-1)}月${tail}`,
      `${Math.min(12,lo+1)}～${Math.min(12,hi+1)}月${tail}`,
      `${Math.max(1,lo-1)}～${hi}月${tail}`
    ];
  }

  // 数値範囲
  m=a.match(/^(\d+)～(\d+)(cm|個|本|g|％)$/);
  if(m){
    const lo=+m[1], hi=+m[2], u=m[3];
    const d=(u==="個" && hi>=10)?2:1;
    return [
      `${Math.max(1,lo-d)}～${Math.max(lo,hi-d)}${u}`,
      `${lo+d}～${hi+d}${u}`,
      `${Math.max(1,lo-d)}～${hi+d}${u}`
    ];
  }

  // 単一数値
  m=a.match(/^(\d+)(g|％|本|個|対|種類|cm)$/);
  if(m){
    const n=+m[1], u=m[2];
    let vals;
    if(u==="g"){
      let d=n>=100?20:n>=50?10:5;
      vals=[Math.max(1,n-d),n+d,n+2*d];
    }else if(u==="％"){
      vals=[Math.max(1,n-5),n+5,n+10];
    }else{
      vals=[Math.max(1,n-1),n+1,n+2];
    }
    return vals.map(v=>`${v}${u}`);
  }
  return [];
}

      "異なる":["同じ","必ず比例する","温度だけで決まる"]
    };
    return map[a];
  }
  if(a==="溶質の質量÷溶液の質量×100")
    return ["溶液の質量÷溶質の質量×100","溶質の質量÷溶媒の質量×100","溶媒の質量÷溶液の質量×100"];
  if(a==="沸点の低い方")
    return ["沸点の高い方","質量の大きい方","密度の大きい方"];
  if(a==="気体を液体に戻す")
    return ["液体を気体にする","固体を液体にする","溶質を結晶にする"];
  if(a==="水を蒸発させる")
    return ["水溶液を冷却する","水を加えて薄める","ろ紙でろ過する"];
  if(a==="規則正しく並んだ固体")
    return ["不規則に並んだ固体","粒子が自由に動く固体","粒子を含まない固体"];

  // ---------- 生物：分類 ----------
  if(/何類に分類|何類というか|何類か/.test(t)){
    if(["魚類","両生類","爬虫類","鳥類","哺乳類"].includes(a))
      return ["魚類","両生類","爬虫類","鳥類","哺乳類"].filter(x=>x!==a).slice(0,3);
    if(a==="甲殻類") return ["昆虫類","クモ類","多足類"];
  }
  if(a==="脊椎動物") return ["無脊椎動物","節足動物","軟体動物"];
  if(a==="無脊椎動物") return ["脊椎動物","節足動物","軟体動物"];
  if(a==="節足動物") return ["軟体動物","環形動物","刺胞動物"];
  if(a==="軟体動物") return ["節足動物","環形動物","刺胞動物"];

  // ---------- 生物：体のつくり ----------
  if(a==="犬歯") return ["門歯","臼歯","切歯"];
  if(a==="臼歯") return ["犬歯","門歯","切歯"];
  if(a==="前方") return ["側方","上方","後方"];
  if(a==="側方") return ["前方","上方","後方"];
  if(a==="内骨格") return ["外骨格","外とう膜","殻"];
  if(a==="外骨格") return ["内骨格","外とう膜","表皮"];
  if(a==="背骨") return ["胸骨","肋骨","頭骨"];
  if(a==="外とう膜") return ["外骨格","内骨格","角質層"];
  if(a==="気管") return ["気門","えら","肺"];
  if(a==="体側") return ["背面","腹面","頭部"];
  if(a==="頭部・胸部・腹部")
    return ["頭部・胴部・尾部","頭胸部・腹部・尾部","頭部・腹部・尾部"];

  // ---------- 生物：呼吸 ----------
  if(/呼吸/.test(t)){
    if(a==="えら") return ["肺","皮膚","気管"];
    if(a==="肺") return ["えら","皮膚","気管"];
    if(a==="肺と皮膚") return ["えらと皮膚","肺と気管","えらと肺"];
    if(a==="えら呼吸") return ["肺呼吸","皮膚呼吸","気管呼吸"];
  }

  // ---------- 生物：体表 ----------
  if(/体表|皮膚|おおわれ/.test(t)){
    if(a==="うろこ") return ["羽毛","毛","しめった皮膚"];
    if(a==="羽毛") return ["うろこ","毛","しめった皮膚"];
    if(a==="毛") return ["羽毛","うろこ","しめった皮膚"];
    if(a==="しめった皮膚") return ["乾いたうろこ","羽毛","毛"];
  }

  // ---------- 生物：生殖・体温 ----------
  if(a==="卵生") return ["胎生","卵胎生","分裂"];
  if(a==="胎生") return ["卵生","卵胎生","出芽"];
  if(a==="変温動物") return ["恒温動物","内温動物","定温動物"];
  if(a==="恒温動物") return ["変温動物","外温動物","不定温動物"];

  // ---------- トカゲ・ヤモリ・イモリ ----------
  if(a==="キール") return ["指下板","外とう膜","角質板"];
  if(a==="カナヘビ") return ["ニホントカゲ","ニホンヤモリ","アカハライモリ"];
  if(a==="昼行性") return ["夜行性","薄明薄暮性","昼夜行性"];
  if(a==="夜行性") return ["昼行性","薄明薄暮性","昼夜行性"];
  if(a==="自切") return ["脱皮","再生","変態"];
  if(a==="軟骨") return ["硬骨","結合組織","角質"];
  if(a==="人家や社寺など") return ["草地や林縁","池や湿地","河川や水田"];
  if(a==="円く広がっている") return ["細長くとがっている","扇状に広がっている","鉤状に曲がっている"];
  if(a==="鉤状の細かな毛") return ["吸盤状の突起","粘液を出す腺","鉤状の爪"];
  if(a==="壁やガラスの凹凸") return ["表面の水分","静電気だけ","粘液の膜"];
  if(a==="ひだ状の鱗") return ["吸盤状の皮膚","板状の爪","網目状の膜"];
  if(a==="シナントロープ") return ["エンドミック","インディケーター種","キーストーン種"];
  if(a==="透明な薄いうろこ") return ["まぶた","瞬膜","透明な角膜だけ"];
  if(a==="有尾目イモリ科") return ["無尾目アマガエル科","有鱗目ヤモリ科","有鱗目トカゲ科"];
  if(a==="日本固有種") return ["外来種","帰化種","世界共通種"];
  if(a==="細かい隆起") return ["大きな鱗","羽毛","滑らかな甲羅"];
  if(a==="陸上") return ["水中","樹上","地中だけ"];
  if(a==="湿潤な湿地や林床") return ["乾燥した砂地","開けた草原","海岸の岩場"];
  if(a==="その周囲の湿地環境") return ["乾燥した草地","海水域","高木の樹冠"];
  if(a==="毒") return ["粘液だけ","硬い鱗","羽毛"];
  if(a==="よく手を洗う") return ["水分を拭くだけ","手を温める","何もしない"];
  if(a==="高い再生能力") return ["高い飛翔能力","高い発光能力","高い擬態能力"];
  if(a==="立体的に移動する") return ["平面だけを移動する","水中を遊泳する","地中だけを移動する"];
  if(a==="孵化するまで保護する") return ["産卵後すぐ離れる","口の中で育てる","水中へ運ぶ"];

  // 色
  const colorMap={
    "鮮やかな青色":["青緑色","紫色","黒褐色"],
    "一様な茶褐色":["灰褐色","黒褐色","黄褐色"],
    "橙色":["赤色","黄色","赤褐色"],
    "黒色（黒褐色）":["灰褐色","茶褐色","暗緑色"],
    "赤～オレンジ色":["黄～オレンジ色","赤～紫色","黒～赤褐色"]
  };
  if(colorMap[a]) return colorMap[a];

  // 利点・状態
  if(a==="立体的に見える範囲が広い")
    return ["見渡せる範囲が広い","暗い場所でも色を見分けやすい","遠くの音を聞き取りやすい"];
  if(a==="広い範囲を見渡せる")
    return ["立体的に見える範囲が広い","近くの物だけ大きく見える","暗所で色を見分けやすい"];
  if(a==="全体に均一に広がっている")
    return ["底に多く集まっている","表面に多く集まっている","中央だけに集まっている"];
  if(a==="全体に均一に散らばっている")
    return ["底に沈んでいる","表面に浮いている","一か所に固まっている"];
  if(a==="同じ（均一）")
    return ["上の方が濃い","下の方が濃い","時間とともに上下が逆転する"];

  // yes/no 系
  const yn={
    "いえない":["いえる","条件によって必ずいえる","時間がたてばいえる"],
    "よくない":["よい","溶質が固体ならよい","水溶液が透明ならよい"],
    "含まれる":["含まれない","ろ過直後だけ含まれない","固体としてだけ含まれる"],
    "適している":["適していない","温度に関係しない","蒸留にだけ適している"],
    "示す":["示さない","毎回異なる形になる","温度だけで形が決まる"],
    "読み取れる":["読み取れない","温度だけ読み取れる","濃度だけ読み取れる"],
    "ある":["ない","幼体にだけある","成体にだけある"],
    "ない":["ある","幼体にだけある","成体にだけある"]
  };
  if(yn[a]) return yn[a];

  return [];
}

function autoDistractors(q){
  // 数値・時期は「近い値」で統一
  if(["number","calc","time"].includes(q.type)){
    const n=nearNumber(q);
    if(n.length>=3) return n.slice(0,3);
  }

  // 問いの意味に合わせた、理科として紛らわしい誤答
  const sem=semanticDistractors(q);
  if(sem.length>=3) return sem.filter(x=>x!==q.a).slice(0,3);

  // 最終フォールバックも「同じセクション＋同じ型」を最優先
  let pool=ALL.filter(x=>x.id!==q.id && x.section===q.section && x.type===q.type && x.a!==q.a).map(x=>x.a);
  if(pool.length<3) pool=pool.concat(ALL.filter(x=>x.id!==q.id && x.subject===q.subject && x.type===q.type && x.a!==q.a).map(x=>x.a));
  if(pool.length<3) pool=pool.concat(ALL.filter(x=>x.id!==q.id && x.section===q.section && x.a!==q.a).map(x=>x.a));
  return uniq(pool).slice(0,3);
}

function start(mode,custom=null){
StudyLog.startTurn({subject:'理科',app:'理科・シャッフル',turnLabel:'1ターン'});
  currentMode=mode;
  session=custom||buildSession(mode);

  // 20問を「枠」としてキューに入れる。同じ問題が再出題されても、
  // その枠で正解するまでターンは終わらない。
  queue=session.map((q,i)=>({q,slot:i,attempt:1}));
  currentItem=null;
  cleared=new Set();
  firstAttemptDone=new Set();
  firstCorrectCount=0;
  wrongCount=0;
  timeoutCount=0;
  totalAttempts=0;

  $("#start").classList.add("hidden");
  $("#result").classList.add("hidden");
  $("#quiz").classList.remove("hidden");
  showQuestion();
}

function showQuestion(){
try{const z=currentItem?.q||currentItem; if(z) WeakLog.start({subject:'理科',app:'理科・シャッフル',category:z.cat||'',question:z.q||'',answer:z.a||''})}catch(e){}
  locked=false;
  clearInterval(timerId);

  if(queue.length===0){
    showResult();
    return;
  }

  currentItem=queue.shift();
  const q=currentItem.q;
  totalAttempts++;

  $("#modePill").textContent=modeLabel();
  $("#counter").textContent=`クリア ${cleared.size} / 20`;
  $("#progressBar").style.width=`${cleared.size/20*100}%`;
  $("#section").innerHTML=q.section;
  $("#question").textContent=q.q;
  $("#feedback").className="feedback";
  $("#feedback").textContent="";
  $("#nextBtn").className="next";

  let distractors=autoDistractors(q);
  if(distractors.length<3){
    const fallback=ALL.filter(x=>x.id!==q.id && x.subject===q.subject).map(x=>x.a).filter(a=>a!==q.a);
    distractors=uniq([...distractors,...shuffle(fallback)]).slice(0,3);
  }

  const opts=shuffle([q.a,...distractors]);
  $("#choices").innerHTML="";
  opts.forEach(opt=>{
    const b=document.createElement("button");
    b.className="choice";
    b.textContent=opt;
    b.onclick=()=>answer(opt,b);
    $("#choices").appendChild(b);
  });
  timeLeft=Infinity; updateTimer();
}

function updateTimer(){
  $("#timerNum").textContent="∞";
  $("#timerBar").style.width="100%";
  $("#timerBar").style.background="#94a3b8";
}

function lockChoices(correct,clicked=null,showNext=true){
  document.querySelectorAll(".choice").forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct) b.classList.add("correct");
  });
  if(clicked && clicked.textContent!==correct) clicked.classList.add("wrong");
  if(showNext) $("#nextBtn").classList.add("show");
}

function answer(opt,btn){
  if(locked) return;
  locked=true;
  clearInterval(timerId);

  const item=currentItem;
  const q=item.q;
  const ok=opt===q.a;
  const f=$("#feedback");

  if(ok){
    if(item.attempt===1 && !firstAttemptDone.has(item.slot)){
      firstAttemptDone.add(item.slot);
      firstCorrectCount++;
    }
    cleared.add(item.slot);
    rewardCorrect(q.id);

    lockChoices(q.a,btn,false);
    f.className="feedback show good";
    f.innerHTML=`✅ 正解！<br><b>${q.explain}</b>`;

    $("#counter").textContent=`クリア ${cleared.size} / 20`;
    $("#progressBar").style.width=`${cleared.size/20*100}%`;

    // 正解は1秒後に自動遷移
    setTimeout(showQuestion,1000);
  }else{
    if(item.attempt===1) firstAttemptDone.add(item.slot);
    wrongCount++;
    saveMiss(q.id,"wrong");

    // 正解するまで末尾へ戻す
    queue.push({q,slot:item.slot,attempt:item.attempt+1});

    lockChoices(q.a,btn,true);
    f.className="feedback show bad";
    f.innerHTML=`❌ 正解は「<b>${q.a}</b>」<br>この問題は、もう一度出題されます。`;
  }
}

function timeout(){
 try{WeakLog.result('timeout')}catch(e){}
  if(locked) return;
  locked=true;
  clearInterval(timerId);

  const item=currentItem;
  const q=item.q;
  if(item.attempt===1) firstAttemptDone.add(item.slot);
  timeoutCount++;
  saveMiss(q.id,"timeout");

  // 時間切れも正解するまで末尾へ戻す
  queue.push({q,slot:item.slot,attempt:item.attempt+1});

  lockChoices(q.a,null,true);
  const f=$("#feedback");
  f.className="feedback show bad";
  f.innerHTML=`⏰ 時間切れ！<br>正解は「<b>${q.a}</b>」<br>この問題は、もう一度出題されます。`;
}

$("#nextBtn").onclick=showQuestion;

function showResult(){
StudyLog.finishTurn({subject:'理科',app:'理科・シャッフル',turnLabel:'1ターン'});
  clearInterval(timerId);
  $("#quiz").classList.add("hidden");
  $("#result").classList.remove("hidden");

  const firstScore=Math.round(firstCorrectCount/20*100);

  $("#score").textContent="20 / 20 クリア";
  $("#scoreText").textContent=`最終的に全問正解。初回正答率は ${firstScore}点（${firstCorrectCount}/20問）`;
  $("#correctCount").textContent=firstCorrectCount;
  $("#wrongCount").textContent=wrongCount;
  $("#timeoutCount").textContent=timeoutCount;

  $("#encourage").textContent=(wrongCount===0 && timeoutCount===0)
    ? "🎉 初回から全問正解！"
    : `全問正解までの総挑戦回数は ${totalAttempts}回。間違えた問題も正解してから終了しました。`;

  // この版ではターン内で必ずやり直すので、結果画面の「間違いだけ復習」は不要
  $("#retryWrong").classList.add("hidden");
}

$("#sameAgain").onclick=()=>start(currentMode);

$("#homeBtn").onclick=()=>{ window.location.href="science.html"; };

document.querySelectorAll(".mode, .mix-hero").forEach(b=>b.onclick=()=>start(b.dataset.mode));
</script>

<script>
window.addEventListener("load", function(){
  setTimeout(function(){
    if (typeof start === "function") start("mix");
  }, 0);
});
</script>
