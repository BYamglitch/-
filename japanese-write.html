<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#d7dce5;--accent:#5b5bd6;--good:#137333;--bad:#b42318}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink)}
.wrap{max-width:920px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
h1{font-size:clamp(24px,4vw,36px);margin:0 0 8px}.sub{color:var(--muted);margin-bottom:18px;line-height:1.6}
.grid{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
button,.btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:14px;min-height:52px;padding:12px 14px;font-size:17px;font-weight:700;color:var(--ink);touch-action:manipulation}
button.sel{border-color:var(--accent);background:#eeeeff;color:#3333a8} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)} button:disabled{opacity:.45}
label{font-weight:700;display:block;margin:16px 0 8px}.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px;font-weight:700}.pill{background:#eef0f6;border-radius:999px;padding:8px 12px}
.progress{height:10px;background:#e8eaf0;border-radius:999px;overflow:hidden;margin:10px 0 18px}.progress>div{height:100%;background:var(--accent);width:0;transition:width .25s}
.qtype{font-size:15px;color:var(--muted);font-weight:700}.question{font-size:clamp(28px,6vw,48px);font-weight:800;line-height:1.35;margin:16px 0 18px;word-break:break-word}
.prompt{font-size:clamp(20px,4.7vw,31px);font-weight:750;line-height:1.7;margin:14px 0 18px}.rubyhint{font-size:15px;color:var(--muted);margin-top:-8px;margin-bottom:14px}
.inputRow{display:flex;gap:10px;align-items:stretch}.ans{flex:1;min-width:0;border:2px solid #bfc5d2;border-radius:14px;padding:14px 16px;font-size:26px;min-height:58px;background:#fff}
.feedback{min-height:60px;margin-top:14px;border-radius:14px;padding:14px 16px;font-size:18px;font-weight:700;line-height:1.5}.ok{background:#e9f7ee;color:var(--good)}.ng{background:#fdecea;color:var(--bad)}
.voiceStatus{margin-top:8px;color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#f2f4f8;border-radius:14px;padding:14px;text-align:center}.stat b{font-size:26px;display:block}
.small{font-size:14px;color:var(--muted);line-height:1.5}.source{font-size:13px;color:#8a93a3;margin-top:16px}
@media(max-width:620px){.grid4{grid-template-columns:repeat(2,1fr)}.inputRow{flex-direction:column}.stats{grid-template-columns:1fr 1fr}.card{padding:18px}.grid2{grid-template-columns:1fr 1fr}}
</style>

function requestCheck(){
 if(locked||checkScheduled)return;
 checkScheduled=true;
 // iPadのスクリブル/日本語IMEは、書き終えた直後は変換結果をまだinputへ確定していないことがある。
 // 先に入力欄を確定させ、少し待ってから採点することで「答える」をすぐ押しても固まらないようにする。
 const a=$('#answer');
 try{a.blur()}catch(e){}
 checkTimer=setTimeout(()=>{
   checkTimer=null;checkScheduled=false;
   if(isComposing){pendingCheck=true;return;}
   check();
 },180);
}
$('#checkBtn').onclick=requestCheck;
$('#answer').addEventListener('input',()=>{if(mode==='reading')normalizeReadingField()});
$('#answer').addEventListener('compositionstart',()=>{isComposing=true});
$('#answer').addEventListener('compositionend',()=>{
 isComposing=false;
 if(mode==='reading')normalizeReadingField();
 if(pendingCheck){pendingCheck=false;setTimeout(requestCheck,40)}
});
$('#answer').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();requestCheck()}}); $('#nextBtn').onclick=renderNext;
function endTurn(){
 totalFirst+=firstCorrect;totalMiss+=misses;$('#quiz').classList.add('hidden');$('#turnEnd').classList.remove('hidden');$('#turnEndTitle').textContent=`${currentTurn}ターン目 クリア！`;$('#firstScore').textContent=`${firstCorrect}/20`;$('#missCount').textContent=misses;
 $('#continueBtn').textContent=currentTurn<turns?'次のターンへ':'結果を見る';
}
$('#continueBtn').onclick=()=>{if(currentTurn<turns){currentTurn++;startTurn()}else finish()};
function finish(){ $('#turnEnd').classList.add('hidden');$('#finish').classList.remove('hidden');$('#totalFirst').textContent=`${totalFirst}/${turns*20}`;$('#totalMiss').textContent=totalMiss;$('#totalClear').textContent=turns*20;$('#finishMsg').textContent=`${turns}ターン、合計${turns*20}問をすべて正解までやり切りました。` }
// SpeechRecognition
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let rec=null;
if(SR){rec=new SR();rec.lang='ja-JP';rec.interimResults=false;rec.maxAlternatives=5;rec.onstart=()=>$('#voiceStatus').textContent='聞き取り中…';rec.onresult=e=>{
  const candidates=[...e.results[0]].map(r=>r.transcript);
  let hira='';
  for(const t of candidates){
    const c=readingInputToHiragana(t);
    if(!containsKanji(c)){hira=c;break}
  }
  if(!hira && current&&current.item){
    const exact=candidates.some(t=>norm(t)===norm(current.item.term)||norm(t)===norm(current.item.writing));
    if(exact) hira=current.item.reading;
  }
  if(hira){
    $('#answer').value=hira;
    $('#voiceStatus').textContent='認識：'+hira;
  }else{
    $('#answer').value='';
    $('#voiceStatus').textContent='ひらがなに変換できませんでした。もう一度話してください。';
  }
};rec.onerror=e=>$('#voiceStatus').textContent='音声入力を利用できませんでした。キーボードのマイクをお試しください。';rec.onend=()=>{if($('#voiceStatus').textContent==='聞き取り中…')$('#voiceStatus').textContent=''} }
$('#voiceBtn').onclick=()=>{if(!SR){$('#voiceStatus').textContent='このブラウザでは音声認識ボタンが使えません。iPadキーボードのマイクをご利用ください。';return} try{rec.start()}catch(e){}}
</script></body></html>
